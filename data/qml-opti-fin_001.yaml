    = 1⌈1 1⌉. ψ 2 2 2 1 1 ](img/file253.jpg)'
- en: Unlike pure quantum states, mixed quantum states cannot be described by a single
    state vector. However, the pure states and the mixed states can be described by
    the density matrix.
  id: totrans-357
  prefs: []
  type: TYPE_NORMAL
  zh: 与纯量子态不同，混合量子态无法用单一的态矢量来描述。然而，纯态和混合态都可以通过密度矩阵来描述。
- en: Summary
  id: totrans-358
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 总结
- en: In this chapter, we learned the key principles of quantum mechanics, starting
    with a review of the basic elements of linear algebra, followed by an introduction
    to Dirac notations.
  id: totrans-359
  prefs: []
  type: TYPE_NORMAL
  zh: 在本章中，我们学习了量子力学的关键原理，首先回顾了线性代数的基本元素，然后介绍了狄拉克符号。
- en: We then covered the main postulates of quantum mechanics and their relevance
    to quantum computing. We learned how to describe the state (statics) and the evolution
    (dynamics) of a closed system, the interactions of a system with external systems
    (measurement), observables, as well as the state of a composite system in terms
    of its component parts.
  id: totrans-360
  prefs: []
  type: TYPE_NORMAL
  zh: 我们接着介绍了量子力学的主要公设及其在量子计算中的相关性。我们学习了如何描述一个封闭系统的状态（静态）和演化（动态），系统与外部系统的相互作用（测量），可观察量，以及复合系统的状态如何通过其组成部分来表示。
- en: We finally introduced the density operator, which allows us to describe both
    pure and mixed quantum states, contrasting with the state vector, which can only
    represent pure quantum states.
  id: totrans-361
  prefs: []
  type: TYPE_NORMAL
  zh: 我们最终介绍了密度算符，它使我们能够描述纯态和混合态量子态，并与只能表示纯量子态的态矢量进行对比。
- en: In the next chapter, we will look at an application of the principles of quantum
    mechanics to analog quantum computing – quantum annealing.
  id: totrans-362
  prefs: []
  type: TYPE_NORMAL
  zh: 在下一章中，我们将探讨量子力学原理在模拟量子计算中的应用——量子退火。
