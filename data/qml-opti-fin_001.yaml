  id: totrans-0
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '1'
- en: The Principles of Quantum Mechanics
  id: totrans-1
  prefs: []
  type: TYPE_NORMAL
  zh: 量子力学原理
- en: Quantum mechanics is a framework for the development of physical theories; it
    is not itself a physical theory  [[80](Biblography.xhtml#XDawar)]. Actual physical
    theories are built upon a foundation of quantum mechanics. This is why quantum
    mechanics plays such an important role in all natural sciences. Information theory
    is no exception and also derives inspiration from the ideas and methods of quantum
    mechanics.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 量子力学是物理理论发展的框架；它本身并不是一种物理理论[[80](Biblography.xhtml#XDawar)]。实际的物理理论是建立在量子力学的基础之上的。这也是为什么量子力学在所有自然科学中扮演着如此重要的角色。信息理论也不例外，同样从量子力学的思想和方法中获得了启发。
- en: Understanding quantum computing requires some familiarity with the basic principles
    of quantum mechanics. This book does not assume any prior knowledge of quantum
    mechanics and provides all the necessary definitions and explanations when needed.
    At the same time, the reader is encouraged to learn more about this fascinating
    subject at the level of mathematical formalism that she is comfortable with. Out
    of the extensive universe of textbooks on quantum mechanics that provide an introduction
    to this discipline, it is necessary to mention the classical book by Landau and
    Lifshitz  [[182](Biblography.xhtml#XLandau1965)] as well as the equally classical
    book on quantum computing by Nielsen and Chuang  [[223](Biblography.xhtml#XNielsen2010)],
    which covers the most relevant aspects of quantum mechanics from the quantum computing
    perspective. For someone taking their first steps in quantum computing who would
    like to get the overall picture and some historical perspective, the excellent
    book by Bernhardt  [[32](Biblography.xhtml#XBernhardt2019)] provides both without
    the heavy usage of complex mathematical apparatus. Readers looking for a more
    formal modern take on the subject of quantum mechanics may find it in the book
    by Robinett   [[249](Biblography.xhtml#XRobinett2006)]. The practical aspects
    of quantum computing are covered in great detail in the book by Sutor  [[278](Biblography.xhtml#XSutor2019)],
    and anyone looking for a python quantum computing programming textbook will find
    it in the work by Loredo  [[195](Biblography.xhtml#XLoredo2020)].
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 理解量子计算需要对量子力学的基本原理有一定的了解。本书不假定读者已有量子力学的背景知识，并在需要时提供所有必要的定义和解释。同时，鼓励读者根据自己熟悉的数学形式主义，进一步了解这一迷人的学科。在介绍量子力学的广泛教科书宇宙中，有必要提到经典的**兰道和李夫希茨**的书籍[[182](Biblography.xhtml#XLandau1965)]，以及同样经典的**尼尔森和程**关于量子计算的书籍[[223](Biblography.xhtml#XNielsen2010)]，它们从量子计算的角度涵盖了量子力学的最相关方面。对于刚开始接触量子计算并希望获得整体概念和历史视角的人来说，**伯恩哈特**的优秀书籍[[32](Biblography.xhtml#XBernhardt2019)]提供了这些内容，并且没有大量使用复杂的数学工具。寻求量子力学正式现代解读的读者可以参考**罗宾内特**的书籍[[249](Biblography.xhtml#XRobinett2006)]。量子计算的实际应用方面则在**苏托尔**的书籍[[278](Biblography.xhtml#XSutor2019)]中得到了详细阐述，任何寻求量子计算编程的Python教材的读者，都可以在**洛雷多**的著作[[195](Biblography.xhtml#XLoredo2020)]中找到。
- en: 1.1 Linear Algebra for Quantum Mechanics
  id: totrans-4
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.1 量子力学中的线性代数
- en: Quantum computing and quantum mechanics rely on a specific notational formalism,
    due to Dirac, and are supported by classical linear algebra, in particular Hermitian
    structures of matrices and tensor products. We provide here a self-contained review
    of these tools to facilitate the understanding of the rest of the book. We start
    with basic linear algebra principles before introducing Dirac notations and the
    quantum counterparts of linear algebra tools. Sections [1.1.1](#x1-240001) to [1.1.4](#x1-270004)
    concentrate on standard definitions of finite-dimensional Hilbert spaces and matrices,
    while Sections [1.1.5](#x1-280005) to [1.1.7](#x1-300007) review the key details
    and properties of complex matrices (decompositions, Hermitian property, and rotations).
    Sections [1.1.9](#x1-320009) to [1.1.11](#x1-3400011) introduce Dirac’s formalism
    and the essential aspects of quantum operators.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 量子计算和量子力学依赖于一种特定的符号体系，这是由于**狄拉克**的贡献，并且得到了经典线性代数的支持，特别是矩阵的厄米结构和张量积。我们在这里提供了这些工具的独立回顾，以便于理解本书的其余部分。我们从基本的线性代数原理开始，然后介绍狄拉克符号和线性代数工具的量子对应物。第[1.1.1](#x1-240001)节到第[1.1.4](#x1-270004)节集中介绍有限维希尔伯特空间和矩阵的标准定义，而第[1.1.5](#x1-280005)节到第[1.1.7](#x1-300007)节回顾了复矩阵的关键细节和性质（分解、厄米性质和旋转）。第[1.1.9](#x1-320009)节到第[1.1.11](#x1-3400011)节介绍了狄拉克的形式主义及量子算符的基本方面。
- en: 1.1.1 Basic definitions and notations
  id: totrans-6
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.1 基本定义和符号
- en: We let 𝔽 denote either the real field ℝ or the complex one ℂ. For a complex
    number *z* = *x*+i*y* ∈ℂ, with *x,y* ∈ℝ, we write the conjugate *z*^∗ := *x*−i*y*.
    We let ℳ[m,n](𝔽) denote the space of matrices of dimension *m* × *n* with entries
    in 𝔽 and ℳ[n](𝔽) whenever *m* = *n*. For A := (*a*[ij])[1≤i≤m; 1≤j≤n] ∈ℳ[m,n](𝔽),
    A^∗ := (*a*[ij]^∗)[1≤i≤m; 1≤j≤n] is the complex conjugate. If A ∈ℳ[n](𝔽), we write
    A^⊤ for its transpose and A^† := (A^∗)^⊤ for its *Hermitian conjugate*. We finally
    denote I the identity matrix and write I[n] whenever we wish to emphasise the
    dimension, and 0[m,n] the null matrix in ℳ[m,n](𝔽). Recall that a matrix A ∈ℳ[n](𝔽)
    is invertible (or non-singular) if there exists B ∈ℳ[n](𝔽) such that AB = BA =
    I[n]. Given two matrices A ∈ℳ[p,m](𝔽) and B ∈ℳ[q,n](𝔽), we define their tensor
    product as
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 我们令𝔽表示实数域ℝ或复数域ℂ。对于复数*z* = *x*+i*y* ∈ℂ，其中 *x,y* ∈ℝ，我们写作共轭 *z*^∗ := *x*−i*y*。我们令ℳ[m,n](𝔽)表示维度为*m*
    × *n*，元素为𝔽的矩阵空间；当*m* = *n*时，写作ℳ[n](𝔽)。对于 A := (*a*[ij])[1≤i≤m; 1≤j≤n] ∈ℳ[m,n](𝔽)，A^∗
    := (*a*[ij]^∗)[1≤i≤m; 1≤j≤n] 是其复共轭。如果 A ∈ℳ[n](𝔽)，我们写 A^⊤ 表示其转置，A^† := (A^∗)^⊤
    表示其*厄米共轭*。最后，令I为单位矩阵，并在需要强调维度时写作I[n]，0[m,n]表示ℳ[m,n](𝔽)中的零矩阵。回想一下，若矩阵A ∈ℳ[n](𝔽)是可逆的（或非奇异的），则存在B
    ∈ℳ[n](𝔽)使得 AB = BA = I[n]。对于两个矩阵A ∈ℳ[p,m](𝔽) 和 B ∈ℳ[q,n](𝔽)，我们定义它们的张量积为
- en: '![ ⌊ ⌋ a11B ... a1mB || .. .. .. || A ⊗ B := ⌈ . . . ⌉ ∈ ℳpq,mn (𝔽). ap1B ...
    apmB ](img/file3.jpg)'
  id: totrans-8
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ a11B ... a1mB || .. .. .. || A ⊗ B := ⌈ . . . ⌉ ∈ ℳpq,mn (𝔽). ap1B ...
    apmB ](img/file3.jpg)'
- en: Since a vector is a particular case of a matrix, for u ∈𝔽^m and v ∈𝔽^n, we can
    write
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 由于向量是矩阵的一种特例，对于 u ∈𝔽^m 和 v ∈𝔽^n，我们可以写作
- en: '![ ⌊ ⌋ |u1v1 | ⌊ ⌋ ⌊ ⌋ || ... || u1 v1 | | || .. || || ..|| ||u1vn || mn u
    ⊗ v = ⌈ . ⌉ ⊗ ⌈ .⌉ = ||u v || ∈ 𝔽 . um vn || 2.1 || |⌈ .. |⌉ umvn ](img/file4.jpg)'
  id: totrans-10
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ |u1v1 | ⌊ ⌋ ⌊ ⌋ || ... || u1 v1 | | || .. || || ..|| ||u1vn || mn u
    ⊗ v = ⌈ . ⌉ ⊗ ⌈ .⌉ = ||u v || ∈ 𝔽 . um vn || 2.1 || |⌈ .. |⌉ umvn ](img/file4.jpg)'
- en: 1.1.2 Inner products
  id: totrans-11
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.2 内积
- en: A vector space V over the field 𝔽 is a set endowed with
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 定义域为𝔽的向量空间V是一个集合，并配备了
- en: a commutative, associative addition operation,
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一个交换的、结合的加法运算，
- en: an operation of multiplication by a scalar.
  id: totrans-14
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一个标量乘法的操作。
- en: 'The addition and the multiplication by a scalar have the following properties
    (for scalars *α,β* ∈𝔽 and vectors u*,*v ∈V):'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 加法和标量乘法具有以下性质（对于标量*α,β* ∈𝔽 和向量u*,*v ∈V）：
- en: v + 0 = v;
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: v + 0 = v；
- en: v + (−v) = 0;
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: v + (−v) = 0；
- en: '*α*(*β*v) = (*αβ*)v;'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*α*(*β*v) = (*αβ*)v；'
- en: (*α* + *β*)v = *α*v + *β*v;
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: (*α* + *β*)v = *α*v + *β*v；
- en: '*α*(u + v) = *α*u + *α*v;'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*α*(u + v) = *α*u + *α*v；'
- en: 1 ⋅ v = v.
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 1 ⋅ v = v。
- en: 'Armed with this, we can now define an inner product on V:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 有了这个，我们现在可以定义V上的内积：
- en: '**Definition 1.** A map ⟨⋅*,*⋅⟩ : V ×V →𝔽 is called an *inner product* if,
    for u*,*v*,*w ∈V and *α* ∈𝔽,'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义1.** 一个映射 ⟨⋅*,*⋅⟩ : V ×V →𝔽 被称为*内积*，如果对于 u*,*v*,*w ∈V 和 *α* ∈𝔽，'
- en: '*(Positive definiteness)* ⟨u*,*u⟩≥ 0 and ⟨u*,*u⟩ = 0 if and only if u = 0;'
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*（正定性）* ⟨u*,*u⟩≥ 0，且 ⟨u*,*u⟩ = 0 当且仅当 u = 0；'
- en: '*(Conjugate symmetry)* ⟨u*,*v⟩ = ⟨v*,*u⟩^∗;'
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*（共轭对称性）* ⟨u*,*v⟩ = ⟨v*,*u⟩^∗；'
- en: '*(Linear in the first argument)* ⟨u + v*,*w⟩ = ⟨u*,*w⟩ + ⟨v*,*w⟩ and ⟨*α*u*,*v⟩
    = *α*⟨u*,*v⟩;'
  id: totrans-26
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*（第一个参数是线性的）* ⟨u + v*,*w⟩ = ⟨u*,*w⟩ + ⟨v*,*w⟩ 且 ⟨*α*u*,*v⟩ = *α*⟨u*,*v⟩；'
- en: '*(Antilinear in the second argument)* ⟨u*,*v + w⟩ = ⟨u*,*v⟩ + ⟨u*,*w⟩ and ⟨u*,α*v⟩
    = *α*^∗⟨u*,*v⟩.'
  id: totrans-27
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*（第二个参数是反线性的）* ⟨u*,*v + w⟩ = ⟨u*,*v⟩ + ⟨u*,*w⟩ 且 ⟨u*,α*v⟩ = *α*^∗⟨u*,*v⟩。'
- en: The inner product is further called non-degenerate if ⟨u*,*v⟩ = 0 for all v
    ∈V ∖{0} implies u = 0.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 内积进一步被称为非退化的，如果 ⟨u*,*v⟩ = 0 对所有 v ∈V ∖{0} 都意味着 u = 0。
- en: 'For example, the following spaces carry a natural inner product:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，以下空间带有自然内积：
- en: The vector space ℂ^n with the inner product ⟨u*,*v⟩ := u^†v = ∑ [i=1]^n*u*[i]^∗*v*[i];
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向量空间ℂ^n的内积定义为 ⟨u*,*v⟩ := u^†v = ∑ [i=1]^n*u*[i]^∗*v*[i]；
- en: The space of complex-valued continuous functions on [0*,*1] with ⟨*f,g*⟩ :=
    ∫ [0]¹*f*(*t*)^∗*g*(*t*)d*t*;
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 定义在[0*,*1]上的复值连续函数空间，其内积定义为 ⟨*f,g*⟩ := ∫ [0]¹*f*(*t*)^∗*g*(*t*)d*t*；
- en: If X*,*Y ∈ℳ[m,n](ℝ), then ⟨X*,*Y⟩ := Tr(X^⊤Y) = ∑ [i=1]^m ∑ [j=1]^nX[ij]Y[ij]
    defines an inner product on the space of (real) matrices.
  id: totrans-32
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果 X*,*Y ∈ℳ[m,n](ℝ)，则 ⟨X*,*Y⟩ := Tr(X^⊤Y) = ∑ [i=1]^m ∑ [j=1]^nX[ij]Y[ij] 定义了（实数）矩阵空间上的内积。
- en: 'Projection matrices are particularly useful for geometric purposes:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 投影矩阵在几何中特别有用：
- en: '**Definition 2.** A matrix P ∈ℳ[n](𝔽) is called a (orthogonal) *projection*
    if P² = P.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义2.** 一个矩阵P ∈ℳ[n](𝔽)称为（正交）*投影*，如果 P² = P。'
- en: 'In particular, if W is a vector subspace of 𝔽^n with some orthonormal basis
    (w[1]*,…,*w[d]), it is then easy to check that the map 𝒫[W] : 𝔽^n →𝔽^n onto W
    satisfying'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '特别地，如果W是𝔽^n的一个向量子空间，并且有一个正交归一基 (w[1]*,…,*w[d])，那么很容易验证满足 𝒫[W] : 𝔽^n →𝔽^n 的映射，它将𝔽^n投影到W上。'
- en: '| ![ ∑d 𝒫W (v) := ⟨v,wi⟩wi, for any v ∈ 𝔽n, i=1 ](img/file5.jpg) |  |'
  id: totrans-36
  prefs: []
  type: TYPE_TB
  zh: '| ![ ∑d 𝒫W (v) := ⟨v,wi⟩wi, 对于任意 v ∈ 𝔽n, i=1 ](img/file5.jpg) |  |'
- en: defines an orthogonal projection.
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 定义了一个正交投影。
- en: 1.1.3 From linear operators to matrices
  id: totrans-38
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.3 从线性算子到矩阵
- en: 'Let V be a finite-dimensional vector space over 𝔽 and ⟨⋅*,*⋅⟩ a non-degenerate
    inner product on V. Given a linear operator 𝒜 : V →V, then, by the Riesz representation
    theorem  [[309](Biblography.xhtml#Xyosida1965functional), Section III-6], there
    exists a unique linear operator 𝒜^† : V →V, called the adjoint operator, such
    that'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '设 V 是一个定义在 𝔽 上的有限维向量空间，且 ⟨⋅*,*⋅⟩ 是 V 上的非退化内积。给定线性算子 𝒜 : V →V，根据 Riesz 表示定理
    [[309](Biblography.xhtml#Xyosida1965functional)，第 III-6 节]，存在唯一的线性算子 𝒜^† : V →V，称为伴随算子，使得'
- en: '![⟨𝒜u, v⟩ = ⟨u,𝒜 †v⟩, for all u,v ∈ V. ](img/file6.jpg)'
  id: totrans-40
  prefs: []
  type: TYPE_IMG
  zh: '![⟨𝒜u, v⟩ = ⟨u,𝒜 †v⟩, 对所有 u,v ∈ V. ](img/file6.jpg)'
- en: 'Indeed, for any v ∈V, the map u ∈V![↦→](img/file7.jpg)⟨𝒜u*,*v⟩ is a linear
    functional, hence an element of the dual space V^† (the space of bounded linear
    functionals on V), therefore for each v ∈V, there exists v′∈V such that ⟨𝒜u*,*v⟩
    = ⟨u*,*v′⟩. It is then easy to show that the map v![↦→](img/file8.jpg)v′ is linear,
    proving that the adjoint operator is uniquely defined. In the particular case
    where 𝒜 = 𝒜^†, the operator 𝒜 is called Hermitian, a key requirement in quantum
    mechanics:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 实际上，对于任何 v ∈V，映射 u ∈V![↦→](img/file7.jpg)⟨𝒜u*,*v⟩ 是一个线性泛函，因此它是对偶空间 V^†（V 上有界线性泛函的空间）中的一个元素，因此对于每个
    v ∈V，存在 v′∈V 使得 ⟨𝒜u*,*v⟩ = ⟨u*,*v′⟩。然后可以容易地证明映射 v![↦→](img/file8.jpg)v′ 是线性的，从而证明伴随算子是唯一确定的。在特别的情况下，当
    𝒜 = 𝒜^† 时，算子 𝒜 称为厄米算子，这是量子力学中的一个关键要求：
- en: '**Definition 3.** The operator 𝒜 is called *Hermitian*, or *self-adjoint*,
    if 𝒜 = 𝒜^†.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义 3.** 如果 𝒜 = 𝒜^†，则称算子 𝒜 为 *厄米算子*，或 *自伴随算子*。'
- en: For a Hermitian operator 𝒜, we then have, for any u ∈V,
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 对于厄米算子 𝒜，我们有，对于任意 u ∈V，
- en: '![⟨𝒜u, u⟩ = ⟨u,𝒜 †u⟩ = ⟨u,𝒜u ⟩ = ⟨𝒜u,u⟩∗ ](img/file9.jpg)'
  id: totrans-44
  prefs: []
  type: TYPE_IMG
  zh: '![⟨𝒜u, u⟩ = ⟨u,𝒜 †u⟩ = ⟨u,𝒜u ⟩ = ⟨𝒜u,u⟩∗ ](img/file9.jpg)'
- en: by conjugate symmetry (Definition [1](#x1-25002r1)), and therefore ⟨𝒜u*,*u⟩
    is real. Conversely, if ⟨𝒜u*,*u⟩ is real, then
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 通过共轭对称性（定义[1](#x1-25002r1)），因此 ⟨𝒜u*,*u⟩ 是实数。反之，如果 ⟨𝒜u*,*u⟩ 是实数，那么
- en: '![ ∗ † ⟨𝒜u,u⟩ = ⟨𝒜u, u⟩ = ⟨u,𝒜u ⟩ = ⟨𝒜 u,u⟩. ](img/file10.jpg)'
  id: totrans-46
  prefs: []
  type: TYPE_IMG
  zh: '![ ∗ † ⟨𝒜u,u⟩ = ⟨𝒜u, u⟩ = ⟨u,𝒜u ⟩ = ⟨𝒜 u,u⟩. ](img/file10.jpg)'
- en: Therefore, ![⟨( ) ⟩ 𝒜 − 𝒜† u,u](img/file11.jpg) = 0; since this is true for
    all u ∈V, then 𝒜 = 𝒜^†.
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，![⟨( ) ⟩ 𝒜 − 𝒜† u,u](img/file11.jpg) = 0；因为对所有 u ∈V 这都成立，因此 𝒜 = 𝒜^†。
- en: 'The following property of operators shall be useful to ensure that systems
    driven by operators preserve distances, or norms:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 以下算子属性将有助于确保由算子驱动的系统保持距离或范数：
- en: '**Definition 4.** The linear operator 𝒜 : V → V is called *unitary* if it is
    surjective and'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义 4.** 线性算子 𝒜 : V → V 称为 *酉算子*，如果它是满射的，并且'
- en: '![⟨𝒜u, 𝒜v ⟩ = ⟨u,v ⟩, for all u, v ∈ V. ](img/file12.jpg)'
  id: totrans-50
  prefs: []
  type: TYPE_IMG
  zh: '![⟨𝒜u, 𝒜v ⟩ = ⟨u,v ⟩, 对所有 u, v ∈ V. ](img/file12.jpg)'
- en: Recall that a linear operator between two finite-dimensional normed spaces is
    bounded, and therefore continuous. For any u ∈V, this implies that ∥𝒜u∥ = ∥u∥,
    so that a unitary operator 𝒜 preserves the norm. In that case, 𝒜 is an isometry,
    therefore injective. Being also surjective, it is bijective and therefore its
    inverse exists. For a unitary operator 𝒜 and any u*,*v ∈V, we have
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 回想一下，两个有限维范数空间之间的线性算子是有界的，因此是连续的。对于任何 u ∈V，这意味着 ∥𝒜u∥ = ∥u∥，因此酉算子 𝒜 保持范数。在这种情况下，𝒜
    是等距的，因此是单射的。由于它也是满射的，它是双射的，因此其逆存在。对于酉算子 𝒜 和任何 u*,*v ∈V，我们有
- en: '![ † ⟨u,v⟩ = ⟨𝒜u, 𝒜v⟩ = ⟨u,𝒜 𝒜v ⟩ ](img/file13.jpg)'
  id: totrans-52
  prefs: []
  type: TYPE_IMG
  zh: '![ † ⟨u,v⟩ = ⟨𝒜u, 𝒜v⟩ = ⟨u,𝒜 𝒜v ⟩ ](img/file13.jpg)'
- en: by definition of the adjoint, implying that
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 根据伴随算子的定义，意味着
- en: '![𝒜 †𝒜 = ℐ = 𝒜 𝒜 †, ](img/file14.jpg)'
  id: totrans-54
  prefs: []
  type: TYPE_IMG
  zh: '![𝒜 †𝒜 = ℐ = 𝒜 𝒜 †, ](img/file14.jpg)'
- en: where ℐ is the identity operator.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 ℐ 是单位算子。
- en: '**Example (Real Matrices):** If V = ℝ^n with inner product ⟨u*,*v⟩ := u^⊤v
    for u*,*v ∈ℝ^n, the linear operator 𝒜 can now be viewed as a matrix A in ℳ[n](ℝ).
    Its adjoint is nothing other than the transpose A^⊤, and therefore A is self-adjoint
    if and only if it is symmetric. In this case, if A is unitary (or orthogonal),
    then it is invertible with A^(−1) = A^⊤. Rotation matrices in ℝ², which will play
    an important role later when constructing quantum circuits, are the only unitary
    maps of ℝ² onto itself and are of the form'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例（实矩阵）：** 如果 V = ℝ^n 且内积 ⟨u*,*v⟩ := u^⊤v 对于 u*,*v ∈ℝ^n，则线性算子 𝒜 可以看作 ℳ[n](ℝ)
    中的矩阵 A。其伴随算子无非就是转置矩阵 A^⊤，因此 A 当且仅当它是对称矩阵时才是自伴随的。在这种情况下，如果 A 是酉矩阵（或正交矩阵），那么它是可逆的，并且
    A^(−1) = A^⊤。在 ℝ² 中的旋转矩阵将在后续构建量子电路时发挥重要作用，它们是 ℝ² 上到自身的唯一酉映射，形式为'
- en: '| ![⌊ ⌋ cos(𝜃) δsin(𝜃) ⌈ ⌉, sin(𝜃) − δcos(𝜃) ](img/file15.jpg) |  |'
  id: totrans-57
  prefs: []
  type: TYPE_TB
  zh: '| ![⌊ ⌋ cos(𝜃) δsin(𝜃) ⌈ ⌉, sin(𝜃) − δcos(𝜃) ](img/file15.jpg) |  |'
- en: for *𝜃* ∈ [0*,*2*π*) and *δ* ∈{−1*,*+1}.
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 *𝜃* ∈ [0*,*2*π*) 和 *δ* ∈{−1*,*+1}。
- en: '**Example (Complex Matrices):** If V = ℂ^n with inner product ⟨u*,*v⟩ := v^†u
    for u*,*v ∈ℂ^n, the linear operator 𝒜 can now be viewed as a matrix in ℳ[n](ℂ).
    The adjoint of such a matrix is then the Hermitian conjugate A^† and A is called
    Hermitian if A = A^† and unitary if A^†A = I[n]. We shall denote by 𝒰[n](ℂ) the
    set of unitary matrices in ℳ[n](ℂ). We will discuss Hermitian matrices over ℂ
    in more detail in Section [1.1.6](#x1-290006).'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例（复矩阵）：** 如果 V = ℂ^n，内积 ⟨u*,*v⟩ := v^†u，对于 u*,*v ∈ℂ^n，线性算子 𝒜 现在可以看作是 ℳ[n](ℂ)
    中的一个矩阵。此时，该矩阵的伴随矩阵是 Hermitian 共轭 A^†，如果 A = A^† 则称 A 为 Hermitian 矩阵，如果 A^†A =
    I[n]，则称 A 为酉矩阵。我们将用 𝒰[n](ℂ) 表示 ℳ[n](ℂ) 中的酉矩阵集合。我们将在第 [1.1.6](#x1-290006) 节中更详细地讨论复数域上的
    Hermitian 矩阵。'
- en: 1.1.4 Condition number
  id: totrans-60
  prefs:
