- en: In the language of Dirac’s notations, we can define the *outer product* ![|u⟩](img/file59.jpg)⟨v|
    (for u ∈U and v ∈V) as a linear operator from V to U, two vector spaces, as
  id: totrans-169
  prefs: []
  type: TYPE_NORMAL
  zh: 在狄拉克符号的语言中，我们可以定义 *外积* ![|u⟩](img/file59.jpg)⟨v|（对于 u ∈U 和 v ∈V）作为从 V 到 U 的线性算子，这里有两个向量空间，形式为
- en: '| ![( ) &#124;u⟩ ⟨v&#124; &#124;w⟩ := ⟨v&#124;w ⟩ &#124;u⟩, for any w ∈ V.
    ](img/file60.jpg) |  |'
  id: totrans-170
  prefs: []
  type: TYPE_TB
  zh: '| ![( ) &#124;u⟩ ⟨v&#124; &#124;w⟩ := ⟨v&#124;w ⟩ &#124;u⟩，对于任何 w ∈ V. ](img/file60.jpg)
    |  |'
- en: In particular, ![|v⟩](img/file61.jpg)⟨v| is the projection on the one-dimensional
    space generated by ![|v ⟩](img/file62.jpg). Any linear operator can be expressed
    as a linear combination of outer products as
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: 特别地，![|v⟩](img/file61.jpg)⟨v| 是对由 ![|v ⟩](img/file62.jpg) 生成的一维空间的投影。任何线性算子都可以表示为外积的线性组合，形式为
- en: '| ![ ∑ 𝒜 = Aij &#124;i⟩⟨j&#124;, ij ](img/file63.jpg) |  |'
  id: totrans-172
  prefs: []
  type: TYPE_TB
  zh: '| ![ ∑ 𝒜 = Aij &#124;i⟩⟨j&#124;, ij ](img/file63.jpg) |  |'
- en: where ![|i⟩](img/file64.jpg) and ![|j⟩](img/file65.jpg) are the standard basis
    vectors ([1.1.9](#x1-320009)).
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 ![|i⟩](img/file64.jpg) 和 ![|j⟩](img/file65.jpg) 是标准基向量（[1.1.9](#x1-320009)）。
- en: 'Similarly to the linear algebra setting above, we can define an eigenvector
    of a linear operator 𝒜 : V →V as a non-zero vector ![|v ⟩](img/file66.jpg) such
    that'
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: '与上面线性代数的设置类似，我们可以定义线性算子 𝒜 : V →V 的特征向量为非零向量 ![|v ⟩](img/file66.jpg)，使得'
- en: '| ![𝒜 &#124;v⟩ = λ &#124;v⟩ ](img/file67.jpg) |  |'
  id: totrans-175
  prefs: []
  type: TYPE_TB
  zh: '| ![𝒜 &#124;v⟩ = λ &#124;v⟩ ](img/file67.jpg) |  |'
- en: for some complex eigenvalue *λ*. Associated with any linear operator 𝒜, the
    adjoint operator 𝒜^† satisfies
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: 对于某些复特征值 *λ*，与任何线性算子 𝒜 相关联的伴随算子 𝒜^† 满足
- en: '| ![ ⟨ ⟩ ⟨u&#124;𝒜v ⟩ = 𝒜 †u&#124;v . ](img/file68.jpg) |  |'
  id: totrans-177
  prefs: []
  type: TYPE_TB
  zh: '| ![ ⟨ ⟩ ⟨u&#124;𝒜v ⟩ = 𝒜 †u&#124;v . ](img/file68.jpg) |  |'
- en: Indeed, in the language of linear operators above, we have
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: 事实上，在上述线性算子的语言中，我们有
- en: '![⟨u,𝒜v ⟩ = ⟨𝒜v, u⟩∗ = ⟨v,𝒜 †u⟩∗ = ⟨𝒜 †u,v⟩, ](img/file69.jpg)'
  id: totrans-179
  prefs: []
  type: TYPE_IMG
  zh: '![⟨u,𝒜v ⟩ = ⟨𝒜v, u⟩∗ = ⟨v,𝒜 †u⟩∗ = ⟨𝒜 †u,v⟩, ](img/file69.jpg)'
