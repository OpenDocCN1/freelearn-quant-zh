    computational basis will result in observing states ![|0⟩](img/file146.jpg) and ![|1⟩](img/file147.jpg)
    with equal probability 1*∕*2\. Let us assume that we measured ![|0⟩](img/file148.jpg).
    The qubit state is now
  id: totrans-248
  prefs: []
  type: TYPE_NORMAL
  zh: 测量![|ψ⟩](img/file143.jpg)在{![|0⟩](img/file144.jpg)*,*![|1⟩](img/file145.jpg)}计算基中，将以相等的概率1*∕*2观察到态![|0⟩](img/file146.jpg)和![|1⟩](img/file147.jpg)。假设我们测量了![|0⟩](img/file148.jpg)，此时量子比特的状态为
- en: '![ ′⟩ |ψ = 1 ⋅ |0⟩+ 0 ⋅ |1⟩. ](img/file149.jpg)'
  id: totrans-249
  prefs: []
  type: TYPE_IMG
  zh: '![ ′⟩ |ψ = 1 ⋅ |0⟩+ 0 ⋅ |1⟩. ](img/file149.jpg)'
- en: If we repeat the measurement in the same {![|0⟩](img/file150.jpg)*,*![|1⟩](img/file151.jpg)}
    computational basis, we obtain state ![|0⟩](img/file152.jpg) with probability 1
    in accordance with the measurement postulate. However, had we measured state ![|ψ′⟩](img/file153.jpg)
    in the *Hadamard basis* {![|+ ⟩](img/file154.jpg)*,*![|− ⟩](img/file155.jpg)},
    given by
  id: totrans-250
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们在相同的{![|0⟩](img/file150.jpg)*,*![|1⟩](img/file151.jpg)}计算基中重复测量，我们将以概率1得到状态![|0⟩](img/file152.jpg)，这符合测量公设。然而，如果我们在*哈达玛基*{![|+
    ⟩](img/file154.jpg)*,*![|− ⟩](img/file155.jpg)}基中测量状态![|ψ′⟩](img/file153.jpg)，则由下式给出
- en: '| ![&#124;+ ⟩ := √1-(&#124;0⟩+ &#124;1⟩) and &#124;− ⟩ := 1√--(&#124;0⟩ − &#124;1⟩),
    2 2 ](img/file156.jpg) |  |'
  id: totrans-251
  prefs: []
  type: TYPE_TB
  zh: '| ![&#124;+ ⟩ := √1-(&#124;0⟩+ &#124;1⟩) 和 &#124;− ⟩ := 1√--(&#124;0⟩ − &#124;1⟩),
    2 2 ](img/file156.jpg) |  |'
- en: we would have equal probabilities of ![|+⟩](img/file157.jpg) and ![|− ⟩](img/file158.jpg)
    outcomes. Let us assume that we measured ![|− ⟩](img/file159.jpg) and the state
    of the qubit is now
  id: totrans-252
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将有相等的概率得到![|+⟩](img/file157.jpg)和![|− ⟩](img/file158.jpg)的结果。假设我们测量了![|− ⟩](img/file159.jpg)，此时量子比特的状态为
- en: '![ ′′⟩ |ψ = 0 ⋅ |+ ⟩+ 1 ⋅ |− ⟩ . ](img/file160.jpg)'
  id: totrans-253
  prefs: []
  type: TYPE_IMG
  zh: '![ ′′⟩ |ψ = 0 ⋅ |+ ⟩+ 1 ⋅ |− ⟩ . ](img/file160.jpg)'
- en: If we repeat the measurement of state ![|ψ ′′⟩](img/file161.jpg) in the Hadamard
    basis {![|+⟩](img/file162.jpg)*,*![|− ⟩](img/file163.jpg)}, we obtain state ![|−
    ⟩](img/file164.jpg) with probability 1\. But the state of the qubit is an equal
    superposition of states ![|0 ⟩](img/file165.jpg) and ![|1⟩](img/file166.jpg) from
    the {![|0⟩](img/file167.jpg)*,*![|1⟩](img/file168.jpg)} computational basis perspective
    and we have an equal chance of measuring either ![|0⟩](img/file169.jpg) or ![|1⟩](img/file170.jpg)
    in this basis.
  id: totrans-254
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们在哈达马尔基{![|+⟩](img/file162.jpg)*,*![|− ⟩](img/file163.jpg)}中重复测量态![|ψ ′′⟩](img/file161.jpg)，我们以概率1获得态![|−
    ⟩](img/file164.jpg)。但是从{![|0⟩](img/file167.jpg)*,*![|1⟩](img/file168.jpg)}计算基的角度看，量子比特的状态是态![|0
    ⟩](img/file165.jpg)和![|1⟩](img/file166.jpg)的等幅叠加，在这个基中我们有相等的机会测量到![|0⟩](img/file169.jpg)或![|1⟩](img/file170.jpg)。
- en: '**Remark:** The basis vectors ![|0⟩](img/file171.jpg) and ![|1⟩](img/file172.jpg)
    that form the standard computational basis can be transformed into the basis vectors
    ![|+⟩](img/file173.jpg) and ![|− ⟩](img/file174.jpg) that form the Hadamard basis
    by applying the following unitary operator (rotation), called the *Hadamard gate*:'
  id: totrans-255
  prefs: []
  type: TYPE_NORMAL
  zh: '**备注：** 组成标准计算基的基向量![|0⟩](img/file171.jpg)和![|1⟩](img/file172.jpg)可以通过应用以下幺正算符（旋转），称为*哈达马尔门*，转换为组成哈达马尔基的基向量![|+⟩](img/file173.jpg)和![|−
    ⟩](img/file174.jpg)。'
- en: '| ![ ⌊ ⌋ -1-⌈1 1 ⌉ H = √2-- 1 − 1 . ](img/file175.jpg) |  |'
  id: totrans-256
  prefs: []
  type: TYPE_TB
  zh: '| ![ ⌊ ⌋ -1-⌈1 1 ⌉ H = √2-- 1 − 1 . ](img/file175.jpg) |  |'
- en: Chapters [6](Chapter_6.xhtml#x1-1190006), [10](Chapter_10.xhtml#x1-20200010)
    and [11](Chapter_11.xhtml#x1-21700011) provide examples of applications of the
    Hadamard gate.
  id: totrans-257
  prefs: []
  type: TYPE_NORMAL
  zh: 第[6](Chapter_6.xhtml#x1-1190006)、[10](Chapter_10.xhtml#x1-20200010)和[11](Chapter_11.xhtml#x1-21700011)章提供了哈达马尔门应用的示例。
- en: 'The measurement plays a crucial role in quantum computing. This is the process
    of *collapsing* a quantum state and reading out the classical information: measuring
    qubits encoding a quantum state will produce a classical bit string. The measurement
    process generates probabilistic outcomes. Therefore, we need to perform measurements
    on the same quantum state multiple times to generate a sufficiently large number
    of classical bit strings to produce reliable statistics.'
  id: totrans-258
  prefs: []
  type: TYPE_NORMAL
  zh: 测量在量子计算中起着至关重要的作用。这个过程是*坍缩*量子态并读取经典信息：测量编码量子态的量子比特将产生一个经典比特串。测量过程会生成概率性的结果。因此，我们需要对同一个量子态进行多次测量，以生成足够多的经典比特串，从而产生可靠的统计数据。
- en: The process of measurement describes the collapse of the quantum state due to
    contact with the environment. After measurement, the states of the qubits are
    known without any uncertainty. It is possible to extract at most 1 bit of information
    from a qubit. In order to extract more information about the probability distribution
    encoded in a given quantum state, it is necessary to perform measurement of the
    same state multiple times.
  id: totrans-259
  prefs: []
  type: TYPE_NORMAL
  zh: 测量过程描述了量子态由于与环境的接触而坍缩的过程。测量后，量子比特的状态是已知的且没有任何不确定性。从一个量子比特中最多可以提取1比特信息。为了提取有关给定量子态中编码的概率分布的更多信息，需要对同一个状态进行多次测量。
- en: 1.2.4 Fourth postulate – Observable
  id: totrans-260
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.2.4 第四公设 – 可观察量
- en: '**Postulate 4\.** *For every measurable property of a physical system, there
    exists a* *corresponding Hermitian operator. The values of the physical observables*
    *correspond to the expectation values of Hermitian operators. The expectation
    value* ![⟨𝒜 ⟩](img/file176.jpg) *of the Hermitian operator *𝒜 *in the normalised
    state *![|ψ ⟩](img/file177.jpg) *is given by*'
  id: totrans-261
  prefs: []
  type: TYPE_NORMAL
  zh: '**公设 4**。*对于物理系统的每个可测量属性，都存在一个* *相应的厄米算符。物理可观察量的值* *对应于厄米算符的期望值。厄米算符* ![⟨𝒜
    ⟩](img/file176.jpg) *在归一化态*![|ψ ⟩](img/file177.jpg) *中的期望值由下式给出*'
- en: '| ![⟨𝒜 ⟩ := ⟨ψ&#124;𝒜 &#124;ψ⟩. ](img/file178.jpg) |  |'
  id: totrans-262
  prefs: []
  type: TYPE_TB
  zh: '| ![⟨𝒜 ⟩ := ⟨ψ&#124;𝒜 &#124;ψ⟩. ](img/file178.jpg) |  |'
- en: Let us consider the general case where the expectation value of a Hermitian
    operator 𝒜 is calculated in state ![|ψ ⟩](img/file179.jpg), which is not an eigenfunction
    of 𝒜. By the Spectral Theorem [3](#x1-28006r3) (see also ([1.2.3](#x1-380003))),
    the state ![|ψ ⟩](img/file180.jpg) of a system can be represented as the superposition
  id: totrans-263
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们考虑一般情况，其中厄米算符𝒜在态![|ψ ⟩](img/file179.jpg)中计算其期望值，且此态并不是𝒜的本征函数。根据谱定理[3](#x1-28006r3)（另见([1.2.3](#x1-380003))），系统的态![|ψ
    ⟩](img/file180.jpg)可以表示为叠加态
- en: '![ N ∑ |ψ⟩ = αi |ψi⟩ , i=1 ](img/file181.jpg)'
  id: totrans-264
  prefs: []
  type: TYPE_IMG
  zh: '![ N ∑ |ψ⟩ = αi |ψi⟩ , i=1 ](img/file181.jpg)'
- en: where (![|ψi⟩](img/file182.jpg))[i=1,…,N] are the eigenfunctions of 𝒜 and (*α*[i])[i=1,…,N]
    the corresponding probability amplitudes.
  id: totrans-265
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 (![|ψi⟩](img/file182.jpg))[i=1,…,N]是𝒜的本征函数，(*α*[i])[i=1,…,N]是相应的概率幅度。
- en: Therefore, the *expectation value* of 𝒜 in state ![|ψ⟩](img/file183.jpg), given
    in ([1.2.4](#x1-390004)), is calculated as
  id: totrans-266
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，给定状态![|ψ⟩](img/file183.jpg)下𝒜的*期望值*，根据([1.2.4](#x1-390004))，其计算公式为
- en: '![ ∑N ∑N N∑ ∑N ⟨𝒜⟩ = α∗iαj ⟨ψi|𝒜 |ψj⟩ = α ∗iαjλj ⟨ψi|ψj⟩, i=1j=1 i=1 j=1 ](img/file184.jpg)'
  id: totrans-267
  prefs: []
  type: TYPE_IMG
  zh: '![ ∑N ∑N N∑ ∑N ⟨𝒜⟩ = α∗iαj ⟨ψi|𝒜 |ψj⟩ = α ∗iαjλj ⟨ψi|ψj⟩, i=1j=1 i=1 j=1 ](img/file184.jpg)'
- en: where (*λ*[i])[i=1,…,N] are the eigenvalues of 𝒜. The only terms that survive
    in the expression for ![⟨𝒜 ⟩](img/file185.jpg) are those with *i* = *j* due to
    the orthogonality of the eigenfunctions, so that
  id: totrans-268
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 (*λ*[i])[i=1,…,N] 是𝒜的特征值。由于特征函数的正交性，只有当 *i* = *j* 时，表达式中的项才会存在，因此
- en: '![ N N ∑ ∗ ∑ 2 ⟨𝒜 ⟩ = α iαiλi = |αi| λi. i=1 i=1 ](img/file186.jpg)'
  id: totrans-269
  prefs: []
  type: TYPE_IMG
  zh: '![ N N ∑ ∗ ∑ 2 ⟨𝒜 ⟩ = α iαiλi = |αi| λi. i=1 i=1 ](img/file186.jpg)'
- en: Therefore, the value of the observable is a weighted average of the eigenvalues
    of the corresponding Hermitian operator. The weights are the coefficients (|*α*[i]|²)[i=1,…,N],
    which are the probabilities of measuring the corresponding eigenstate of 𝒜.
  id: totrans-270
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，物理可观测量的值是对应的厄米算符特征值的加权平均值。加权因子是系数 (|*α*[i]|²)[i=1,…,N]，它们是测量𝒜对应特征态的概率。
- en: Hermitian operators play an exceptionally important role in quantum mechanics
    since their expectation values correspond to physical observables.
  id: totrans-271
  prefs: []
  type: TYPE_NORMAL
  zh: 厄米算符在量子力学中扮演着异常重要的角色，因为它们的期望值对应于物理可观测量。
- en: 1.2.5 Fifth postulate – Composite System
  id: totrans-272
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.2.5 第五公设 – 复合系统
- en: '**Postulate 5\.** *The state space of a composite physical system is the tensor*
    *product of the state spaces of the individual component physical systems.*'
  id: totrans-273
  prefs: []
  type: TYPE_NORMAL
  zh: '**公设 5.** *复合物理系统的状态空间是各个组分物理系统状态空间的张量积。*'
- en: If the first component physical system is in state ![|ψA ⟩](img/file187.jpg)
    and the second component physical system is in state ![|ψB⟩](img/file188.jpg),
    then the state of the combined system, ![|ψ⟩](img/file189.jpg), is given by the
    tensor product
  id: totrans-274
  prefs: []
  type: TYPE_NORMAL
  zh: 如果第一个组分物理系统处于状态![|ψA ⟩](img/file187.jpg)，而第二个组分物理系统处于状态![|ψB⟩](img/file188.jpg)，那么组合系统的状态![|ψ⟩](img/file189.jpg)由张量积给出：
- en: '| ![&#124;ψ⟩ = &#124;ψA⟩ ⊗ &#124;ψB⟩ . ](img/file190.jpg) |  |'
  id: totrans-275
  prefs: []
  type: TYPE_TB
  zh: '| ![&#124;ψ⟩ = &#124;ψA⟩ ⊗ &#124;ψB⟩ . ](img/file190.jpg) |  |'
- en: Not all states of a combined system can be separated into the tensor product
    of states of individual components. If the state of a system cannot be separated
    into component parts, we say that the component parts are *entangled*.
  id: totrans-276
  prefs: []
  type: TYPE_NORMAL
  zh: 并非所有组合系统的状态都可以分解为单个组分状态的张量积。如果一个系统的状态无法分解为组分部分的状态，我们称这些组分部分是*纠缠*的。
- en: The entanglement of quantum systems is one of the major sources of computational
    power of quantum computing. It allows us to store exponentially more information
    in the correlations between the states of individual subsystems (in the limit
    – individual qubits) than directly in the states of individual subsystems.
  id: totrans-277
  prefs: []
  type: TYPE_NORMAL
  zh: 量子系统的纠缠是量子计算计算能力的主要来源之一。它使得我们可以将信息以指数级别存储在各个子系统（在极限情况下——单个量子比特）的状态之间的关联中，而不是直接存储在各个子系统的状态中。
- en: To illustrate this point, we can look at the number of probability amplitudes
    needed to describe the state of an *n*-qubit system. An individual qubit can be
    found in one of the two possible states after measurement – one of the two basis
    states, ![|0⟩](img/file191.jpg) or ![|1⟩](img/file192.jpg). This means that we
    need to specify two probability amplitudes to fully describe the state of the
    qubit before measurement. If all our qubits are independent and the state of the
    system can be represented as a tensor product of individual qubit states,
  id: totrans-278
  prefs: []
  type: TYPE_NORMAL
  zh: 为了说明这一点，我们可以看一下描述*n*量子比特系统状态所需的概率幅度的数量。经过测量后，单个量子比特可以处于两种可能的状态之一——两种基态之一，![|0⟩](img/file191.jpg)
    或![|1⟩](img/file192.jpg)。这意味着我们需要指定两个概率幅度来完全描述量子比特在测量之前的状态。如果所有量子比特是独立的，并且系统的状态可以表示为单个量子比特状态的张量积，
- en: '| ![&#124;ψ⟩ = &#124;ψ1 ⟩⊗ &#124;ψ2⟩⊗ ...⊗ &#124;ψn ⟩, ](img/file193.jpg) |  |'
  id: totrans-279
  prefs: []
  type: TYPE_TB
  zh: '| ![&#124;ψ⟩ = &#124;ψ1 ⟩⊗ &#124;ψ2⟩⊗ ...⊗ &#124;ψn ⟩, ](img/file193.jpg) |  |'
- en: then we need to specify 2*n* probability amplitudes (two for each individual
    quantum states) to describe the state ![|ψ ⟩](img/file194.jpg) of the system.
    If, however, all individual qubits are entangled and the tensor product representation
    of the system state ![|ψ ⟩](img/file195.jpg) does not exist, we need to specify
    2^n probability amplitudes – this is an effective measure of useful information
    that can be stored in the system.
  id: totrans-280
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，我们需要指定2*n*个概率振幅（每个单独量子态都有两个）来描述系统的态![|ψ ⟩](img/file194.jpg)。然而，如果所有单个量子比特都发生纠缠，并且系统态的张量积表示![|ψ
    ⟩](img/file195.jpg)不存在，我们则需要指定2^n个概率振幅——这是可以存储在系统中的有效信息度量。
- en: The power of quantum computing is derived from the principles of superposition
    and entanglement. Entanglement allows us to store most of the information in correlations
    between the qubit states.
  id: totrans-281
  prefs: []
  type: TYPE_NORMAL
  zh: 量子计算的力量源自叠加原理和纠缠原理。纠缠使我们能够将大部分信息存储在量子比特态之间的关联中。
- en: 1.3 Pure and Mixed States
  id: totrans-282
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.3 纯态与混合态
- en: There are situations where the state of a quantum mechanical system cannot be
    described with the help of a state vector. Here, we look at such situations and
    provide a mathematical tool for describing them.
  id: totrans-283
  prefs: []
  type: TYPE_NORMAL
  zh: 在某些情况下，量子力学系统的态不能通过状态向量来描述。在这里，我们将讨论这种情况，并提供一个数学工具来描述它们。
- en: 1.3.1 Density matrix
  id: totrans-284
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.3.1 密度矩阵
- en: 'Let us start with the state of a combined two-component physical system given
    by ([1.2.5](#x1-400005)). Let (![|i⟩](img/file196.jpg))[i=1,...,N] and (![|j⟩](img/file197.jpg))[j=1,...,M]
    denote, respectively, the standard orthonormal bases of the Hilbert spaces of
    systems *A* and *B*:'
  id: totrans-285
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从一个由两个组成部分的物理系统的态开始，该系统由公式（[1.2.5](#x1-400005)）给出。让 (![|i⟩](img/file196.jpg))[i=1,...,N]
    和 (![|j⟩](img/file197.jpg))[j=1,...,M] 分别表示系统*A*和*B*的希尔伯特空间的标准正交基：
- en: '| ![ N M ∑ ∑ &#124;ψA ⟩ = αi &#124;i⟩, &#124;ψB ⟩ = βj &#124;j⟩, i=1 j=1 ](img/file198.jpg)
    |  |'
  id: totrans-286
  prefs: []
  type: TYPE_TB
  zh: '| ![ N M ∑ ∑ &#124;ψA ⟩ = αi &#124;i⟩, &#124;ψB ⟩ = βj &#124;j⟩, i=1 j=1 ](img/file198.jpg)
    |  |'
- en: where (*α*[i])[i=1,...,N] and (*β*[j])[j=1,...,M] are some probability amplitudes.
    The states that allow the state vector representation ([1.3.1](#x1-420001)) are
    called *pure* states. In this case, the state of the combined system is
  id: totrans-287
  prefs: []
  type: TYPE_NORMAL
  zh: 其中(*α*[i])[i=1,...,N] 和 (*β*[j])[j=1,...,M]是一些概率振幅。允许通过状态向量表示的态（[1.3.1](#x1-420001)）称为*纯态*。在这种情况下，组合系统的状态为
- en: '| ![ ∑N M∑ &#124;ψ ⟩ = &#124;ψA ⟩⊗ &#124;ψB ⟩ = αiβj &#124;i⟩⊗ &#124;j⟩. i=1
