- en: '**Lemma 5.** *Let **ρ* *be a density matrix. The inequality* Tr(*ρ*²) ≤ 1 *always*
    *holds and* Tr(*ρ*²) = 1 *if and only if **ρ* *corresponds to a pure state.*'
  id: totrans-342
  prefs: []
  type: TYPE_NORMAL
