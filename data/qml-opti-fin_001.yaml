  zh: 根据内积的定义（定义 [1](#x1-25002r1)）。
- en: 1.1.11 Tensor product
  id: totrans-181
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.11 张量积
- en: 'Given two vector spaces U and V of dimensions *m* and *n*, the tensor product
    U ⊗V is a vector space of dimension *mn*. For u ∈U and v ∈V, we can form the vector
    ![|uv ⟩](img/file70.jpg) := ![|u⟩](img/file71.jpg)⊗![|v⟩](img/file72.jpg)∈U ⊗V
    with the following properties:'
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 给定两个维度分别为 *m* 和 *n* 的向量空间 U 和 V，张量积 U ⊗V 是一个维度为 *mn* 的向量空间。对于 u ∈U 和 v ∈V，我们可以形成向量
    ![|uv ⟩](img/file70.jpg) := ![|u⟩](img/file71.jpg)⊗![|v⟩](img/file72.jpg)∈U ⊗V，具有以下性质：
- en: '![ ′ |(u + u )v⟩](img/file73.jpg) = ![|uv ⟩](img/file74.jpg) + ![ ′ |u v⟩](img/file75.jpg),
    for any u′∈U;'
  id: totrans-183
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '![ ′ |(u + u )v⟩](img/file73.jpg) = ![|uv ⟩](img/file74.jpg) + ![ ′ |u v⟩](img/file75.jpg)，对于任何
    u′∈U；'
- en: '![|u(v + v′)⟩](img/file76.jpg) = ![|uv ⟩](img/file77.jpg) + ![|uv′⟩](img/file78.jpg),
    for any v′∈V;'
  id: totrans-184
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '![|u(v + v′)⟩](img/file76.jpg) = ![|uv ⟩](img/file77.jpg) + ![|uv′⟩](img/file78.jpg)，对于任何
    v′∈V；'
- en: '*α*![|uv⟩](img/file79.jpg) = ![|(αu)v⟩](img/file80.jpg) = ![|u(αv)⟩](img/file81.jpg),
    for any *α* ∈ℂ.'
  id: totrans-185
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*α* ![|uv⟩](img/file79.jpg) = ![|(αu)v⟩](img/file80.jpg) = ![|u(αv)⟩](img/file81.jpg)，对于任何
    *α* ∈ℂ。'
- en: 'Given the linear operators 𝒜 : U →U and ℬ : V →V, we can then define their
    tensor product as an operator 𝒜⊗ℬ on U ⊗V:'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: '给定线性算子 𝒜 : U →U 和 ℬ : V →V，我们可以将它们的张量积定义为作用在 U ⊗V 上的算子 𝒜⊗ℬ：'
- en: '| ![( ) 𝒜 ⊗ ℬ &#124;uv ⟩ := &#124;(𝒜u),(ℬv)⟩, ](img/file82.jpg) |  |'
  id: totrans-187
  prefs: []
  type: TYPE_TB
  zh: '| ![( ) 𝒜 ⊗ ℬ &#124;uv ⟩ := &#124;(𝒜u),(ℬv)⟩, ](img/file82.jpg) |  |'
- en: which can be represented in matrix form as A ⊗ B ∈ℳ[mn,mn](ℂ).
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: 它可以用矩阵形式表示为 A ⊗ B ∈ℳ[mn,mn](ℂ)。
- en: This Dirac formalism, fully anchored in (classical) linear algebra, now opens
    the gates to a proper dive into the foundations of quantum mechanics.
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: 这个狄拉克形式主义，完全植根于（经典）线性代数，现在为深入探索量子力学基础打开了大门。
- en: 1.2 Postulates of Quantum Mechanics
  id: totrans-190
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.2 量子力学的公设
- en: 'Quantum mechanics states several mathematical postulates that a physical theory
    must satisfy. It turns out that the mathematics of quantum mechanics allows for
    more general *computation*: more general definition of the *memory state* in comparison
    with classical digital computing and a wider range of possible *transformations*
    of such memory states. A natural question arises: what is the reason for this
    superior mode of computation not being used until very recently? The answer is
    that although quantum mechanics was formulated almost a century ago (Paul Dirac’s
    seminal work "The Principles of Quantum Mechanics"  [[86](Biblography.xhtml#XDirac1930)]
    was published in 1930), the realisation of the rules of quantum mechanics in the
    computational protocol performed on classical digital computers requires an enormous
    amount of memory. Exponential gains in computing power are offset by exponential
    memory requirements.'
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: 量子力学陈述了物理理论必须满足的几个数学公设。事实证明，量子力学的数学允许更一般的 *计算*：与经典数字计算相比，更一般的 *记忆状态* 定义和更广泛的
    *变换* 可能性。一个自然的问题是：为什么这种优越的计算模式直到最近才被使用？答案是，尽管量子力学几乎一个世纪前就被提出（保罗·狄拉克的开创性著作《量子力学原理》[[86](Biblography.xhtml#XDirac1930)]于1930年出版），但将量子力学的规则应用于在经典数字计算机上执行的计算协议需要巨大的内存。计算能力的指数增长被指数级的内存需求所抵消。
- en: In order to perform quantum computations efficiently, we need to use actual
    quantum mechanical systems, with their ability to encode information in their
    states. To illustrate this point, the state of a quantum system consisting of *n*
    quantum bits (qubits) can be described by specifying 2^n probability amplitudes
    – this is a huge amount of information even for very small systems (*n* ∼ 100)
    and it would be impossible to store this information in classical memory. It took
    decades of technological progress before quantum processing units (QPUs) – devices
    that control quantum mechanical systems performing computations – became feasible.
  id: totrans-192
  prefs: []
  type: TYPE_NORMAL
  zh: 为了高效地执行量子计算，我们需要使用实际的量子力学系统，利用其在状态中编码信息的能力。为了说明这一点，由 *n* 个量子比特（qubits）组成的量子系统的状态可以通过指定
    2^n 个概率振幅来描述——即使对于非常小的系统（*n* ∼ 100）来说，这也是一个庞大的信息量，并且在经典内存中存储这些信息是不可能的。在量子处理单元（QPUs）——控制量子力学系统进行计算的设备——变得可行之前，经历了数十年的技术进步。
- en: 'Let us now proceed with the formulation of the mathematical postulates that
    lie at the foundation of quantum mechanics. These postulates specify a general
    framework for describing the behaviour of a physical system  [[80](Biblography.xhtml#XDawar), [182](Biblography.xhtml#XLandau1965), [249](Biblography.xhtml#XRobinett2006)]:'
  id: totrans-193
  prefs: []
  type: TYPE_NORMAL
  zh: 现在让我们继续推导构成量子力学基础的数学公设。这些公设规定了描述物理系统行为的一般框架[[80](Biblography.xhtml#XDawar)，[182](Biblography.xhtml#XLandau1965)，[249](Biblography.xhtml#XRobinett2006)]：
- en: How to describe the state of a closed system.
  id: totrans-194
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何描述一个封闭系统的状态。
- en: How to describe the evolution of a closed system.
  id: totrans-195
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何描述一个封闭系统的演化。
- en: How to describe the interactions of a system with external systems.
  id: totrans-196
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何描述系统与外部系统的相互作用。
- en: How to describe observables of a system.
  id: totrans-197
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何描述系统的可观测量。
- en: How to describe the state of a composite system in terms of its component parts.
  id: totrans-198
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何描述复合系统的状态，以及它的组成部分。
- en: 1.2.1 First postulate – Statics
  id: totrans-199
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.2.1 第一个公设——静力学
- en: '**Postulate 1\.** *Associated to any physical system is a complex inner product
    space* *known as the state space of the system. The system is completely described
    at any* *given point in time by its state vector, which is a unit vector in its
    state space.*'
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: '**公设 1**。*与任何物理系统相关联的是一个复杂的内积空间*，*被称为该系统的状态空间。系统在任何给定时刻完全由其状态向量描述，该状态向量是其状态空间中的单位向量。*'
- en: 'What is the importance of the first postulate from the quantum computing point
    of view? The answer is that quantum mechanics offers us a straightforward generalisation
    of the classical *binary digit* (bit). The classical bit is a two-state system
    with controlled transitions between them. As an example, we can use an electrical
    switch that can exist in one of the two discrete, stable states ("on" and "off").
    Although electrical switches may seem an odd physical realisation of bits in the
    age of transistors, they illustrate an important point about computation in general:
    it is substrate independent. Exactly the same computational results can be obtained
    using electrical relays and CMOS transistors.'
  id: totrans-201
  prefs: []
  type: TYPE_NORMAL
  zh: 从量子计算的角度来看，第一个公设的重要性是什么？答案是，量子力学为我们提供了经典*二进制位*（bit）的直接推广。经典比特是一个二态系统，在这两个状态之间有控制的转换。例如，我们可以使用一个电气开关，它可以处于两个离散的、稳定的状态（“开”和“关”）之一。尽管在晶体管时代，电气开关似乎是比特的一个奇怪物理实现，但它们说明了一个关于计算的一般重要观点：它是独立于底层硬件的。使用电气继电器和CMOS晶体管可以获得完全相同的计算结果。
- en: The quantum mechanical version of a bit, called a *quantum binary digit* (qubit),
    is a quantum mechanical two-state system. The first postulate of quantum mechanics
    tells us that the state of such a system can be represented mathematically by
    a unit vector in the two-dimensional complex vector space. This also means that
    such a system can exist in a superposition of basis states. Indeed, any vector
    ![|v⟩](img/file83.jpg) in the two-dimensional complex vector space,
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 量子力学中的比特版本，称为*量子二进制位*（量子比特，qubit），是一个量子力学的二态系统。量子力学的第一个公设告诉我们，这样一个系统的状态可以通过一个二维复数向量空间中的单位向量在数学上表示。这也意味着这样的系统可以存在于基态的叠加态中。事实上，任何向量![|v⟩](img/file83.jpg)在二维复数向量空间中，
- en: '![ ⌊ ⌋ α |v⟩ = ⌈ ⌉ , β ](img/file84.jpg)'
  id: totrans-203
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ α |v⟩ = ⌈ ⌉ , β ](img/file84.jpg)'
- en: 'can be represented as a linear combination of the standard basis vectors:'
  id: totrans-204
  prefs: []
  type: TYPE_NORMAL
  zh: 可以表示为标准基向量的线性组合：
- en: '![⌊ ⌋ ⌊ ⌋ ⌊ ⌋ ⌈ α⌉ ⌈1⌉ ⌈0⌉ β = α 0 + β 1 , |v⟩ = α |0⟩ + β |1⟩. ](img/file85.jpg)'
  id: totrans-205
  prefs: []
  type: TYPE_IMG
  zh: '![⌊ ⌋ ⌊ ⌋ ⌊ ⌋ ⌈ α⌉ ⌈1⌉ ⌈0⌉ β = α 0 + β 1 , |v⟩ = α |0⟩ + β |1⟩. ](img/file85.jpg)'
- en: Since the state vector is a unit vector, the coefficients *α* and *β* must satisfy
  id: totrans-206
  prefs: []
  type: TYPE_NORMAL
  zh: 由于状态向量是单位向量，系数*α*和*β*必须满足
- en: '![|α|2 + |β|2 = 1\. ](img/file86.jpg)'
  id: totrans-207
  prefs: []
  type: TYPE_IMG
  zh: '![|α|2 + |β|2 = 1\. ](img/file86.jpg)'
- en: 'The coefficients *α* and *β* are *probability amplitudes*. Even though a qubit
    can exist in a superposition of basis states, once *measured* (see Postulate 3),
    its state *collapses* to one of the basis states: |*α*|² and |*β*|² give us the
    probability of finding the qubit, respectively, in states ![|0⟩](img/file87.jpg)
    and ![|1⟩](img/file88.jpg) after measurement.'
  id: totrans-208
  prefs: []
  type: TYPE_NORMAL
  zh: 系数*α*和*β*是*概率振幅*。尽管一个量子比特可以存在于基态的叠加中，但一旦*测量*（见公设 3），其状态会*塌缩*到基态之一：|*α*|²和|*β*|²分别给出了在测量后找到量子比特处于状态![|0⟩](img/file87.jpg)和![|1⟩](img/file88.jpg)的概率。
- en: One can draw an analogy with how the space of natural numbers, ℕ, can be extended
    to the space of real numbers, ℝ, and then to the space of complex numbers, ℂ.
    We have a much wider range of functions that can operate on and take values in
    ℝ and ℂ than in ℕ. Similarly, allowing the two-state system to exist in a superposition
    of states significantly extends the range of possible operators that can transform
    such states (i.e., perform computation).
  id: totrans-209
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以类比自然数空间ℕ如何扩展到实数空间ℝ，然后扩展到复数空间ℂ。相比于ℕ，我们在ℝ和ℂ中有更多的函数可以操作并取得值。类似地，允许二态系统存在于叠加态显著扩展了可以转换这些状态的算子的范围（即进行计算）。
- en: 'For example, there is no Boolean function *f* that, when applied twice to a
    classical bit, would result in a NOT gate: *f*(*f*(0)) = 1 and *f*(*f*(1)) = 0\.
    But there is such an operator in quantum computing. We can easily verify by direct
    calculations that the matrix'
  id: totrans-210
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，不存在一个布尔函数*f*，当它作用于经典比特两次时，会产生一个 NOT 门：*f*(*f*(0)) = 1 且 *f*(*f*(1)) = 0。然而，在量子计算中，确实存在这样的算子。我们可以通过直接计算轻松验证，矩阵
- en: '![ ⌊ ⌋ 1 + i 1 − i M := 1-⌈ ⌉ , 2 1 − i 1 + i ](img/file89.jpg)'
  id: totrans-211
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ 1 + i 1 − i M := 1-⌈ ⌉ , 2 1 − i 1 + i ](img/file89.jpg)'
- en: applied twice to the basis vector ![|0⟩](img/file90.jpg) would transform it
    to the basis vector ![|1⟩](img/file91.jpg), and applied twice to the basis vector
    ![|1⟩](img/file92.jpg) would transform it to the basis vector ![|0⟩](img/file93.jpg).
    M is an example of a *quantum logic gate* – an operator that transforms the state
    of a qubit, thus implementing the computation.
  id: totrans-212
  prefs: []
  type: TYPE_NORMAL
  zh: 对基向量![|0⟩](img/file90.jpg)应用两次会将其转换为基向量![|1⟩](img/file91.jpg)，对基向量![|1⟩](img/file92.jpg)应用两次会将其转换为基向量![|0⟩](img/file93.jpg)。M是一个*量子逻辑门*的例子——它是一个转换量子比特状态的算符，从而实现计算。
- en: '**Remark:** The state space of a physical system can be infinite-dimensional.
    The quantum computing paradigm based on infinite-dimensional Hilbert spaces is
    called *continuous-variable quantum computing*, which is realised in, e.g., some
    photonic quantum computing systems. However, in the context of digital quantum
    computing, we will restrict our analysis to finite-dimensional state spaces.'
  id: totrans-213
  prefs: []
  type: TYPE_NORMAL
  zh: '**备注：** 物理系统的状态空间可以是无限维的。基于无限维希尔伯特空间的量子计算范式被称为*连续变量量子计算*，例如在一些光子量子计算系统中得以实现。然而，在数字量子计算的背景下，我们将限制分析为有限维状态空间。'
- en: The state of a qubit (the fundamental memory unit of quantum computing that
    generalises the concept of a classical bit) can be described mathematically as
    a unit vector in the two-dimensional complex vector space. Any physical system
    whose state space can be described by ℂ² can serve as an implementation of a qubit.
  id: totrans-214
  prefs: []
  type: TYPE_NORMAL
  zh: 量子比特（量子计算的基本存储单元，是经典比特概念的推广）的状态可以在数学上描述为二维复向量空间中的单位向量。任何其状态空间可以由ℂ²描述的物理系统都可以作为量子比特的实现。
- en: 1.2.2 Second postulate – Dynamics
  id: totrans-215
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.2.2 第二公设 – 动力学
- en: '**Postulate 2\.** *The time evolution of a closed quantum system is described
    by the* *Schrödinger equation*'
  id: totrans-216
  prefs: []
  type: TYPE_NORMAL
  zh: '**公设2：** *闭合量子系统的时间演化由* *薛定谔方程* *描述*'
- en: '| ![iℏd-&#124;ψ-(t)⟩ = ℋ &#124;ψ(t)⟩, dt ](img/file94.jpg) |  |'
  id: totrans-217
  prefs: []
  type: TYPE_TB
  zh: '| ![iℏd-&#124;ψ-(t)⟩ = ℋ &#124;ψ(t)⟩, dt ](img/file94.jpg) |  |'
- en: '*where* ℏ *is Planck’s constant and* ℋ *is a time-independent Hermitian operator*
    *known as the Hamiltonian of the system.*'
  id: totrans-218
  prefs: []
  type: TYPE_NORMAL
  zh: '*其中* ℏ *是普朗克常数，* ℋ *是一个与时间无关的厄米算符*，*被称为系统的哈密顿量*。'
- en: The Hamiltonian of a quantum system is an operator corresponding to the total
    energy of that system, and its eigenvalues are the possible energy levels of the
    system. The knowledge of the Hamiltonian provides all the necessary information
    about system dynamics.
  id: totrans-219
  prefs: []
  type: TYPE_NORMAL
  zh: 一个量子系统的哈密顿量是对应于该系统总能量的算符，其特征值是系统可能的能级。对哈密顿量的了解提供了关于系统动力学的所有必要信息。
- en: In the Schrödinger equation ([1.2.2](#x1-370002)), the state ![|ψ(t1)⟩](img/file95.jpg)
    of a closed quantum system at time *t*[1] is related to the state ![|ψ (t2)⟩](img/file96.jpg)
    at time *t*[2] by a unitary operator 𝒰(*t*[1]*,t*[2]) that depends only on *t*[1]
    and *t*[2] via
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: 在薛定谔方程([1.2.2](#x1-370002))中，闭合量子系统在时间*t*[1]的状态![|ψ(t1)⟩](img/file95.jpg)与时间*t*[2]的状态![|ψ(t2)⟩](img/file96.jpg)之间通过仅依赖于*t*[1]和*t*[2]的单位算符𝒰(*t*[1]*,t*[2])相互联系：
- en: '| ![&#124;ψ(t2)⟩ = 𝒰 (t1,t2) &#124;ψ(t1)⟩ , ](img/file97.jpg) |  |'
  id: totrans-221
  prefs: []
  type: TYPE_TB
  zh: '| ![&#124;ψ(t2)⟩ = 𝒰 (t1,t2) &#124;ψ(t1)⟩ , ](img/file97.jpg) |  |'
- en: where 𝒰(*t*[1]*,t*[2]) is obtained from the Hamiltonian ℋ as
  id: totrans-222
  prefs: []
  type: TYPE_NORMAL
  zh: 其中𝒰(*t*[1]*,t*[2])是由哈密顿量ℋ得到的。
- en: '| ![ ( ) iℋ-(t2-−-t1) 𝒰 (t1,t2) = exp − ℏ . ](img/file98.jpg) |  |'
  id: totrans-223
  prefs: []
  type: TYPE_TB
  zh: '| ![ ( ) iℋ-(t2-−-t1) 𝒰 (t1,t2) = exp − ℏ . ](img/file98.jpg) |  |'
- en: 'Unitary operators preserve the inner product (and therefore norms, lengths,
    and distances), which means that for two vectors ![|u⟩](img/file99.jpg) and ![|v⟩](img/file100.jpg),
    if 𝒰 is a unitary operator, then the inner product between 𝒰![|u⟩](img/file101.jpg)
    and 𝒰![|v⟩](img/file102.jpg) is the same as the inner product between ![|u⟩](img/file103.jpg)
    and ![|v⟩](img/file104.jpg):'
  id: totrans-224
  prefs: []
  type: TYPE_NORMAL
  zh: 单位算符保持内积（因此保持范数、长度和距离），这意味着对于两个向量![|u⟩](img/file99.jpg)和![|v⟩](img/file100.jpg)，如果𝒰是单位算符，那么𝒰![|u⟩](img/file101.jpg)与𝒰![|v⟩](img/file102.jpg)之间的内积与![|u⟩](img/file103.jpg)和![|v⟩](img/file104.jpg)之间的内积是相同的：
- en: '| ![ † ⟨u&#124;𝒰 𝒰 &#124;v⟩ = ⟨u&#124;v⟩ . ](img/file105.jpg) |  |'
  id: totrans-225
  prefs: []
  type: TYPE_TB
  zh: '| ![ † ⟨u&#124;𝒰 𝒰 &#124;v⟩ = ⟨u&#124;v⟩ . ](img/file105.jpg) |  |'
- en: 'A unitary operator is a complex generalisation of a rotation: unitary operators
    take an orthonormal basis to another orthonormal basis, and any operator with
    this property is unitary. In quantum mechanics, physical transformations such
    as rotations, translations and time evolution correspond to maps that take quantum
    states to other quantum states. These maps should be linear and preserve the inner
    product. This allows us to look at the unitary operators as the *quantum* *logic
    gates* implementing quantum computation protocols. Furthermore, unitary operators
    are invertible, a key property that ensures that quantum computing is *reversible*.'
  id: totrans-226
  prefs: []
  type: TYPE_NORMAL
  zh: 单位算符是旋转的复数推广：单位算符将正交基变换到另一个正交基，任何具备此性质的算符都是单位算符。在量子力学中，物理变换如旋转、平移和时间演化对应于将量子态映射到其他量子态的映射。这些映射应该是线性的，并且保持内积。这使得我们可以将单位算符视为实现量子计算协议的*量子*
    *逻辑门*。此外，单位算符是可逆的，这一关键特性确保了量子计算是*可逆的*。
- en: Quantum logic gates (quantum counterparts of the Boolean logic gates in classical
    computing) are unitary operators that transform quantum states, thus implementing
    the computation.
  id: totrans-227
  prefs: []
  type: TYPE_NORMAL
  zh: 量子逻辑门（经典计算中的布尔逻辑门的量子对应物）是单位算符，能够变换量子态，从而实现计算。
- en: 1.2.3 Third postulate – Measurement
  id: totrans-228
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.2.3 第三公设 – 测量
- en: Given a Hermitian operator 𝒜, the spectral theorem implies that the state ![|ψ⟩](img/file106.jpg)
    of a system can be written as a superposition
  id: totrans-229
  prefs: []
  type: TYPE_NORMAL
  zh: 给定一个厄米算符 𝒜，谱定理意味着系统的状态 ![|ψ⟩](img/file106.jpg) 可以写成一个叠加态
- en: '| ![ ∑N &#124;ψ⟩ = αi &#124;ψi⟩ , i=1 ](img/file107.jpg) |  |'
  id: totrans-230
  prefs: []
  type: TYPE_TB
  zh: '| ![ ∑N &#124;ψ⟩ = αi &#124;ψi⟩ , i=1 ](img/file107.jpg) |  |'
- en: 'where the coefficients (*α*[i])[i=1,…,N] are complex *probability amplitudes*,
    assumed to be normalised with ∑ [i=1]^N|*α*[i]|² = 1, and where (![|ψi⟩](img/file108.jpg))[i=1,…,N]
    are eigenfunctions of 𝒜. The measurement postulate then reads as follows:'
  id: totrans-231
  prefs: []
  type: TYPE_NORMAL
  zh: 其中系数(*α*[i])[i=1,…,N]是复数*概率振幅*，假设已标准化，满足∑ [i=1]^N|*α*[i]|² = 1，并且 (![|ψi⟩](img/file108.jpg))[i=1,…,N]
    是𝒜的特征函数。测量公设则如下所述：
- en: '**Postulate 3\.** *If we measure the Hermitian operator* 𝒜 *in the state* ![|ψ⟩](img/file109.jpg)
    *given* *in *([1.2.3](#x1-380003))*, the possible outcomes for the measurement
    are the eigenvalues* (*λ*[i])[i=1,…,N] *of *𝒜*, and the probability **p*[i] *to
    measure **λ*[i] *is given by* *p*[i] = |*α*[i]|²*. After* *the outcome **λ*[i]*,
    the state of the system becomes*'
  id: totrans-232
  prefs: []
  type: TYPE_NORMAL
  zh: '**公设 3**。*如果我们在状态* ![|ψ⟩](img/file109.jpg) *中测量厄米算符* 𝒜 *，则测量的可能结果是* 𝒜 *的特征值*
    (*λ*[i])[i=1,…,N] *，并且测量到* λ*[i] *的概率* **p*[i] *由* *p*[i] = |*α*[i]|²*给出。测量结果*
    **λ*[i]*后，系统的状态变为*'
- en: '| ![&#124;ψ⟩ = &#124;ψi⟩. ](img/file110.jpg) |  |'
  id: totrans-233
  prefs: []
  type: TYPE_TB
  zh: '| ![&#124;ψ⟩ = &#124;ψi⟩. ](img/file110.jpg) |  |'
- en: '*An immediate measurement in the same computational basis will deliver the
    same* *result without any uncertainty.*'
  id: totrans-234
  prefs: []
  type: TYPE_NORMAL
  zh: '*在相同计算基下的即时测量将给出相同的* *结果，没有任何不确定性。*'
- en: The quantum measurements are described by *measurement operators* (𝒫[i])[i=1,…,N],
    acting on the state space of the system with *N* possible outcomes. If the state
    of the system is ![|ψ⟩](img/file111.jpg) before the measurement, then the probability
    of outcome *i* is
  id: totrans-235
  prefs: []
  type: TYPE_NORMAL
  zh: 量子测量由*测量算符* (𝒫[i])[i=1,…,N] 描述，作用于系统的状态空间，具有*N*个可能结果。如果系统的状态在测量前是 ![|ψ⟩](img/file111.jpg)，则结果*i*的概率为
- en: '![ℙ(i) = ⟨ψ |𝒫 †i𝒫i |ψ ⟩. ](img/file112.jpg)'
  id: totrans-236
  prefs: []
  type: TYPE_IMG
  zh: '![ℙ(i) = ⟨ψ |𝒫 †i𝒫i |ψ ⟩. ](img/file112.jpg)'
- en: The measurement operators should also satisfy the *completeness condition*
  id: totrans-237
  prefs: []
  type: TYPE_NORMAL
  zh: 测量算符还应满足*完整性条件*
- en: '| ![∑N 𝒫 †i𝒫i = ℐ, i=1 ](img/file113.jpg) |  |'
  id: totrans-238
  prefs: []
  type: TYPE_TB
  zh: '| ![∑N 𝒫 †i𝒫i = ℐ, i=1 ](img/file113.jpg) |  |'
- en: where ℐ is the identity operator. This ensures that the sum of the probabilities
    of all outcomes adds up to 1.
  id: totrans-239
  prefs: []
  type: TYPE_NORMAL
  zh: 其中ℐ是单位算符。这确保了所有结果的概率之和为1。
- en: These measurement operators are linear but not unitary. From the quantum computing
    perspective, we are interested in measurement operators that are *projections*
    (Definition [2](#x1-25004r2)) onto the *computational basis*, such as the standard
    orthonormal basis given by ([1.1.9](#x1-320009)).
  id: totrans-240
  prefs: []
  type: TYPE_NORMAL
  zh: 这些测量算符是线性的，但不是单位的。从量子计算的角度来看，我们关注的是*投影*测量算符（定义 [2](#x1-25004r2)），它们是*计算基*的投影，例如由 ([1.1.9](#x1-320009))给出的标准正交基。
- en: For example, the measurement operators for a single qubit can be defined as
  id: totrans-241
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，单个量子比特的测量算符可以定义为
- en: '![ ⌊ ⌋ ⌊ ⌋ 1 0 0 0 𝒫0 := |0⟩⟨0| = ⌈ ⌉ and 𝒫1 := |1⟩⟨1| = ⌈ ⌉ . 0 0 0 1 ](img/file114.jpg)'
  id: totrans-242
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ ⌊ ⌋ 1 0 0 0 𝒫0 := |0⟩⟨0| = ⌈ ⌉ and 𝒫1 := |1⟩⟨1| = ⌈ ⌉ . 0 0 0 1 ](img/file114.jpg)'
- en: We can easily verify that 𝒫[0]² = 𝒫[0] and 𝒫[1]² = 𝒫[1], as should be the case
    for projection operators, and that the completeness condition ([1.2.3](#x1-380003))
    is satisfied. If the qubit is in state ![|ψ⟩](img/file115.jpg) = *α*![|0⟩](img/file116.jpg)
    + *β*![|1⟩](img/file117.jpg), then the measurement operator 𝒫[0] will give us
    ![|0⟩](img/file118.jpg) with probability |*α*|², and the measurement operator 𝒫[1]
    will give us ![|1⟩](img/file119.jpg) with probability |*β*|². Indeed,
  id: totrans-243
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以很容易验证𝒫[0]² = 𝒫[0]且𝒫[1]² = 𝒫[1]，这正是投影算符的性质，并且满足完整性条件([1.2.3](#x1-380003))。如果量子比特处于状态![|ψ⟩](img/file115.jpg)
    = *α*![|0⟩](img/file116.jpg) + *β*![|1⟩](img/file117.jpg)，那么测量算符𝒫[0]将以概率|*α*|²给出![|0⟩](img/file118.jpg)，测量算符𝒫[1]将以概率|*β*|²给出![|1⟩](img/file119.jpg)。实际上，
- en: '| 𝒫[0]![&#124;ψ ⟩](img/file120.jpg) | = ![&#124;0⟩](img/file121.jpg)⟨0&#124;![(](img/file122.jpg)*α*![&#124;0⟩](img/file123.jpg)
    + *β*![&#124;1⟩](img/file124.jpg)![)](img/file125.jpg) = *α*![&#124;0⟩](img/file126.jpg)⟨0&#124;![&#124;0⟩](img/file127.jpg)
    + *β*![&#124;0⟩](img/file128.jpg)⟨0&#124;![&#124;1⟩](img/file129.jpg) = *α*![&#124;0⟩](img/file130.jpg)*,*
    |'
  id: totrans-244
  prefs: []
  type: TYPE_TB
  zh: '| 𝒫[0]![&#124;ψ ⟩](img/file120.jpg) | = ![&#124;0⟩](img/file121.jpg)⟨0&#124;![(](img/file122.jpg)*α*![&#124;0⟩](img/file123.jpg)
    + *β*![&#124;1⟩](img/file124.jpg)![)](img/file125.jpg) = *α*![&#124;0⟩](img/file126.jpg)⟨0&#124;![&#124;0⟩](img/file127.jpg)
    + *β*![&#124;0⟩](img/file128.jpg)⟨0&#124;![&#124;1⟩](img/file129.jpg) = *α*![&#124;0⟩](img/file130.jpg)*,*
    |'
- en: '| 𝒫[1]![&#124;ψ ⟩](img/file131.jpg) | = ![&#124;1⟩](img/file132.jpg)⟨1&#124;![(](img/file133.jpg)*α*![&#124;0⟩](img/file134.jpg)
    + *β*![&#124;1⟩](img/file135.jpg)![)](img/file136.jpg) = *α*![&#124;1⟩](img/file137.jpg)⟨1&#124;![&#124;0⟩](img/file138.jpg)
    + *β*![&#124;1⟩](img/file139.jpg)⟨1&#124;![&#124;1⟩](img/file140.jpg) = *β*![&#124;1⟩](img/file141.jpg)*.*
    |'
  id: totrans-245
  prefs: []
  type: TYPE_TB
  zh: '| 𝒫[1]![&#124;ψ ⟩](img/file131.jpg) | = ![&#124;1⟩](img/file132.jpg)⟨1&#124;![(](img/file133.jpg)*α*![&#124;0⟩](img/file134.jpg)
    + *β*![&#124;1⟩](img/file135.jpg)![)](img/file136.jpg) = *α*![&#124;1⟩](img/file137.jpg)⟨1&#124;![&#124;0⟩](img/file138.jpg)
    + *β*![&#124;1⟩](img/file139.jpg)⟨1&#124;![&#124;1⟩](img/file140.jpg) = *β*![&#124;1⟩](img/file141.jpg)*.*
    |'
- en: The measurement postulate of quantum mechanics states that an immediate measurement
    in the same computational basis will deliver the same result without any uncertainty.
    The key words here are "the same computational basis". What would happen if the
    subsequent measurement is performed in another basis (the basis specified by another
    set of linearly independent unit vectors from the state space)? For example, assume
    that the qubit is in state
  id: totrans-246
  prefs: []
  type: TYPE_NORMAL
  zh: 量子力学的测量公设表明，在相同的计算基中进行的直接测量将返回相同的结果，不会有任何不确定性。这里的关键词是“相同的计算基”。如果接下来的测量是在另一个基中进行（由来自状态空间的另一组线性无关的单位向量指定的基）会发生什么呢？例如，假设量子比特处于状态
- en: '![ 1 1 |ψ⟩ = √---|0⟩ + √---|1⟩. 2 2 ](img/file142.jpg)'
  id: totrans-247
  prefs: []
  type: TYPE_IMG
  zh: '![ 1 1 |ψ⟩ = √---|0⟩ + √---|1⟩. 2 2 ](img/file142.jpg)'
