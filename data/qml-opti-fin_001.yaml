  type: TYPE_NORMAL
  zh: 1.1.4 条件数
- en: 'In order to manipulate matrices and measure them, we require matrix norms:'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 为了操作矩阵并进行测量，我们需要矩阵范数：
- en: '**Definition 5.** A matrix norm ∥⋅∥ : ℳ[m,n](𝔽) →ℝ is a function satisfying,
    for any *α* ∈𝔽 and A*,*B ∈ℳ[m,n](𝔽),'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义 5.** 矩阵范数 ∥⋅∥ : ℳ[m,n](𝔽) →ℝ 是一个满足以下条件的函数，对于任意 *α* ∈𝔽 和 A,*B ∈ℳ[m,n](𝔽)，'
- en: (positively valued) ∥A∥≥ 0;
  id: totrans-63
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: （正值）∥A∥≥ 0；
- en: (definite) ∥A∥ = 0 if and only if A = 0[m,n];
  id: totrans-64
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: (确定的) ∥A∥ = 0 当且仅当 A = 0[m,n]；
- en: (absolutely homogeneous) ∥*α*A∥ = |*α*|∥A∥;
  id: totrans-65
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: （绝对齐次）∥*α*A∥ = |*α*|∥A∥；
- en: (triangle inequality) ∥A + B∥≤∥A∥ + ∥B∥.
  id: totrans-66
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: （三角不等式）∥A + B∥≤∥A∥ + ∥B∥。
- en: The norm is further called sub-multiplicative if ∥AB∥≤∥A∥∥B∥.
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 ∥AB∥≤∥A∥∥B∥，则该范数进一步称为子乘法范数。
- en: The condition number of a matrix is an important tool to understand the stability
    of linear equations of the form Ax = b, for A ∈ℳ[n](𝔽), b ∈𝔽^n. Assuming A to
    be non-singular, the true solution is clearly x[∗] := A^(−1)b. Suppose, however,
    that the vector b is only known up to some (not necessarily quantum) measurement
    error, and one observes instead b + Δ[b]. The solution is then A^(−1)(b + Δ[b])
    = x[∗] + Δ[x], with Δ[x] := A^(−1)Δ[b]. In particular, we can write, for any (sub-multiplicative)
    matrix norm ∥⋅∥,
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 矩阵的条件数是理解线性方程组 Ax = b 稳定性的重要工具，其中 A ∈ℳ[n](𝔽)，b ∈𝔽^n。假设 A 非奇异，则真实解显然是 x[∗] :=
    A^(−1)b。然而，假设向量 b 仅通过某些（不一定是量子）测量误差已知，实际观察到的是 b + Δ[b]。此时解为 A^(−1)(b + Δ[b]) =
    x[∗] + Δ[x]，其中 Δ[x] := A^(−1)Δ[b]。特别地，对于任何（子乘法）矩阵范数 ∥⋅∥，我们可以写作：
- en: '![ −1 ∥Δx-∥ = ∥A---Δb-∥≤ ∥A− 1∥ --∥b∥--∥Δb-∥ ≤ ∥A −1∥∥A∥ ∥Δb∥-. ∥x∥ ∥A −1b∥
    ∥A− 1b∥ ∥b∥ ∥b ∥ ](img/file16.jpg)'
  id: totrans-69
  prefs: []
  type: TYPE_IMG
  zh: '![ −1 ∥Δx-∥ = ∥A---Δb-∥≤ ∥A− 1∥ --∥b∥--∥Δb-∥ ≤ ∥A −1∥∥A∥ ∥Δb∥-. ∥x∥ ∥A −1b∥
    ∥A− 1b∥ ∥b∥ ∥b ∥ ](img/file16.jpg)'
- en: 'From this inequality, we see that the quantity ∥A^(−1)∥∥A∥ bounds the relative
    error in the solution with respect to the relative error in the measurement of
    the input vector b. This leads to the following terminology:'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 从这个不等式中，我们可以看出，数量 ∥A^(−1)∥∥A∥ 约束了解的相对误差与输入向量 b 测量误差的相对误差之间的关系。这引出了以下术语：
- en: '**Definition 6.** Given a matrix A ∈ ℳ[n](𝔽) and a sub-multiplicative norm ∥⋅∥,
    we call'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义 6.** 给定矩阵 A ∈ ℳ[n](𝔽) 和子乘法范数 ∥⋅∥，我们称'
- en: '![κ ∥⋅∥(A) := ∥A −1∥∥A ∥ ](img/file17.jpg)'
  id: totrans-72
  prefs: []
  type: TYPE_IMG
  zh: '![κ ∥⋅∥(A) := ∥A −1∥∥A ∥ ](img/file17.jpg)'
- en: the *condition number* (with respect to the norm ∥⋅∥) of the matrix A (and assign
    to it infinite value if A is singular).
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: '*条件数*（相对于范数 ∥⋅∥）是矩阵 A 的一个重要指标（如果 A 是奇异的，则赋予其无穷大值）。'
- en: '**Remark:** The definition of the condition number above holds for any matrix
    norm ∥⋅∥, but admits a more explicit representation in the particular case of
    the spectral norm ∥⋅∥[2], defined as'
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: '**备注：** 上述条件数的定义适用于任何矩阵范数 ∥⋅∥，但在特定情况下，对于谱范数 ∥⋅∥[2]，具有更为明确的表示。'
- en: '![∥A ∥2 := sup ∥Ax∥2-, x⁄=0 ∥x ∥2 ](img/file18.jpg)'
  id: totrans-75
  prefs: []
  type: TYPE_IMG
  zh: '![∥A ∥2 := sup ∥Ax∥2-, x⁄=0 ∥x ∥2 ](img/file18.jpg)'
- en: where ∥x∥[2] := ![(∑ ) ni=1|xi|2](img/file19.jpg)^(![1 2](img/file20.jpg)) is
    the *L* [2] norm for vectors. If the matrix A is not singular, then
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 ∥x∥[2] := ![(∑ ) ni=1|xi|2](img/file19.jpg)^(![1 2](img/file20.jpg)) 是向量的
    *L* [2] 范数。如果矩阵 A 非奇异，则
- en: '![ |λ (A )| κ (A ) :=--max----, |λmin(A)| ](img/file21.jpg)'
  id: totrans-77
  prefs: []
  type: TYPE_IMG
  zh: '![ |λ (A )| κ (A ) :=--max----, |λmin(A)| ](img/file21.jpg)'
- en: where *λ*[max](A) and *λ*[min](A) denote the largest and smallest eigenvalues
    of A.
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 *λ*[max](A) 和 *λ*[min](A) 分别表示矩阵 A 的最大和最小特征值。
- en: 1.1.5 Matrix decompositions and spectral theorem
  id: totrans-79
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.5 矩阵分解与谱定理
- en: Having defined essential properties of (complex) matrices, we now introduce
    several essential tools that allow us to gain a better understanding of their
    properties.
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 在定义了（复）矩阵的基本属性后，我们现在引入几个基本工具，帮助我们更好地理解它们的性质。
- en: The Singular Value Decomposition is a key tool to analyse the properties and
    behaviours of matrices. It is ubiquitous in applied statistics and machine learning
    and allows us to reduce the explanatory dimension of a large matrix into a small
    number of meaningful components.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 奇异值分解是分析矩阵性质和行为的关键工具。它在应用统计学和机器学习中无处不在，能够将一个大矩阵的解释维度缩减为少数几个有意义的成分。
- en: '**Theorem 1** (Singular Value Decomposition)**.** *Let* A ∈ℳ[m,n](𝔽) *and*
    *p* := min(*m,n*)*. There exist* U ∈𝒰[m](𝔽)*,* V ∈𝒰[n](𝔽) *and* *σ*[1] ≥![⋅⋅⋅](img/file22.jpg)≥
    *σ*[p] ≥ 0 *such* *that* A = UΣV^†*, where *Σ ∈ℳ[m,n](𝔽) *is diagonal with* Σ[ii]
    = *σ*[i] *for* *i* = 1*,…,p* *and* Σ[ii] = 0 *for* *i > p**.*'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 1**（奇异值分解）**.** *设* A ∈ℳ[m,n](𝔽) *且* *p* := min(*m,n*)*。存在* U ∈𝒰[m](𝔽)*，*
    V ∈𝒰[n](𝔽) *和* *σ*[1] ≥![⋅⋅⋅](img/file22.jpg)≥ *σ*[p] ≥ 0 *使得* A = UΣV^†*，其中 *Σ
    ∈ℳ[m,n](𝔽) *是对角矩阵，且* Σ[ii] = *σ*[i] *对于* *i* = 1*,…,p*，*且* Σ[ii] = 0 *对于* *i >
    p**。'
- en: The numbers {*σ*[1]*,…,σ*[p]} are called the singular values of A and are uniquely
    defined. The columns of U and V are the left-singular and right-singular vectors
    of A, in the sense that, if *σ* ∈{*σ*[1]*,…,σ*[p]}, then there exist a column u
    of U and a column v of V such that Av = *σ*u and A^†u = *σ*v. Recall that the
    rank of a matrix is defined as the dimension of the span of its columns. As a
    corollary of the Singular Value Decomposition theorem, the rank of a matrix is
    therefore equal to the number of non-zero singular values. The Singular Value
    Decomposition is general in the sense that it holds for any matrix. In the particular
    case of square matrices, the Schur decomposition and the Spectral Theorem provide
    refinements.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 数字 {*σ*[1]*,…,σ*[p]} 称为 A 的奇异值，并且是唯一确定的。U 和 V 的列向量分别是 A 的左奇异向量和右奇异向量，即如果 *σ*
    ∈ {*σ*[1]*,…,σ*[p]}，则存在 U 的一列向量 u 和 V 的一列向量 v，使得 Av = *σ*u 和 A^†u = *σ*v。回顾一下，矩阵的秩定义为其列的张成空间的维度。根据奇异值分解定理，矩阵的秩等于非零奇异值的数量。奇异值分解是一般性的，即它适用于任何矩阵。在方阵的特定情况下，舒尔分解和谱定理提供了更精细的结果。
- en: 'The Spectral Theorem is a cornerstone result in the theory of linear operators,
    and in particular for (finite-dimensional) matrices. Recall that an operator 𝒜
    : V →V is called normal if it commutes with its adjoint, namely if 𝒜𝒜^† = 𝒜^†𝒜.
    Self-adjoint (or Hermitian) operators are clearly normal, yet the converse is
    not true in general. Recall further that an eigenvector of 𝒜 is a non-zero vector
    u ∈V such that 𝒜u = *λ*u for some *λ* ∈ℂ, and we denote by *σ*(𝒜) the set of eigenvalues
    of 𝒜.'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: '谱定理是线性算子理论中的基石结果，特别是对于（有限维）矩阵。回顾一下，算子 𝒜 : V →V 被称为正常的，如果它与其伴随算子对易，即 𝒜𝒜^† =
    𝒜^†𝒜。自伴算子（或厄米算子）显然是正常的，但反之不一定成立。进一步回顾，𝒜 的特征向量是一个非零向量 u ∈V，满足 𝒜u = *λ*u，其中 *λ*
    ∈ℂ，我们用 *σ*(𝒜) 表示 𝒜 的特征值集合。'
- en: The following result, which is more general than the subsequent spectral theorem,
    allows us to decompose any arbitrary complex square matrix.
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 以下结果比后续的谱定理更一般，它允许我们分解任何任意的复方阵。
- en: '**Theorem 2** (Schur Decomposition)**.** *For any* A ∈ ℳ[n](ℂ) *there exits
    a* *unitary matrix *U ∈ 𝒰[n](ℂ) *and an upper triangular matrix *T *such that*
    A = UTU^(−1)*.*'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 2**（舒尔分解）**.** *对于任意* A ∈ ℳ[n](ℂ) *，存在一个* *酉矩阵* U ∈ 𝒰[n](ℂ) *和一个上三角矩阵*
    T *，使得* A = UTU^(−1)*。'
- en: Note that since U is unitary, then U^(−1) = U^†. We call the matrix T the Schur
    transform of A and the identity in the theorem means that A and T are similar,
    so in particular, possess the same eigenvalues, all located on the diagonal of T.
    If A is a normal matrix, then so is T, and therefore T must be diagonal and we
    write T = D for clarity. In this case, we say that the matrix A is diagonalisable
    with A = UDU^†, where the diagonal entries of D are the eigenvalues of A and the
    column vectors of U are the orthonormal eigenvectors of A.
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，由于 U 是酉矩阵，因此 U^(−1) = U^†。我们称矩阵 T 为 A 的舒尔变换，定理中的恒等式意味着 A 和 T 是相似的，特别地，它们具有相同的特征值，这些特征值都位于
    T 的对角线上。如果 A 是一个正常矩阵，则 T 也是正常矩阵，因此 T 必须是对角矩阵，且为清晰起见，我们写作 T = D。在这种情况下，我们称矩阵 A
    是可对角化的，且 A = UDU^†，其中 D 的对角元素是 A 的特征值，U 的列向量是 A 的标准正交特征向量。
- en: '**Theorem 3** (Spectral Theorem)**.** *The linear operator *𝒜 : V → V *is*
    *normal if and only if there exists an orthonormal basis of *V *consisting of*
    *eigenvectors of *A*.*'
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 3**（谱定理）**.** *线性算子* 𝒜 : V → V *是* *正常的当且仅当存在一个由* *A* 的特征向量组成的* *V* 的标准正交基*。'
- en: For each eigenvalue *λ* ∈ *σ*(𝒜), denote the corresponding eigenspace
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 对于每个特征值 *λ* ∈ *σ*(𝒜)，记对应的特征空间为
- en: '![𝒱λ := {u ∈ V : 𝒜u = λu} . ](img/file23.jpg)'
  id: totrans-90
  prefs: []
  type: TYPE_IMG
  zh: '![𝒱λ := {u ∈ V : 𝒜u = λu} . ](img/file23.jpg)'
- en: Since the vector space V is the orthogonal direct sum of the eigenspaces (indexed
    by the eigenvalues of 𝒜), we can then write the spectral decomposition
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 由于向量空间 V 是各个特征空间（按 𝒜 的特征值索引）的正交直和，因此我们可以写出谱分解
- en: '| ![ ∑ 𝒜 = λ𝒫 λ, λ∈σ(𝒜) ](img/file24.jpg) |  |'
  id: totrans-92
  prefs: []
  type: TYPE_TB
  zh: '| ![ ∑ 𝒜 = λ𝒫 λ, λ∈σ(𝒜) ](img/file24.jpg) |  |'
- en: where 𝒫[λ] is the orthogonal projection operator onto 𝒱[λ]. Note that such an
    operator is naturally self-adjoint  [[309](Biblography.xhtml#Xyosida1965functional), Theorem
    2, Section III-1].
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 𝒫[λ] 是对 𝒱[λ] 的正交投影算子。注意，这样的算子自然是自伴的  [[309](Biblography.xhtml#Xyosida1965functional), 定理
    2, 第III-1节]。
- en: 1.1.6 Hermitian matrices
  id: totrans-94
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.6 厄米矩阵
- en: We introduced above Hermitian matrices as the set of matrices A over the complex
    field ℂ such that A = A^†. As fundamental building blocks of quantum computing,
    we investigate their properties further. Clearly, a real matrix is Hermitian if
    and only if it is symmetric, in which case A^⊤ = A.
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 我们上面介绍了厄米矩阵作为复数域 ℂ 上的矩阵集合 A，满足 A = A^†。作为量子计算的基础构建块，我们进一步研究了它们的性质。显然，一个实矩阵当且仅当它是对称矩阵时才是厄米矩阵，这时
    A^⊤ = A。
- en: '**Proposition 1.** *The eigenvalues of a Hermitian matrix are real.*'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: '**命题 1。** *厄米矩阵的特征值是实数。*'
- en: '*Proof.* If Ax = *λ*x for *λ* ∈ℂ and x ∈ℂ^n, then'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: '*证明。* 如果 Ax = *λ*x 且 *λ* ∈ℂ 和 x ∈ℂ^n，那么'
- en: '| ⟨Ax*,*x⟩ | = x^†Ax = *λ*x^†x = *λ*∥x∥²*,* |'
  id: totrans-98
  prefs: []
  type: TYPE_TB
  zh: '| ⟨Ax*,*x⟩ | = x^†Ax = *λ*x^†x = *λ*∥x∥²*,* |'
- en: '| ⟨x*,*Ax⟩ | = (Ax)^†x = (*λ*x)^†x = *λ*^∗x^†x = *λ*^∗∥x∥²*.* |'
  id: totrans-99
  prefs: []
  type: TYPE_TB
  zh: '| ⟨x*,*Ax⟩ | = (Ax)^†x = (*λ*x)^†x = *λ*^∗x^†x = *λ*^∗∥x∥²*.* |'
- en: Since both are equal by the Hermitian property, then *λ* = *λ*^∗, proving the
    proposition. □
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 由于这两者通过厄米性质相等，因此 *λ* = *λ*^∗，从而证明了命题。 □
- en: 'The Singular Value Decomposition (Theorem [1](#x1-28002r1)) takes a particular
    flavour in the case of Hermitian matrices:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 奇异值分解（定理 [1](#x1-28002r1)）在厄米矩阵的情况下有其特定的形式：
- en: '**Theorem 4.** *With the notations of Theorem *[*1*](#x1-28002r1)*, if *A ∈
    ℳ[n](ℂ) *is* *Hermitian, then the matrices *U *and *V *are equal and the matrix *Σ
    *is* *diagonal with real entries.*'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 4。** *根据定理 *[*1*](#x1-28002r1)*的符号，如果 *A ∈ ℳ[n](ℂ) *是* *厄米矩阵，那么矩阵 *U *和 *V
    *是相等的，并且矩阵 *Σ *是* *实对角矩阵。*'
- en: '**Theorem 5.** *For a Hermitian matrix* A ∈ ℳ[n](ℂ)*, the following are* *equivalent:*'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 5。** *对于一个厄米矩阵* A ∈ ℳ[n](ℂ)*，以下条件是* *等价的：*'
- en: '*The eigenvalues are non-negative.*'
  id: totrans-104
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '*特征值是非负的。*'
- en: '*There exists a Hermitian matrix *B ∈ℳ[n](ℂ) *such that* A = B²*.*'
  id: totrans-105
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '*存在一个厄米矩阵 *B ∈ℳ[n](ℂ) *使得* A = B²*。*'
- en: '*There exists a matrix *B ∈ℳ[n](ℂ) *such that* A = B^†B*.*'
  id: totrans-106
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '*存在一个矩阵 *B ∈ℳ[n](ℂ) *使得* A = B^†B*。*'
- en: '*For every* x ∈ℂ^n*,* ⟨Ax*,*x⟩≥ 0*.*'
  id: totrans-107
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '*对于每个* x ∈ℂ^n*,* ⟨Ax*,*x⟩≥ 0*。*'
- en: '*Such a matrix is called positive semi-definite.*'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: '*这样的矩阵称为半正定矩阵。*'
- en: '*Proof.* The Spectral Theorem shows that there exist a unitary matrix U ∈𝒰[n](ℂ)
    and a diagonal matrix Σ ∈ℳ[n](ℂ) such that A = UΣU^†, where the diagonal elements
    of Σ are the eigenvalues of A. Assuming (i), we can define B = U![√ Σ-](img/file25.jpg)U^†∈ℳ[n](ℂ).
    Then clearly'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: '*证明。* 谱定理表明，存在一个酉矩阵 U ∈𝒰[n](ℂ) 和一个对角矩阵 Σ ∈ℳ[n](ℂ)，使得 A = UΣU^†，其中 Σ 的对角元素是
    A 的特征值。假设 (i)，我们可以定义 B = U![√ Σ-](img/file25.jpg)U^†∈ℳ[n](ℂ)。然后显然'
- en: '![ † 2 ( √ -- †)( √ -- †) B = B and B = U ΣU U ΣU = A, ](img/file26.jpg)'
  id: totrans-110
  prefs: []
  type: TYPE_IMG
  zh: '![ † 2 ( √ -- †)( √ -- †) B = B and B = U ΣU U ΣU = A, ](img/file26.jpg)'
- en: since U is unitary. The equality A = B^†B is also obvious. The latter implies
    that
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 因为 U 是酉矩阵。等式 A = B^†B 也是显然的。后者意味着
- en: '![ † 2 n ⟨Ax, x⟩ = ⟨B Bx,x⟩ = ⟨Bx,Bx ⟩ = ∥Bx ∥ ≥ 0, for any x ∈ ℂ . ](img/file27.jpg)'
  id: totrans-112
  prefs: []
  type: TYPE_IMG
  zh: '![ † 2 n ⟨Ax, x⟩ = ⟨B Bx,x⟩ = ⟨Bx,Bx ⟩ = ∥Bx ∥ ≥ 0, for any x ∈ ℂ . ](img/file27.jpg)'
- en: Finally, assume (iv) and let *λ* be an eigenvalue of A with eigenvector u. Then
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，假设 (iv)，并且让 *λ* 是 A 的一个特征值，特征向量为 u。那么
- en: '![ 2 ⟨Au, u⟩ = ⟨λu,u⟩ = λ⟨u,u⟩ = λ∥u∥ . ](img/file28.jpg)'
  id: totrans-114
  prefs: []
  type: TYPE_IMG
  zh: '![ 2 ⟨Au, u⟩ = ⟨λu,u⟩ = λ⟨u,u⟩ = λ∥u∥ . ](img/file28.jpg)'
- en: Since the latter is strictly positive, then clearly *λ* ≥ 0.
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 由于后者严格大于零，因此显然 *λ* ≥ 0。
- en: 'The following property lies at the core of Hamiltonian simulation of quantum
    systems:'
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 以下性质是量子系统哈密顿量模拟的核心：
- en: '**Theorem 6.** *If *A ∈ ℳ[n](ℂ) *is Hermitian, then, for any* *t* ∈ ℝ*,* e^(itA)
    *is unitary; conversely, every unitary matrix has the form* e^(itA) *for some*
    *Hermitian matrix *A*.*'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: '**定理 6。** *如果 *A ∈ ℳ[n](ℂ) *是厄米矩阵，那么，对于任何* *t* ∈ ℝ*，* e^(itA) *是酉矩阵；反之，每个酉矩阵都可以表示为*
    e^(itA) *，其中 *A* 是某个厄米矩阵。*'
- en: Recall that for a matrix A ∈ℳ[n](ℂ), its exponential is given by
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 回顾一下，对于一个矩阵 A ∈ℳ[n](ℂ)，它的指数是由以下公式给出的
- en: '![ A ∑ Ak- e = k! . k≥0 ](img/file29.jpg)'
  id: totrans-119
  prefs: []
  type: TYPE_IMG
  zh: '![ A ∑ Ak- e = k! . k≥0 ](img/file29.jpg)'
- en: In practice, though, given a Hermitian matrix A, finding the corresponding unitary
    matrix U is not easy. The Hamiltonian simulation problem is defined as follows.
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 然而在实践中，给定一个厄米矩阵 A，找到对应的酉矩阵 U 并不容易。哈密顿量模拟问题定义如下。
- en: '**Hamiltonian Problem:** Given a Hermitian matrix A ∈ℳ[n](ℂ), a time *t >*
    0, a tolerance level *𝜀 >* 0, and some matrix norm ∥⋅∥, find a unitary matrix U
    such that ![∥∥ itA ∥∥ U − e](img/file30.jpg)≤ *𝜀*.'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: '**哈密顿量问题：** 给定一个厄米矩阵 A ∈ℳ[n](ℂ)，一个时间 *t >* 0，一个容差水平 *𝜀 >* 0，以及某个矩阵范数 ∥⋅∥，找到一个酉矩阵 U，使得
    ![∥∥ itA ∥∥ U − e](img/file30.jpg)≤ *𝜀*。'
- en: 1.1.7 Rotation matrices
  id: totrans-122
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.7 旋转矩阵
- en: 'Rotation matrices, and later their quantum gate equivalents will play a key
    role in building quantum circuits. Let us start with the following lemma:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 旋转矩阵以及它们的量子门等效形式将在构建量子电路中发挥关键作用。我们从以下引理开始：
- en: '**Lemma 1.** *If a matrix* A ∈ℳ[n](ℂ) *is such that* A² = I*, then for any*
    *𝜃* ∈ℝ*,*'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '**引理 1.** *如果一个矩阵* A ∈ℳ[n](ℂ) *满足* A² = I*，那么对于任何* *𝜃* ∈ℝ*，*'
- en: '![ei𝜃A = cos(𝜃)I + isin(𝜃)A. ](img/file31.jpg)'
  id: totrans-125
  prefs: []
  type: TYPE_IMG
  zh: '![ei𝜃A = cos(𝜃)I + isin(𝜃)A. ](img/file31.jpg)'
- en: '*Proof.* This follows directly from the series expansion'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: '*证明。* 这直接来自于级数展开'
- en: '![ ∑ xk ex = --, k≥0 k! ](img/file32.jpg)'
  id: totrans-127
  prefs: []
  type: TYPE_IMG
  zh: '![ ∑ xk ex = --, k≥0 k! ](img/file32.jpg)'
- en: which has an infinite radius of convergence. □
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 该式具有无限的收敛半径。□
- en: 'Lemma [1](#x1-30002r1) will prove essential for computational purposes. As
    simple examples, consider the following:'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 引理 [1](#x1-30002r1) 对于计算目的将是至关重要的。作为简单的例子，考虑以下内容：
- en: '**Exercise:** Compute e^(i𝜃A) for A ∈{X*,*Y*,*Z} and *𝜃* ∈ℝ, where'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习：** 计算 A ∈{X*,*Y*,*Z} 和 *𝜃* ∈ℝ 时的 e^(i𝜃A)，其中'
- en: '![ ⌊ ⌋ ⌊ ⌋ ⌊ ⌋ X = ⌈0 1⌉ , Y = ⌈0 − i⌉, Z = ⌈1 0 ⌉. 1 0 i 0 0 − 1 ](img/file33.jpg)'
  id: totrans-131
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ ⌊ ⌋ ⌊ ⌋ X = ⌈0 1⌉ , Y = ⌈0 − i⌉, Z = ⌈1 0 ⌉. 1 0 i 0 0 − 1 ](img/file33.jpg)'
- en: 'For any *α* ∈ [0*,*2*π*), consider now the map ℛ[α] : ℝ² →ℝ² such that'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: '对于任意 *α* ∈ [0*,*2*π*)，现在考虑映射 ℛ[α] : ℝ² →ℝ²，使得'
- en: '![ ( ) ( ) ℛ α r cos(𝜃),rsin(𝜃) := r cos(𝜃 + α),rsin(𝜃 + α ) , ](img/file34.jpg)![for
    any r ∈ ℝ and 𝜃 ∈ [0,2π), ](img/file35.jpg)'
  id: totrans-133
  prefs: []
  type: TYPE_IMG
  zh: '![ ( ) ( ) ℛ α r cos(𝜃),rsin(𝜃) := r cos(𝜃 + α),rsin(𝜃 + α ) , ](img/file34.jpg)![对于任意
    r ∈ ℝ 和 𝜃 ∈ [0,2π), ](img/file35.jpg)'
- en: 'which is basically a rotation of angle *α* and does not affect the norm of
    the input vector. To the map ℛ[α], we can associate the (rotation) matrix R[α]
    such that ℛ[α](u) = R[α]u for any u ∈ℝ². It is easy (exercise) to show the following:'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 其本质上是角度 *α* 的旋转，并且不会影响输入向量的范数。对于映射 ℛ[α]，我们可以关联矩阵 R[α]，使得对于任何 u ∈ℝ²，ℛ[α](u) =
    R[α]u。很容易（练习）证明以下内容：
- en: '**Lemma 2.** *The matrix *R[α] *has the form*'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: '**引理 2.** *矩阵 *R[α] *具有以下形式*'
- en: '![ ⌊ ⌋ cos(α ) − sin(α) R α = ⌈ ⌉ . sin (α ) cos(α) ](img/file36.jpg)'
  id: totrans-136
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ cos(α ) − sin(α) R α = ⌈ ⌉ . sin (α ) cos(α) ](img/file36.jpg)'
- en: This representation is the general form of a rotation matrix in ℝ² (introduced
    in ([1.1.3](#x1-26004r3))).
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: 这个表示是 ℝ² 中旋转矩阵的一般形式（在([1.1.3](#x1-26004r3))中引入）。
- en: '**Exercise:** Write the matrices e^(i𝜃A) for A ∈{X*,*Y*,*Z} from the previous
    exercise as rotation matrices.'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习：** 写出前面练习中 A ∈{X*,*Y*,*Z} 的矩阵 e^(i𝜃A) 作为旋转矩阵。'
- en: 1.1.8 Polar coordinates
  id: totrans-139
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 1.1.8 极坐标
- en: Recall that a point *z* = *x* + i*y*, with *x,y* ∈ℝ, lying on the unit circle
    can be written as *z* = e^(i𝜃) with *𝜃* ∈ [0*,*2*π*). Indeed, simply let *x* =
    *r* cos(*𝜃*), *y* = *r* sin(*𝜃*) and add the constraint *r* = 1\. Consider now
    a general vector u ∈ℂ² of the form
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，一个点 *z* = *x* + i*y*，其中 *x,y* ∈ℝ，位于单位圆上，可以写作 *z* = e^(i𝜃)，其中 *𝜃* ∈ [0*,*2*π*)。事实上，只需让
    *x* = *r* cos(*𝜃*)，*y* = *r* sin(*𝜃*) 并加上约束 *r* = 1。现在考虑一个形式为的通用向量 u ∈ℂ²
- en: '![u = αe1 + βe2, ](img/file37.jpg)'
  id: totrans-141
  prefs: []
  type: TYPE_IMG
  zh: '![u = αe1 + βe2, ](img/file37.jpg)'
- en: 'with *α,β* ∈ℂ such that |*α*|² + |*β*|² = 1\. Here, (e[1]*,*e[2]) forms a basis
    of ℝ²:'
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 其中，*α,β* ∈ℂ，满足 |*α*|² + |*β*|² = 1。这里，(e[1]*,*e[2]) 构成了 ℝ² 的一个基：
- en: '![ ⌊ ⌋ ⌊ ⌋ 1 0 e1 := ⌈ ⌉, e2 := ⌈ ⌉ . 0 1 ](img/file38.jpg)'
  id: totrans-143
  prefs: []
  type: TYPE_IMG
  zh: '![ ⌊ ⌋ ⌊ ⌋ 1 0 e1 := ⌈ ⌉, e2 := ⌈ ⌉ . 0 1 ](img/file38.jpg)'
- en: In polar coordinates, we can then write
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 在极坐标系中，我们可以写为
- en: '![ i𝜃α i𝜃β u = rαe e1 + rβe e2\. ](img/file39.jpg)'
  id: totrans-145
  prefs: []
  type: TYPE_IMG
  zh: '![ i𝜃α i𝜃β u = rαe e1 + rβe e2\. ](img/file39.jpg)'
- en: Note that arbitrary multiplication phases have no influence – a fact of key
    importance in quantum mechanics – because, for any *γ* ∈ℝ,
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 请注意，任意的乘法相位没有影响——这是量子力学中的一个关键事实——因为，对于任何 *γ* ∈ℝ，
- en: '![|eiγα|2 = (eiγα)∗eiγα = α ∗e−iγeiγα = α∗α = |α|2, ](img/file40.jpg)'
  id: totrans-147
  prefs: []
  type: TYPE_IMG
  zh: '![|eiγα|2 = (eiγα)∗eiγα = α ∗e−iγeiγα = α∗α = |α|2, ](img/file40.jpg)'
- en: so that in fact, multiplying u by the global phase e^(−i𝜃[α]) and letting *𝜃*
    := *𝜃*[β] −*𝜃*[α], we consider
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，实际上，乘以全局相位 e^(−i𝜃[α]) 并令 *𝜃* := *𝜃*[β] −*𝜃*[α]，我们考虑
- en: '![ i𝜃 u = rαe1 + rβe e2\. ](img/file41.jpg)'
  id: totrans-149
  prefs: []
  type: TYPE_IMG
  zh: '![ i𝜃 u = rαe1 + rβe e2\. ](img/file41.jpg)'
- en: Write temporarily *r*[β]e^(i𝜃) = *x* + i*y*. Insisting on u being on the unit
    sphere further imposes ∥u∥² = 1, namely
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: 写下暂时的 *r*[β]e^(i𝜃) = *x* + i*y*。坚持让 u 在单位球面上，进一步要求 ∥u∥² = 1，即
- en: '| 1 | = ∥u∥² = ![(](img/file42.jpg)*r*[α]e[1] + (*x* + i*y*)e[2]![)](img/file43.jpg)^†![(](img/file44.jpg)*r*[α]e[1]
    + (*x* + i*y*)e[2]![)](img/file45.jpg) |'
  id: totrans-151
  prefs: []
  type: TYPE_TB
  zh: '| 1 | = ∥u∥² = ![(](img/file42.jpg)*r*[α]e[1] + (*x* + i*y*)e[2]![)](img/file43.jpg)^†![(](img/file44.jpg)*r*[α]e[1]
    + (*x* + i*y*)e[2]![)](img/file45.jpg) |'
- en: '|  | = ![(](img/file46.jpg)*r*[α]e[1]^⊤ + (*x* − i*y*)e [2]^⊤![)](img/file47.jpg)![(](img/file48.jpg)*r*[α]e[1]
    + (*x* + i*y*)e[2]![)](img/file49.jpg) |'
