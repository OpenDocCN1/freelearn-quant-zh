- en: '**Example:** An example of a mixed state is a *statistical ensemble* of states
    ![|0⟩](img/file247.jpg) and ![|1⟩](img/file248.jpg). If a physical system is prepared
    to be either in state ![|0⟩](img/file249.jpg) or state ![|1⟩](img/file250.jpg)
    with equal probability, it can be described by the mixed state'
  id: totrans-351
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例：** 一个混合态的示例是*统计集*，由状态![|0⟩](img/file247.jpg)和![|1⟩](img/file248.jpg)组成。如果一个物理系统以相等的概率处于状态![|0⟩](img/file249.jpg)或状态![|1⟩](img/file250.jpg)，则它可以用混合态来描述。'
- en: '| ![ ⌊ ⌋ 1- 1- 1-⌈1 0⌉ ρ = 2 &#124;0⟩⟨0&#124;+ 2 &#124;1⟩⟨1&#124; = 2 0 1 .
    ](img/file251.jpg) |  |'
