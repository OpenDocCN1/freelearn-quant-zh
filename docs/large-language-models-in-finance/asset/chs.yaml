  \ = FinancialSentimentTrainer()\n    trainer.train()\n```\n\n**本清单故意违反了下一页的协议。**\
  \ 本章后面所述的可重复性协议要求使用走向前验证或严格的时间顺序分割。上述清单未使用此类分割。理由有必要直截了当地说明，而不是回避，因为这是应用金融NLP中最常见的陷阱，如果本书绕过去，就会不诚实。\n\
  \nFinancial PhraseBank 不携带时间戳 [Malo et al., 2014]。其中没有文档日期、出版时间，也没有任何句子的可用性戳记。因此，对该数据集来说，按时间顺序分割不仅不方便，而且是\
  \ _不可能_ 的。随机分割是数据所迫，这正是本书在第13章批评的评估缺陷，也正是在第1章FinEAS讨论中点名批评的缺陷。\n\n会得出两个结论，只有第二个是可选的。首先：此管道产生的数字只是训练循环的冒烟测试。它不是模型能够工作的证据，绝不能以此作为证据来报告。从无时间戳基准获得的任何准确率或F1得分，都继承了基准无法回答已部署系统面临的唯一问题的能力——这对模型\
  \ _之前_ 未见过的数据是否有效？\n\n其次：如果任务确实重要，应该替换基准，而不是修复分割。请使用带有时间戳的语料库，在 `temporal.py` 中应用按时间顺序的分割，并接受诚实所付出的较低头条得分。\n\
  \n保留此清单的形式，是因为一本只展示整洁示例的书籍，无法告诉读者他们实际会遇到的情况——即一个不支持其所需评估的数据集。\n\nFinEAS式组件也可直接用作句子级金融情感评分器或嵌入模块。精确的标签映射应始终从模型配置中读取，并与机构自身的标签分类法进行验证。\n\
  \n## 清单15.2：FinEAS式情感评分封装器\n\n```python\nfrom transformers import AutoTokenizer,\
  \ AutoModelForSequenceClassification\nimport torch\n\nclass FineasSentimentScorer:\n\
  \    \"\"\"Illustrative FinEAS-style sentiment scoring wrapper.\"\"\"\n\n    def\
  \ __init__(self, model_name=\"LHF/FinEAS\"):\n        self.tokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  \        self.model = AutoModelForSequenceClassification.from_pretrained(model_name)\n\
  \        self.labels = self.model.config.id2label\n        self.model.eval()\n```\n\
  \n```python\n@torch.no_grad()\ndef score(self, texts, max_length=128):\n    inputs\
  \ = self.tokenizer(\n        texts,\n        padding=True,\n        truncation=True,\n\
  \        max_length=max_length,\n        return_tensors=\"pt\",\n    )\n    outputs\
  \ = self.model(**inputs)\n\n    # FinEAS is a REGRESSION head: config.num_labels\
  \ == 1. Applying\n    # softmax over a single logit returns 1.0 for every input,\
  \ which is\n    # the silent failure this method previously shipped. Return the\n\
  \    # scalar sentiment score and say what it means.\n    n_out = self.model.config.num_labels\n\
  \    if n_out == 1:\n        scores = outputs.logits.squeeze(-1)      # shape: (batch,)\n\
  \        return [\n            # NO range assumed. The published FinEAS objective\
  \ uses a tanh\n            # head, but the deployed checkpoint exposes a generic\
  \ one-label\n            # regression head, and its model card documents a different\n\
  \            # scale. Pin the revision and calibrate against documented\n      \
  \      # examples; do not assert a range the config does not establish.\n      \
  \      {\"sentiment_raw\": float(v)}          # by the tanh head\n            for\
  \ v in scores\n        ]\n\n    # A genuine classifier head (e.g. FinBERT, 3 classes)\
  \ does take softmax.\n    probabilities = torch.softmax(outputs.logits, dim=-1)\n\
  \    return [\n        {self.labels[i]: float(row[i]) for i in range(len(row))}\n\
  \        for row in probabilities\n    ]\n\nif __name__ == \"__main__\":\n    scorer\
  \ = FineasSentimentScorer()\n    examples = [\n        \"The company raised its\
  \ full-year guidance after strong earnings.\",\n        \"Credit losses increased\
  \ sharply as funding conditions tightened.\",\n    ]\n    print(scorer.score(examples))\n\
  ```\n\n在生产环境中，FinEAS式输出应被视为可审计的模型信号：存储输入文本、模型版本、标签映射、得分分布、校准样本、源元数据、时间戳以及使用该信号的下游决策。\n\
  \n### 15.4.2 模型监控与重新训练\n\n微调只是第一步。一旦金融模型部署，就必须监控其性能，因为市场条件、术语、文档格式、用户行为和数据分布都会随时间变化。\n\
  \n生产模型需要持续监控数据漂移、概念漂移、性能劣化、延迟、运营故障以及业务或监管环境的变化。有用的监控维度包括：\n\n- **验证性能**：在新的验证样本上跟踪准确率、宏F1、类别特定的精确率和召回率、校准误差以及混淆矩阵。\n\
  - **预测置信度漂移**：监控预测概率、熵、边际和弃权率分布的变化。\n- **输入分布漂移**：跟踪词元分布、嵌入分布、文档长度、语言混合、实体频率和金融术语的变化。\n\
  - **运营指标**：监控延迟、吞吐量、错误率、超时率、失败的API调用以及内存或GPU利用率。\n- **分段性能**：按文档类型、市场体制、地理、资产类别、交易对手类型、业务线和数据供应商评估性能。\n\
  - **人工评审指标**：跟踪覆盖率、升级率、评审人分歧和重复错误类别。\n\n对于FinEAS式情感和句子嵌入模型，额外的监控也很有用：\n\n- **嵌入漂移**：监控当前句子嵌入与验证期间参考分布之间的距离。\n\
  - **情感得分稳定性**：按来源和体制跟踪正面、中性和负面得分的均值、方差和尾部行为。\n- **实体级一致性**：检查当周围文本可比时，对同一发行人、行业或事件类型的重复引用是否获得稳定的情感标签。\n\
  - **市场体制分解**：分别在平静、紧张、高波动和危机期间报告性能。\n\n重新训练策略应与这些指标挂钩，而不仅仅与日历时间挂钩：\n\n- **定期重新训练**：当任务稳定且数据定期到达时，每月或每季度刷新一次。\n\
  - **触发式重新训练**：当F1、校准、延迟、漂移统计、嵌入漂移或人工评审分歧超过预定义阈值时进行重新训练。\n- **增量学习**：使用新标记的示例进行受控更新，并配备验证、审批、回滚控制和审计跟踪。\n\
  \n在受监管的金融环境中，重新训练还应通过版本化数据集、模型卡、验证报告、审批记录和部署后监控日志进行文档记录。\n\n\n\n\n## 15.5 财务数据资源\n\
  \n金融 LLM 开发依赖可靠的数据集进行训练、评估、检索和基准测试。本节总结了公共金融 NLP 数据集、市场数据来源以及市场数据和 SEC 文件的简单访问模式。\n\
  \n### 15.5.1 公共金融数据集\n\n应与所选标注者一致性划分一起报告财务短语库 [Malo et al., 2014, Hugging Face,\
  \ 2026]。FiQA 是指一系列金融舆论挖掘和问答基准，因此应始终说明确切的版本和划分 [Maia et al., 2018]。FinEAS 是一个面向金融情感和句子嵌入式的模型和代码资源，而非原始基准数据集\
  \ [Gutiérrez-Fandiño et al., 2021]。\n\n### 15.5.2 市场数据来源\n\n市场数据来源在覆盖范围、延迟、许可、幸存者偏差控制、企业行为处理、历史回填质量和商业使用限制等方面存在差异。开放或非官方工具适用于教学、实验和原型开发，但受监管的生产系统通常需要持牌机构馈送、服务级别协议、数据质量控制和法律审查。\n\
  \nSEC EDGAR 是一个文件访问系统，而非单一的精选 NLP 数据集 [U.S. Securities and Exchange Commission,\
  \ 2026]；yfinance 等工具便于原型开发，但在未检查许可、可靠性和数据质量之前，不应将其视为机构馈送 [Aroussi, 2026]。\n\n- **通过\
  \ yfinance 使用 Yahoo Finance:** 便捷地访问历史 OHLCV 数据以供研究和原型开发。在未检查许可、可靠性、数据质量和 Yahoo\
  \ 使用条款之前，不应将其视为机构生产馈送。\n- **Alpha Vantage:** 基于 API 密钥的服务提供时间序列和基本面数据。\n- **Quandl/Nasdaq\
  \ Data Link:** 宏观、金融和替代数据集，特定于数据集的许可。\n- **IEX Cloud 或类似提供商:** 受提供商条款和交易所数据规则约束的实时和历史市场数据服务。\n\
  - **SEC EDGAR:** 公共监管文件访问。它是一个文件存储库，而非现成的 NLP 数据集，并在建模前需要解析、清洗、元数据提取和任务特定标注。\n\n\
  | 资源 | 典型规模 | 主要任务 | 描述 |\n| :--- | :--- | :--- | :--- |\n| Financial PhraseBank\
  \ | 4,840 个句子 | 情感分析 | 由具备金融意识的标注者标注的金融新闻句子情感数据集。应使用明确的一致性划分，例如 `sentences_75agree`、`sentences_66agree`\
  \ 或 `sentences_50agree`，因为可用示例的数量取决于所选的标注者一致性阈值。 |\n| FiQA | 取决于版本 | 金融舆论挖掘和问答 |\
  \ 与金融舆论挖掘和问答相关的基准系列。FiQA-SA 情感变体通常报告约 1,173 个带标注的金融标题或帖子，而 QA 和 RAG 重构使用不同的划分和规模。始终报告确切的基准版本和划分。\
  \ |\n| FinEAS 模型/代码 | 模型/资源 | 金融情感嵌入式和情感分析 | FinEAS 为金融情感提供受监督的句子嵌入式方法。它可作为专用编码器或评分模块很有用，但在机构使用前，必须验证其标签映射、训练分布、时间覆盖范围和生产适用性。\
  \ |\n| SEC EDGAR | 数百万份文件 | 文档检索、提取和文件分析 | SEC EDGAR 是一个公共文件数据库，而非单一的精选 NLP 数据集。LLM\
  \ 工作流通常需要在建模前进行文件选择、解析、清洗、元数据提取、分段和任务特定标注。 |\n| 财报电话会议 | 取决于供应商或来源 | 转录分析、情感、预测和事件分析\
  \ | 季度财报电话会议转录可支持管理层语气分析、问答分析、指导提取和市场反应研究。覆盖范围和许可取决于提供商。 |\n\n以下示例展示了检索市场价格和 SEC\
  \ 文件的简单访问模式。它们旨在用于实验，并在用于生产流水线之前应进行调整。\n\n第一个示例下载一小组股票代码的历史价格数据，并返回一个数据框架字典。\n\n\
  ```python\nimport yfinance as yf\nimport pandas as pd\n\ndef get_market_data(tickers,\
  \ period=\"1y\", interval=\"1d\"):\n    \"\"\"\n    Download historical OHLCV data\
  \ with error handling\n    \"\"\"\n    data = {}\n    for ticker in tickers:\n \
  \       try:\n            df = yf.download(ticker, period=period, interval=interval,\n\
  \                             auto_adjust=True, progress=False)\n            data[ticker]\
  \ = df\n        except Exception as e:\n            print(f\"Error fetching {ticker}:\
  \ {e}\")\n            data[ticker] = pd.DataFrame()\n    return data\n\n# Example\
  \ usage\nif __name__ == \"__main__\":\n    portfolio = [\"AAPL\", \"MSFT\", \"JPM\"\
  , \"GS\"]\n    market_data = get_market_data(portfolio, period=\"5y\")\n```\n\n\
  第二个示例检索股票代码的最新 SEC 文件，并展示简化的文本提取步骤。\n\n```python\nimport sec_edgar_downloader\n\
  from pathlib import Path\n\nclass SECFilingRetriever:\n    \"\"\"\n    Retrieve\
  \ and process SEC filings\n    \"\"\"\n\n    def __init__(self, company_name, email_address,\n\
  \                 output_dir=\"./sec_filings\"):\n        self.output_dir = Path(output_dir)\n\
  \        self.output_dir.mkdir(exist_ok=True)\n        # sec_edgar_downloader requires\
  \ an identity: SEC's fair-access policy\n        # requires a declared company name\
  \ and contact e-mail in the User-Agent.\n        # Downloader(output_dir) alone\
  \ does not match the current interface.\n        self.downloader = sec_edgar_downloader.Downloader(\n\
  \            company_name,          # e.g. \"Example Research Ltd\"\n          \
  \  email_address,         # e.g. \"research@example.com\"\n            str(self.output_dir),\n\
  \        )\n\n    def get_filings(self, ticker, form_type=\"10-K\", limit=5):\n\
  \        \"\"\"Download filings and return a typed record per filing.\n\n      \
  \  The previous version returned a DIRECTORY, which the caller then passed\n   \
  \     to extract_text(), which called open() on it -- IsADirectoryError. A\n   \
  \     filing is a package (primary document, exhibits, metadata), so the\n     \
  \   primary document must be selected explicitly, not assumed.\n        \"\"\"\n\
  \        self.downloader.get(form_type, ticker, limit=limit)\n        base = (self.output_dir\
  \ / \"sec-edgar-filings\" / ticker / form_type)\n        records = []\n        for\
  \ acc_dir in sorted(base.iterdir()):\n            primary = acc_dir / \"full-submission.txt\"\
  \n            if not primary.exists():\n                continue\n\n           \
  \ records.append({\n                \"ticker\": ticker,\n                \"form\"\
  : form_type,\n                \"accession\": acc_dir.name,\n                \"primary_document\"\
  : primary,\n                # Availability time, NOT the period the filing covers.\n\
  \                \"available_at\": datetime.fromtimestamp(\n                   \
  \ primary.stat().st_mtime).isoformat(),\n            })\n\n        return records\n\
  \n    def extract_text(self, record):\n        \"\"\"Extract text from a filing\
  \ RECORD (not a directory).\"\"\"\n        filing_path = record[\"primary_document\"\
  ]\n        # Production systems would use proper XBRL parsing\n        with open(filing_path,\
  \ 'r', encoding='utf-8', errors='ignore') as f:\n            return f.read()\n\n\
  # Example usage\nretriever = SECFilingsRetriever()\nfiling_dir = retriever.get_filings(\"\
  AAPL\", \"10-K\", limit=3)\n```\n\n## 15.6 框架配置、RAG 和评估实用工具\n\n本节提供可支持金融 LLM 开发的实用配置和实用工具示例。示例涵盖模型配置、检索增强生成\
  \ (RAG) 和评估指标，但应根据机构的基础设施、数据治理和安全要求进行调整。\n\n### 15.6.1 金融 LLM 示例配置\n\n以下 YAML 示例展示了金融\
  \ LLM 配置如何将模型、训练、数据、评估、部署和监控设置组织在一处。\n\n清单 15.3：金融 LLM 工作流程的示例配置\n\n```yaml\n# config/financial_llm_config.yaml\n\
  model:\n  architecture: \"transformer\"\n  hidden_size: 768\n  num_layers: 12\n\
  \  num_heads: 12\n  dropout: 0.1\n  layer_norm_eps: 1e-5\n  max_position_embeddings:\
  \ 512\n  vocab_size: 30522\n  financial_specializations:\n    finbert_checkpoint:\
  \ \"ProsusAI/finbert\"\n    fineas_checkpoint: \"LHF/FinEAS\"\n    fineas_use_case:\
  \ \"sentence-level financial sentiment and embedding geometry\"\n\ntraining:\n \
  \ batch_size: 32\n  learning_rate: 2e-5\n  weight_decay: 0.01\n  num_epochs: 3\n\
  \  warmup_ratio: 0.1\n  gradient_accumulation_steps: 1\n  fp16: true\n\ndata:\n\
  \  max_sequence_length: 512\n  train_test_split: 0.9\n  validation_split: 0.1\n\
  \  preprocessing:\n    lowercase: false # Preserve case for financial entities\n\
  \    remove_html: true\n    normalize_numbers: true\n\nevaluation:\n```\n\n\n\n\n\
  ```\nmetrics:\n- accuracy\n- f1_macro\n- precision\n- recall\nsave_best_metric:\
  \ \"f1_macro\"\n\ndeployment:\nframework: \"triton\"\nmax_batch_size: 64\ntimeout_ms:\
  \ 100\nquantization: \"int8\" # For latency optimization\n\nmonitoring:\nmetrics:\n\
  - latency_p99\n- throughput\n- prediction_confidence\n- drift_score\nalert_thresholds:\n\
  latency_p99_ms: 100\ndrift_score: 0.15\n```\n\n### 15.6.2 RAG 系统实现\n\n以下示例说明了简单金融\
  \ RAG 流水线的主要组件：嵌入生成、文档分块、元数据存储、检索和可选的重排序。\n\n代码清单 15.4: 说明性金融 RAG 流水线\n\n```python\n\
  from typing import List, Dict, Any, Optional\nimport chromadb\nfrom sentence_transformers\
  \ import SentenceTransformer\nimport numpy as np\nfrom datetime import datetime\n\
  \nclass IllustrativeFinancialRAG:\n    \"\"\"Illustrative, NOT production-ready.\
  \ It has no persistence,\n    authn/authz, secrets handling, retries, idempotency,\
  \ audit logging,\n    monitoring, retention, or versioned collections. It demonstrates\
  \ the\n    point-in-time retrieval contract and nothing else.\"\"\"\n\n    \"\"\"\
  \n    Production-ready RAG system for financial documents\n    \"\"\"\n\n    def\
  \ __init__(self, collection_name=\"financial_docs\"):\n        self.embedding_model\
  \ = SentenceTransformer(\n            \"sentence-transformers/all-mpnet-base-v2\"\
  \n        )\n        self.chunk_size = 512\n        self.chunk_overlap = 50\n  \
  \      self.top_k = 5\n\n        # Initialize vector store\n        self.client\
  \ = chromadb.Client()\n        self.collection = self.client.create_collection(\n\
  \            name=collection_name,\n            metadata={\"hnsw:space\": \"cosine\"\
  }\n        )\n\n    @staticmethod\n    def _require_available_at(doc: dict) -> str:\n\
  \        \"\"\"Return the document's availability timestamp, or refuse.\n\n    \
  \    There is no safe default. A document with no availability time\n        cannot\
  \ be placed in a point-in-time index, because its admissibility\n        for any\
  \ decision date is unknown. Quarantine it and let a human\n        supply the stamp.\n\
  \        \"\"\"\n        stamp = doc.get(\"available_at\") or doc.get(\"date\")\n\
  \        if not stamp:\n            raise ValueError(\n                f\"document\
  \ {doc.get('id', '<unknown>')} has no availability \"\n                \"timestamp;\
  \ refusing to index it. Route to quarantine and \"\n                \"resolve the\
  \ provenance before admitting it.\"\n            )\n\n        return stamp\n\n \
  \   def add_documents(self, documents: List[Dict[str, Any]]):\n        \"\"\"Add\
  \ documents with metadata to the collection\"\"\"\n        for doc in documents:\n\
  \            chunks = self._chunk_text(doc['text'])\n            embeddings = self.embedding_model.encode(chunks)\n\
  \n            for i, (chunk, embedding) in enumerate(zip(chunks, embeddings)):\n\
  \                self.collection.add(\n                    documents=[chunk],\n\
  \                    embeddings=[embedding.tolist()],\n                    # A point-in-time\
  \ system must NEVER manufacture an\n                    # availability time. datetime.now()\
  \ as a fallback would\n                    # stamp a historical document with today's\
  \ date -- the\n                    # exact timestamp fiction Chapter 13 catalogues.\
  \ Fail\n                    # closed instead: quarantine the document.\n       \
  \             metadatas=[{\n                        'source': doc.get('source',\
  \ 'unknown'),\n                        'date': self._require_available_at(doc),\n\
  \                        'doc_type': doc.get('type', 'general'),\n             \
  \           'chunk_id': i\n                    }],\n                    ids=[f\"\
  {doc.get('id', 'doc')}_{i}\"]\n                )\n\n    def retrieve(self, query:\
  \ str, decision_time: str,\n                 filters: Optional[Dict] = None) ->\
  \ List[Dict]:\n        \"\"\"Retrieve documents admissible at `decision_time`.\n\
  \n        decision_time is REQUIRED, not optional. The previous version stored\n\
  \        an availability stamp on every document and then never filtered on it,\n\
  \        which is the most expensive kind of near-miss: the provenance is\n    \
  \    recorded, the control is absent, and the retrieval silently returns\n     \
  \   documents that did not exist when the decision was made. A store that\n    \
  \    knows the availability time and does not enforce it is not a\n        point-in-time\
  \ store; it is an ordinary store with a comment.\n        \"\"\"\n        if not\
  \ decision_time:\n            raise ValueError(\n                \"decision_time\
  \ is required: retrieval without it cannot be \"\n                \"point-in-time\
  \ admissible\")\n\n        query_embedding = self.embedding_model.encode(query)\n\
  \n        # Enforce admissibility IN the query, not after it: filtering after\n\
  \        # top-k has already discarded the admissible documents that ranked\n  \
  \      # below inadmissible ones.\n        where = {\"available_at\": {\"$lte\"\
  : decision_time}}\n        if filters:\n            where = {\"$and\": [where, filters]}\n\
  \n        results = self.collection.query(\n            query_embeddings=[query_embedding.tolist()],\n\
  \            n_results=self.top_k,\n            where=where,\n        )\n\n    \
  \    # Defence in depth: assert the store honoured the filter.\n        for md in\
  \ results.get(\"metadatas\", [[]])[0]:\n            if md[\"available_at\"] > decision_time:\n\
  \                raise AssertionError(\n                    f\"look-ahead: {md['available_at']}\
  \ > {decision_time}\")\n\n        return results\n\n    def _chunk_text(self, text:\
  \ str) -> List[str]:\n        \"\"\"Chunk text with overlap\"\"\"\n        words\
  \ = text.split()\n        chunks = []\n        for i in range(0, len(words), self.chunk_size\
  \ - self.chunk_overlap):\n            chunk = ' '.join(words[i:i + self.chunk_size])\n\
  \            chunks.append(chunk)\n        return chunks\n\n# NOTE: a _rerank_by_recency()\
  \ that returned its input unchanged was\n# removed. A no-op named after a policy\
  \ is worse than no policy: the\n# caller believes recency is being handled. If recency\
  \ ranking is wanted,\n# implement and test it; until then, do not advertise it.\n\
  ```\n\n### 15.6.3 金融应用的评估指标\n\n以下实用类说明了几种可能与金融 LLM 应用相关的评估指标，包括方向准确率、风险调整后的表现以及实体提取质量。\n\
  \n### 代码清单 15.5: 金融 LLM 应用的评估工具\n\n```python\nimport numpy as np\nfrom sklearn.metrics\
  \ import classification_report, confusion_matrix\nfrom typing import List, Tuple,\
  \ Dict\n\nclass FinancialModelEvaluator:\n    \"\"\"\n    Specialized evaluation\
  \ metrics for financial LLM applications\n    \"\"\"\n\n    @staticmethod\n    def\
  \ directional_accuracy(predictions: List[int],\n                             actuals:\
  \ List[int]) -> float:\n        \"\"\"\n        Calculate accuracy of directional\
  \ predictions\n        (bullish/bearish/neutral)\n        \"\"\"\n        correct\
  \ = sum(p == a for p, a in zip(predictions, actuals))\n        return correct /\
  \ len(predictions) if predictions else 0.0\n\n    @staticmethod\n    def risk_adjusted_metrics(returns:\
  \ np.ndarray,\n                              benchmark: np.ndarray = None,\n   \
  \                           risk_free_rate: float = 0.02) -> Dict[str, float]:\n\
  \        \"\"\"\n        Calculate comprehensive risk-adjusted performance metrics\n\
  \        \"\"\"\n        # Annualized returns (assuming daily data)\n        annual_return\
  \ = returns.mean() * 252\n        annual_vol = returns.std() * np.sqrt(252)\n\n\
  \        # Sharpe Ratio\n        sharpe = (annual_return - risk_free_rate) / annual_vol\
  \ if annual_vol > 0 else 0\n\n        # Maximum Drawdown. NOTE: 'returns' is typed\
  \ np.ndarray, and\n        # .expanding() is a pandas method -- calling it here\
  \ raised\n        # AttributeError. Use the NumPy running maximum.\n        cumulative\
  \ = np.cumprod(1.0 + returns)\n        running_max = np.maximum.accumulate(cumulative)\n\
  \        drawdown = (cumulative - running_max) / running_max\n        max_drawdown\
  \ = float(drawdown.min())\n\n        # Information Ratio (if benchmark provided)\n\
  \        info_ratio = None\n        if benchmark is not None:\n            excess_returns\
  \ = returns - benchmark\n            tracking_error = excess_returns.std() * np.sqrt(252)\n\
  \            info_ratio = (excess_returns.mean() * 252) / tracking_error if tracking_error\
  \ > 0 else 0\n        return {\n            'annual_return': annual_return,\n  \
  \          'annual_volatility': annual_vol,\n            'sharpe_ratio': sharpe,\n\
  \            'max_drawdown': max_drawdown,\n            'information_ratio': info_ratio\n\
  \        }\n\n    @staticmethod\n    def entity_extraction_metrics(predicted_entities:\
  \ List[Dict],\n        true_entities: List[Dict]) -> Dict[str, float]:\n       \
  \ \"\"\"\n        Evaluate named entity recognition for financial entities\n   \
  \     \"\"\"\n        # Entity-level micro precision / recall / F1 over exact\n\
  \        # (type, start, end) spans. Partial overlaps do not count: a\n        #\
  \ monetary value extracted with the wrong boundary is the wrong\n        # number,\
  \ and a book about numerical integrity should score it that way.\n        if len(predicted_entities)\
  \ != len(true_entities):\n            raise ValueError(\n                \"predicted_entities\
  \ and true_entities must align \"\n                f\"({len(predicted_entities)})\
  \ vs {len(true_entities)})\")\n        tp = fp = fn = 0\n        for pred, gold\
  \ in zip(predicted_entities, true_entities):\n            p = {(e[\"type\"], e[\"\
  start\"], e[\"end\"]) for e in pred}\n            g = {(e[\"type\"], e[\"start\"\
  ], e[\"end\"]) for e in gold}\n            tp += len(p & g)\n            fp += len(p\
  \ - g)\n            fn += len(g - p)\n```\n\n\n\n\n\n```\nprecision = tp / (tp +\
  \ fp) if tp + fp else 0.0\nrecall = tp / (tp + fn) if tp + fn else 0.0\nf1 = 2 *\
  \ precision * recall / (precision + recall) if precision + recall else 0.0\nreturn\
  \ {\"precision\": precision, \"recall\": recall, \"f1\": f1,\n       \"tp\": tp,\
  \ \"fp\": fp, \"fn\": fn}\n```\n\n## 15.7 库生态系统\n\n金融 LLM 工作流通常结合通用机器学习库、检索工具、市场数据包、回测框架和部署基础设施。此处列出的工具仅为示例，而非固定推荐，其适用性取决于许可、维护状态、集成要求和机构审批。\n\
  \n### 15.7.1 金融 LLM 开发的核心库\n\n表 15.7.1 汇总了用于原型设计和构建金融 LLM 工作流的常见 Python 库。\n\n|\
  \ 库 | 类别 | 金融领域的关键特性 |\n|---|---|---|\n| transformers | 模型框架 | 预训练模型和检查点，包括 FinBERT\
  \ 风格的分类器和 FinEAS 风格的情感组件 |\n| langchain | LLM 应用 | 用于多步金融分析和工具集成的代理框架 |\n| sentence-transformers\
  \ | 嵌入 | 文档相似度、语义搜索和 FinEAS 风格的句子嵌入工作流 |\n| chromadb | 向量数据库 | 用于 RAG 系统的高效检索，元数据过滤\
  \ |\n| yfinance | 市场数据 | 用于历史价格数据和企业行为的研究/原型访问；生产环境使用需要许可和质量检查 |\n| pandas-ta |\
  \ 技术分析 | 用于量化策略的 130 多个指标 |\n| quantlib | 衍生品 | 期权定价模型、收益率曲线、风险指标 |\n| backtrader\
  \ | 回测 | 带有真实市场条件的策略测试 |\n| sec-edgar | 监管数据 | 直接访问 SEC 文件和 XBRL 数据 |\n| newsapi\
  \ | 新闻数据 | 用于情感分析的实时新闻 |\n\n表 15.3: 金融 LLM 工作流的 Python 库示例\n\n在生产环境中，这些开发库通常与服务、编排、监控、存储、消息传递和\
  \ API 管理工具结合使用。\n\n### 15.7.2 生产部署栈\n\n以下栈组件是常见基础设施类别的示例。实际选择应遵循机构的安全、合规、延迟、可靠性和运营要求。\n\
  \n- **模型服务:** Triton 推理服务器, TorchServe, TensorFlow Serving\n- **编排:** Kubernetes,\
  \ Airflow, Prefect\n- **监控:** Prometheus, Grafana, MLflow\n- **数据存储:** PostgreSQL,\
  \ MongoDB, S3 兼容对象存储\n- **消息队列:** Kafka, RabbitMQ, Redis\n- **API 网关:** Kong, Traefik,\
  \ AWS API 网关\n\n## 15.8 经验金融 LLM 研究的可重复性协议\n\n金融 LLM 研究应在数据来源、时间划分、模型版本、提示词版本、检索语料版本和评估脚本层面具有可重复性。以下协议是本书经验示例所假设的最低标准。\n\
  \n- 1. **数据卡。** 说明数据来源、许可、时间戳、幸存者偏差政策、文档宇宙、预处理规则以及任何排除标准。\n- 2. **时间分割。** 使用走势前行或严格按时间顺序的训练/验证/测试划分。任何日期晚于决策时间的文档、标签、嵌入、提示词示例或检索分块均不得进入模型上下文。\n\
  - 3. **模型卡。** 记录基础模型、分词器、微调方法、量化、上下文窗口、推理参数和安全过滤器。\n- 4. **提示词和检索版本控制。** 对提示词模板、工具模式、向量索引、分块策略、重排序器和检索证据包进行哈希处理。\n\
  - 5. **指标。** 报告任务指标和治理指标：准确率或 F1 分数、校准、引用忠实度、数值一致性、拒绝准确率、升级精确度、延迟、成本和失败案例。\n- 6.\
  \ **不确定性。** 在抽样变化重要时提供置信区间或自助法区间，并将示例性示例与经审计的经验结果分开。\n- 7. **审计日志。** 对每次重要运行，存储模型版本、提示词版本、检索的文档标识符、工具调用参数、人工批准和最终输出哈希。\n\
  \n配套实现可以遵循以下目录结构：\n\n```\nexperiments/\n rag_sec_filings/\n  data_card.md\n  build_index.py\n\
  \  evaluate_faithfulness.py\n financial_sentiment/\n  temporal_split.py\n  train_peft.py\n\
  \  evaluate_calibration.py\n governance_eval/\n  policy_tests.yaml\n  refusal_and_escalation_eval.py\n\
  \ leakage_tests/\n  contamination_checks.py\n  timestamp_audit.py\nmodel_cards/\n\
  prompt_registry/\naudit_logs/\n```\n\n核心规则很简单：除非读者能够识别决策时可用的信息，并从原始输入复现到报告指标的评估路径，否则不应将任何结果作为经验证据呈现。\n\
  \n## 15.9 参考实现标准\n\n官方配套仓库是 Packt 的官方 _金融中的 LLM_ 仓库。它不打算成为一个完整的生产平台。其目标更狭隘且更重要：提供本书中使用的不变量的小型、可审计的参考实现。对于此版本，可重复性标识符是提交\
  \ `c80ddc04d29fc2ec245bd7bda03c6833e2b2392e` 上的标签 `B32413-v1.0.0`。提交包含该标签的源代码存档和完整不可变的\
  \ Git 束。官方 Packt 仓库应镜像精确的标签和提交；默认分支不是可重复性标识符。\n\n仅当参考实现满足以下检查清单时，才被认为是可接受的：\n\n\
  - 1. 所有对外可见对象都具有类型化架构；\n- 2. 时间戳检查是显式的且失败封闭；\n- 3. 检索返回证据标识符，而非匿名文本块；\n- 4. 重要声明可以链接到证据标识符；\n\
  - 5. 工具调用在执行前通过确定性授权；\n- 6. 评估脚本同时计算任务指标和治理指标；\n- 7. 测试在没有私有凭据或专有数据的情况下运行。\n\n在标记版本中，目录\
  \ `companion/src/finllm` 使用轻量级依赖的 Python 实现了此检查清单，以便逻辑保持可检查。其组件包括类型化的文档、声明、工具调用、版本和审计对象；确定性检索冒烟测试；时间戳泄漏检查；声明支持评分；校准指标；以及受保护的工具执行。这些并非企业系统的替代品；它们是手稿中使用的设计原则的可执行规范。目录\
  \ companion/experiments/rag_sec_filings 包含一个无凭据的冒烟基准，包含虚构文件、问题、可运行脚本、结果表和审计日志。\n\
  \n目录 companion/experiments/pit 包含第 13 章生成器、可机读的图书结果、种子-11 运行以及声明的 60 种子漂移分解。这些基准测试可重复性和治理；它们不是实时市场预测性能的证据。\n\
  \n参考实施强制执行的最重要的数学不变量是\n\n$a_j \\le t$ 对于在决策时间 $t$ 使用的每个证据项 $d_j$。\n\n如果此不等式对任何检索项失败，管道应拒绝该运行。这个单一不等式是第\
  \ 3、4 和 14 章中无前瞻命题的操作形式。\n\n### 清单 15.6: 配套包的最小用法\n\n```\nfrom datetime import datetime,\
  \ timezone\nfrom finllm.contracts import Claim, Document, EvidenceBundle\nfrom finllm.rag\
  \ import faithfulness_score, retrieve_by_bm25_like\nfrom finllm.temporal import\
  \ assert_documents_available\n\nnow = datetime(2026, 7, 1, tzinfo=timezone.utc)\n\
  corpus = (\n    Document(\n        document_id=\"filing-001\",\n        text=\"\
  Revenue increased by 8 percent in fiscal 2025.\",\n        source=\"10-K\",\n  \
  \      timestamp=datetime(2026, 2, 15, tzinfo=timezone.utc),\n    ),\n)\nassert_documents_available(corpus,\
  \ decision_time=now)\nevidence = retrieve_by_bm25_like(\"How did revenue change?\"\
  , corpus, k=3)\nclaim = Claim(text=\"Revenue increased by 8 percent.\")\nprint(faithfulness_score([EvidenceBundle(claim,\
  \ evidence)]))\n```\n\n示例故意保持简小，并使用标记配套版本实现的接口。它捕捉了基本的生产习惯：系统存储证据标识符，检查可用时间，从有效语料库检索，并评估声明是否被引用。更复杂的实现可能使用密集嵌入、混合搜索、交叉编码器重排序、声明级自然语言推理和不可变审计存储；不变量保持不变。\n\
  \n\n\n\n\n归档版本通过以下方式检查：\n\n## 清单 15.7：运行包含的参考基准和测试\n\n```\ncd companion\npython\
  \ experiments/rag_sec_filings/run_experiment.py\nbash run_checks.sh\n```\n\n第一个命令重新生成\
  \ results.csv 和 audit_log.jsonl；第二个命令运行单元测试，重新生成确定性基准输出，验证第 13 章 seed-11 表格，并检查声明的\
  \ 60-seed 输出是否存在漂移。这些命令是发布合同的一部分，而非实时投资表现的证据。\n\n## 仓库发布合同\n\n此版本包含：\n\n- 1. 语义化版本标签\
