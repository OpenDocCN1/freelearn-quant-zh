- "# 金融大型语言模型\n\n## 贡献者\n\n## 关于作者\n\n**Miquel Noguer i Alonso** 是一位资深金融专业人士，在定量金融领域拥有超过\
  \ 30 年的经验。他共同创立了 *人工智能金融学院（AIFI）*，并在领先的金融机构担任高级职务，包括曾担任 *瑞银集团执行董事和安本银行首席投资官*。Miquel\
  \ 也是一位活跃的学者，在纽约大学、哥伦比亚大学及其他顶尖机构教授 AI 和金融科技课程。他拥有 ESADE 的工商管理硕士和工商管理学位，以及 UNED 的定量金融博士学位。Miquel\
  \ 在 *金融领域的人工智能* 方面发表过大量文章，并是 *金融机器学习期刊* 的联合编辑。\n\n## 关于评审者\n\n**Hardik Wadhwa**\
  \ 是万事达卡的产品开发总监，负责在身份验证、AI 驱动的欺诈预防和优化交叉领域主导相关举措。他精通涵盖支付、数据科学和 AI 的金融科技领域，职业生涯起步于数据科学家和工程师，现负责产品与业务开发，以规模化影响力并推动增长。他拥有\
  \ 20 余项专利，并在机器学习和 AI 领域发表了 8 篇以上的研究论文。他获得了瓦拉纳西 IIT (BHU) 的数学与计算一体化硕士学位。他致力于构建能够创造收入并产生现实影响的\
  \ AI 驱动产品与解决方案。\n\n**Daniel Wu** 是一位技术高管兼 AI 科学家，在金融、科技和医疗保健领域拥有超过 20 年的工程和领导经验。他将深厚的技术功底与战略远见相结合，专注于推动负责任的\
  \ AI 转型，最近曾担任摩根大通全球银行业务首席 AI 科学家。作为技术民主化的倡导者，他是斯坦福大学 AI 专业课程的课程协调员。Daniel 是备受追捧的国际主题演讲者、战略顾问，以及关于代理\
  \ AI 和生成式 AI 图书的合著者。他致力于打造创新、高绩效的团队，并塑造企业智能的未来。\n\n## 你可能还喜欢的其他书籍\n\n## 参考文献\n\n\
  ## 索引\n\n## 前言\n\n金融行业正在经历快速转型。大语言模型（LLMs）曾经是实验性研究产物，如今已成为重塑市场分析方式、风险管理方式以及机构与客户、监管机构和交易对手互动方式的运营系统。这种转变是结构性的：金融决策不再仅由计量经济模型和结构良好的数据集支持，而是越来越多地依赖于能够大规模解释非结构化语言的系统。从解析财报电话会议和央行讲话，到检测监管文件和客户沟通中的异常，LLMs\
  \ 对金融的影响已经显现并正在加速。\n\n我与这些技术的接触既是职业性的，也是个人的。十年前，金融机器学习主要由相对较小的统计模型和人工制作的规则主导。2017\
  \ 年 Transformer 架构的引入 [Vaswani et al., 2017]，随后是 GPT-3 [Brown et al., 2020] 和 BERT\
  \ [Devlin et al., 2019] 等模型的部署，标志着新时代的开端。显而易见，金融 AI 的未来不仅建立在旧工具的渐进式改进之上，更建立在关于语言表示和推理的新方式之上。FinBERT\
  \ [Araci, 2019]、BloombergGPT [Wu et al., 2023b] 和 FinEAS [Gutiérrez-Fandiño et al.,\
  \ 2021] 等领域特定模型的出现，证实这一变化不仅是理论性的，更是实践性的。\n\n本书既为应对这一变化提供了严谨的基础，也提供了实践指南。它解释了 LLMs\
  \ 的工作原理，如何将其适应金融的特定约束和要求，以及如何对其进行治理，以便在受监管环境中负责任地运行。讨论从架构、分词和优化目标，转移到微调策略、检索增强生成、多代理系统和协议级集成。同时，它直面偏见、幻觉、缺乏可解释性和系统脆弱性等风险，这些风险必须得到解决，才能在高风险金融环境中信任这些系统。\n\
  \n在金融领域，大语言模型最好被理解为流水线的一部分，而非孤立解决方案。原始文档、时间序列和市场数据馈送经过整理、标准化和嵌入；检索层保持知识最新；生成受金融身份、会计规则和风险限制的约束；策略经过对齐和评估；决策在治理与监督框架内执行。本书的结构旨在引导你沿着该流水线前进。\n\
  \n归根结底，本书旨在成为一个工具箱，而非宣言。其目标是提供读者可适应自身环境的具体架构、设计模式、代码示例和治理框架。每一章的编写都旨在让读者从概念走向实现：从理解注意力机制到构建可运行的检索流水线；从阅读关于对齐的内容到配置评估仪表盘和策略检查；从关于代理的抽象讨论到设计生产级工作流。如果读到最后，你既拥有理解金融领域大语言模型的知识，也拥有负责任地构建和治理它们的工具，那么本书就实现了其目的。\n\
  \n## 本书适合的读者\n\n本书面向关注金融智能未来以及在金融系统中负责任地部署 AI 的读者。\n\n对于量化研究员和交易员，本书提供了将语言和非结构化文本纳入传统模型、时间序列流水线和投资组合构建的方法。对于风险管理人员和合规官员，本书考察了在严苛的监管和模型风险框架下控制、监控和审计\
  \ AI 驱动决策的机制。对于技术领导者和架构师，它提供了部署和治理的蓝图，包括集成模式、基础设施选择和可观测性。对于学者，它介绍了自然语言处理、强化学习和金融经济学的综合。对于政策制定者和监管者，它阐明了将\
  \ LLMs 嵌入全球金融系统核心的前景与风险。\n\n本书假设读者具备基本机器学习、Python、金融市场以及风险、合规或定量分析等核心概念的基础知识。读者不必在每个领域都成为专家，但应能在数学符号、代码示例和金融工作流之间自如切换。\n\
  \n## 本书涵盖的内容\n\n第 1 章 大语言模型简介，奠定核心概念，并将 LLMs 置于金融 AI 演进的背景下。\n\n第 2 章 金融大语言模型的基础与系统设计，阐述实际系统所需的底层\
  \ Transformer 架构、分词方案、预训练和提示工程。\n\n第 3 章 针对金融的大语言模型微调，介绍全量微调和参数高效适配方法及其在金融任务中的应用。\n\
  \n第 4 章 针对金融任务的检索增强生成，介绍 RAG 范式、嵌入模型、向量数据库以及知识密集型金融应用的评估方法。\n\n第 5 章 金融领域大语言模型代理的架构与应用，探讨代理架构、多代理系统以及面向交易、风险和运营的工具集成。\n\
  \n第 6 章 金融系统中的模型上下文协议与强化工具调用，阐明了 MCP 所标准化的内容与其周围所需的确定性金融控制边界之间的区别。它开发了身份、授权、类型化工具、时点证据、数值验证、审批、幂等性、延迟和审计的实际模式。\n\
  \n第 7 章 金融领域大语言模型的应用，展示了金融 LLM 栈如何在前台、中台和后台工作流中实例化，包括市场分析、交易、风险、监控、银行业务和运营。\n\n\
  第 8 章 金融文档与咨询，侧重于文档智能、合同分析、合规检查，以及智能咨询和客户服务系统的设计。\n\n第 9 章 大语言模型中的强化学习，介绍 PPO、GRPO\
  \ 和 DPO 等强化学习方法，用于将模型与复杂的金融目标和多步决策问题对齐。\n\n第 10 章 基础设施与性能，针对生产级金融大语言模型系统，探讨硬件、数据流水线、部署策略和性能优化。\n\
  \n第 11 章 伦理、治理与合规：金融大语言模型的综合框架，提出了从基础设施到行为监控和监管对齐的多层治理架构。\n\n第 12 章 金融中的大语言模型：数学创新与实证证据，调研基础金融大语言模型、实证基准和多代理交易系统。\n\
  \n第 13 章 进阶主题：金融领域大语言模型中的推理、多模态与时间序列，探讨高级推理方案、多模态架构和时间序列大语言模型等前沿主题。\n\n第 14 章 生成式前沿：从预测模型到自主经济代理人，展望自主金融代理人、生成式阿尔法以及新的系统性风险和机遇形式。\n\
  \n第 15 章 技术基础与实践资源，提供数学基础、实现模式、可重复性协议，以及数据集、库和评估框架的实践资源。\n\n## 如何充分利用本书\n\n本书结合了概念解释、数学符号、代码示例和治理讨论。数学内容旨在阐明假设、保证和局限性。代码示例旨在展示这些假设如何进入实现，以及在金融工作流可被信任之前必须检查、记录或升级的内容。\n\
  \n本书遵循一种有意为之的模式：每个重大的技术构建都由金融问题驱动，由显式数学对象形式化，转译为可检查的代码或伪代码，然后由治理控制加以界定。因此，读者应将公式、算法和示例一起阅读。公式识别契约，代码实现契约，治理层记录契约在生产中是否得到遵守。\n\
  \n\n\n\n示例为了说明目的而简化。生产部署需要额外的安全性、可观测性、测试、访问控制、文档、验证和回滚程序。因此，示例应被视为参考模式，而非直接的生产实现。\n\
  \n## 伴随代码和版本控制\n\n官方伴随仓库是 Packt 的官方 *金融中的大语言模型* 仓库。随本提交提供的版本特定伴随代码是提交 c80ddc04d29fc2ec245bd7bda03c6833e2b2392e\
  \ 的版本 B32413-v1.0.0。它同时归档为 `LLM_in_Finance_COMPANION_B32413-v1.0.0.zip` 和不可变的 Git\
  \ 包 `LLM_in_Finance_COMPANION_B32413-v1.0.0.gitbundle`。这些工件，而非移动的默认分支，是本版本的规范参考；官方\
  \ Packt 仓库应镜像相同的标记和提交。可复现运行会记录仓库提交、Python 环境、数据快照、模型和提示词版本、生成的工件哈希以及用于执行实验的命令。印刷代码强调接口和不变量；归档版本包含完整的可运行示例、测试和生成结果。\n\
  \n## 技术质量契约\n\n本书始终采用一种简单的纪律：每个重要的金融 LLM 理念都应同时在四个层面上可读。首先，它应由真实的金融工作流程所驱动。其次，它应由精确的数学对象表示。第三，它应映射到可实现的算法或软件模式。第四，它应具有在系统投入生产前就能检测故障的评估和治理协议。\n\
  \n明确包含本契约的原因是，金融 AI 项目常常在这些层级之间的接口处失败。一个技术上优雅的模型可能会因数据划分泄露未来信息而失败。一个编写良好的提示词可能会因工具权限在模型外未被强制执行而失败。一个强大的检索系统可能会因答案未针对检索到的证据逐条核查声明而失败。相反，如果工作流程清晰、数据干净、权限确定性且评估协议诚实，一个普通模型也可能很有价值。\n\
  \n## 四层标准\n\n针对本书开发的每个架构，预期的标准如下：\n\n- 1. **动机。** 在模型之前阐明金融决策问题。读者应知道该系统是支持研究、风险、交易、合规、客户服务、运营还是治理。\n\
  \n- 2. **数学。** 在陈述保证之前，定义输入、输出、损失函数、信息集、时间戳、可接受的动作以及不确定性模型。\n\n- 3. **代码。** 提供具有类型、可审计、尽可能确定性的代码，并明确区分什么是可运行的参考实现，什么是依赖生产环境的集成。\n\
  \n- 4. **验证。** 在模拟部署环境的协议下，测量任务质量、校准、泄露、忠实性、延迟、成本以及控制失败。\n\n实际后果是，本书避免将 LLM 响应视为原始对象。只有当响应与证据关联、在允许的策略下生成、针对相关数值和文本约束进行检查，并记录在可复现的审计轨迹中时，才可接受。\n\
  \n## 数学纪律\n\n每当结果涉及金融部署时，默认对象不是静态数据集，而是时间索引的实验。数据点写作：\n\n$$z_i = (x_i, y_i, \\tau_i,\
  \ g_i), \\quad (1)$$\n\n其中 $x_i$ 是输入，$y_i$ 是目标或审阅者判断，$\\tau_i$ 是可用时间，$g_i$ 是可选的分组变量，例如发行人、投资组合、交易台、司法管辖区或产品系列。在决策时间\
  \ $t$ 进行的有效评估只能使用可用时间不晚于 $t$ 的工件。\n\n标准监督目标为：\n\n$$\\widehat{\\theta} \\in \\arg\
  \ \\min_{\\theta \\in \\Theta} \\frac{1}{|\\mathcal{I}_{train}|} \\sum_{i \\in \\\
  mathcal{I}_{train}} w_i \\ell(f_\\theta(x_i), y_i) + \\lambda \\Omega(\\theta; \\\
  theta_0), \\quad (2)$$\n\n其中权重 $w_i$ 考虑类别不平衡、交易台优先级或成本不对称，$\\Omega(\\theta; \\theta_0)$\
  \ 控制偏离基模型的程度。评估集并非随意的事后想法：它是由时间、分组和可用性约束决定的正式对象。\n\n对于生成式系统，质量是向量值的。金融 LLM 不仅由 ROUGE、BLEU、余弦相似度或双偏好等语义指标来评判。它由以下元组评判：\n\
  \n$$Q = (Q_{\\text{task}}, Q_{\\text{faith}}, Q_{\\text{num}}, Q_{\\text{cal}},\
  \ Q_{\\text{policy}}, Q_{\\text{lat}}, Q_{\\text{cost}}), \\quad (3)$$\n\n涵盖任务实用性、证据忠实性、数值一致性、校准、策略合规性、延迟和成本。这就是后续章节反复将模型指标与治理指标相结合的原因。\n\
  \n### 代码纪律\n\n伴随代码遵循五条规则：\n\n- 1. **类型化边界。** 尽可能使用显式数据结构而非自由形式的字典来表示输入、输出、证据项、工具调用和声明。\n\
  \n- 2. **默认拒绝。** 如果时间戳、权限、引用、架构或数值检查无法验证，参考模式会拒绝或升级，而非静默继续。\n\n- 3. **无隐藏的未来信息。**\
  \ 索引构建、提示词示例、标签和评估工件必须通过可用时间审计。\n\n- 4. **确定性测试。** 最小示例足够小，可在持续集成中运行，且不依赖私有基础设施。\n\
  \n- 5. **关注点分离。** 检索、生成、工具执行、策略检查和审计日志是独立的函数；提示词不作为访问控制的替代品。\n\n### 解释纪律\n\n金融 AI\
  \ 中的高质量解释必须告诉读者该方法为何需要、什么假设使其有效、它如何可能失败，以及如何检测该失败。因此，章节采用重复模式：从金融痛点入手，引入数学抽象，展示可实现的模式，然后陈述验证或治理挂钩。这也是向模型风险、合规、法务、投资和技术利益相关方展示内部金融\
  \ AI 项目的推荐方式。\n\n### 符号和缩写\n\n本节固定书中反复使用的符号。符号刻意设计为可操作的：选择符号，以便直接映射到代码工件，如数据集、提示词、检索索引、工具、策略和审计日志。\n\
  \n| 符号或术语 | 含义 |\n| :--- | :--- |\n| LLM | 大型语言模型。 |\n| RAG | 检索增强生成：基于检索证据的生成管道。\
  \ |\n| MCP | 模型上下文协议：一种标准的主机-客户端-服务器协议，用于将 LLM 应用程序连接到资源、提示词和工具。金融授权和治理仍然是实现义务。\
  \ |\n| D | 数据集或文档语料库。在经验部分，$D_{\\le t}$ 表示仅在决策时间 $t$ 可用的工件。 |\n| X, Y | 输入和输出空间。对于分类，$x\
  \ \\in X$ 是文本或特征对象，$y \\in Y$ 是其标签。 |\n\n| 符号 | 描述 |\n| :--- | :--- |\n| $\\ell(\\\
  hat{y}, y)$ | 任务损失。示例包括分类的交叉熵、回归的平方误差以及基于生成的声明级支持损失。 |\n| $R(\\theta)$ 和 $\\hat{R}(\\\
  theta)$ | 模型参数 $\\theta$ 的总体风险和经验风险。 |\n| $\\mathcal{F}_t$ | 过滤：截至时间 $t$ 可用的信息。这是“无未来信息”背后的正式对象。\
  \ |\n| $\\mathcal{F}_t^{MCP}$ | 工作流在 MCP 延迟、授权、删减和带宽约束后可用的信息。 |\n| $A_i$ | 从生成答案中提取的原子声明。\
  \ |\n| $E_i$ | 为声明 $A_i$ 检索到的证据包，包括文档标识符、时间戳和段落。 |\n| $E_i \\vDash A_i$ | 在指定验证器和可接受语料库下，证据包\
  \ $E_i$ 支持声明 $A_i$。 |\n| Faith($a, E$) | 声明级忠实度分数：答案 $a$ 中由证据 $E$ 支持的实质性声明的比例。 |\n\
  | Gate | 策略门控，将拟议的工具调用和状态映射为允许、拒绝或升级。 |\n| $\\pi_\\theta$ | 具有参数 $\\theta$ 的模型或代理策略。在交易场景中，它将信息状态映射到动作；在\
