  \        self.dataset_config = dataset_config\n        self.output_dir = output_dir\n\
  \        self.max_length = max_length\n\n        self.tokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  \        self.model = AutoModelForSequenceClassification.from_pretrained(\n    \
  \        model_name,\n            num_labels=3,\n        )\n\n    def tokenize_batch(self,\
  \ batch):\n        return self.tokenizer(\n            batch[\"sentence\"],\n  \
  \          padding=\"max_length\",\n            truncation=True,\n            max_length=self.max_length,\n\
  \        )\n\n    @staticmethod\n    def compute_metrics(eval_pred):\n        logits,\
  \ labels = eval_pred\n        predictions = np.argmax(logits, axis=-1)\n       \
  \ return {\n            \"accuracy\": accuracy_score(labels, predictions),\n   \
  \         \"macro_f1\": f1_score(labels, predictions, average=\"macro\"),\n    \
  \    }\n\n    def load_and_prepare_data(self):\n        raw = load_dataset(\n  \
  \          self.dataset_name,\n            self.dataset_config,\n            split=\"\
  train\",\n        )\n        # NOTE ON THE SPLIT -- read this before reporting any\
  \ number.\n        # Financial PhraseBank ships without timestamps, so a chronological\n\
  \        # split is not available for this dataset. The random split below is\n\
  \        # therefore forced, and it is precisely the protocol this book\n      \
  \  # criticises elsewhere (Chapters 1 and 13). It is kept because it\n        #\
  \ demonstrates the training loop, not because it produces a\n        # trustworthy\
  \ result. Any score obtained this way is a smoke test of\n        # the pipeline,\
  \ NOT evidence of deployable performance.\n        # For a model that will inform\
  \ a decision, use a timestamped corpus\n        # and the chronological split in\
  \ temporal.py.\n        # THREE-way split. The previous version made ONE split and\
  \ then\n        # passed dataset[\"test\"] to the Trainer as eval_dataset with\n\
  \        # load_best_model_at_end=True -- i.e. it selected the checkpoint on\n \
  \       # the test set. That is selection on the test partition, and this\n    \
  \    # book spends a chapter explaining why it invalidates the number.\n       \
  \ # Validation selects; test is touched once, after selection.\n        tmp = raw.train_test_split(test_size=0.2,\
  \ seed=42)\n        held = tmp[\"test\"].train_test_split(test_size=0.5, seed=42)\n\
  \        split = DatasetDict({\n            \"train\": tmp[\"train\"],\n       \
  \     \"validation\": held[\"train\"],\n        })\n```\n\n\n\n\n\n```python\n \
  \   \"test\": held[\"test\"],\n})\n\ntokenized = split.map(self.tokenize_batch,\
  \ batched=True)\ntokenized = tokenized.rename_column(\"label\", \"labels\")\ntokenized.set_format(\n\
  \    type=\"torch\",\n    columns=[\"input_ids\", \"attention_mask\", \"labels\"\
  ],\n)\nreturn tokenized\n\ndef train(self):\n    dataset = self.load_and_prepare_data()\n\
  \n    args = TrainingArguments(\n        output_dir=self.output_dir,\n        eval_strategy=\"\
  epoch\",\n        save_strategy=\"epoch\",\n        learning_rate=2e-5,\n      \
  \  per_device_train_batch_size=16,\n        per_device_eval_batch_size=16,\n   \
