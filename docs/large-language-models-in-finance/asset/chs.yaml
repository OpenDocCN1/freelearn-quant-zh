  Parliament and Council of the European Union, 2024]。


  - **英国金融服务。** FCA 的当前方法仍侧重于成果、基于原则且技术中立，将现有监管框架应用于 AI 赋能的金融服务 [Financial Conduct
  Authority, 2025]。


  - **AI 洗白与真实声明。** SEC 的 2024 年 Delphia 和 Global Predictions 行动，提供了涉及虚假或误导性 AI 相关陈述的金融服务执法案例的文档化示例
  [U.S. Securities and Exchange Commission, 2024]。


  - **带 LLM 代理的实验金融市场。** Henning 等人、Lopez-Lira、Ouyang 和 Sui 以及 Anand 等人提供了关于行为分歧、提示条件策略、市场泡沫和系统设计效应的互补控制证据
  [Henning et al., 2025, Lopez-Lira, 2025, Ouyang and Sui, 2026, Anand et al., 2026]。


  - **算法交互与协调。** Calvano 等人提供了一项关于自主定价算法之间默示串通行为的基础控制性研究；该结果并非 LLM 特有，但与共模风险和交互风险相关
  [Calvano et al., 2020]。


  - **隐私保护学习。** 差分隐私、联邦学习、安全聚合和安全多方计算由 Dwork 和 Roth、Kairouz 等人、Bonawitz 等人以及 Evans
  等人涵盖 [Dwork and Roth, 2014, Kairouz et al., 2021, Bonawitz et al., 2017, Evans et
  al., 2018]。


