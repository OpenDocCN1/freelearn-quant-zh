  \n$$\n\\mathcal{L}_{\\text{CLM}}(\\theta) = -\\mathbb{E}_{(x_{1:T}, d) \\sim \\\
  mathcal{D}} \\sum_{t=1}^T \\log p_\\theta(x_t \\mid x_{<t}, d), \\quad (12.1)\n\
  $$\n\n其中 $\\theta$ 表示模型参数，$x_{<t} = (x_1, \\dots, x_{t-1})$ 是预测时可用的前缀，$d \\in \\\
  {\\text{gen}, \\text{fin}\\}$ 指示样本来自通用还是金融\n\n\n领域。训练分布 D 是混合分布\n\n$$\\mathcal{D}\
  \ = \\lambda_{\\text{fin}}\\mathcal{D}_{\\text{fin}} + (1-\\lambda_{\\text{fin}})\\\
  mathcal{D}_{\\text{gen}}, \\quad \\lambda_{\\text{fin}} \\in (0, 1).$$\n\n在实践中，\\\
  (\\lambda_{\\text{fin}}\\) 的选取使得金融数据占总训练标记的相当大比例，同时又不会消除广义通用语言能力的益处。这可以被视为一种跨领域的\
  \ *重要性采样* 形式：相对于金融样本在全球语料库中的原始频率，其被赋予了更高的权重。\n\n在架构上，BloombergGPT 是一种 GPT 风格的模型，包含：\n\
  \n- \\( L \\) 个 transformer 块，其中 \\( L \\) 表示重复的注意–前馈层的数量；\n- 隐藏维度 \\( d_{\\text{model}}\
  \ \\)，即内部标记表示的宽度；\n- 每层具有 \\( H \\) 个头的多头自注意力；\n- ALiBi（带线性偏置的注意力）位置编码，作为自注意力内部的加性偏置应用，而非作为学习式或旋转式位置嵌入；以及\n\
  - 标准自回归掩码，因此模型在预测下一个标记时无法看到未来标记。\n\n这些架构术语在 transformer 模型中是标准的。对于本章而言，重要的定性观点是：BloombergGPT\
  \ 为金融语言分配了大量的模型容量和数据预算，而不仅仅依赖于通用预训练后再进行提示。\n\n### 报告的实证行为\n\n研究团队在多种金融和通用 NLP 任务上评估了该模型。简化而言，报告的模式如下：\n\
  \n- 在金融任务上，包括分类、情感分析、问答和实体识别，BloombergGPT 相对于规模相当或更大的通用 LLM 表现强劲；\n- 在通用语言基准上，它与非金融模型保持竞争力；且\n\
