  \ 以及针对受支持环境的哈希锁定的依赖锁文件和预置 wheel；\n- 3. 无需私密凭据即可运行的持续集成和本地测试；\n- 4. 数据卡、模型卡和提示词注册表模板，以及许可证信息；\n\
