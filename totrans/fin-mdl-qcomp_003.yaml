- en: '2'
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Quantum Machine Learning Algorithms and Their Ecosystem
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: In recent decades, many quantum computing scientists have leaned towards researching
    and generating quantum algorithms and their practical realization (*Cerezo et
    al., 2021; Montanaro, 2016*). As discussed in the previous chapter, quantum computers
    differ from classical computers mainly in the form of computation they employ.
    They can solve problems that are intractable for classical systems (*Arute et
    al., 2019*). In a quantum computer, instead of classical bits, **qubits** are
    the fundamental unit of information. The implementation of quantum algorithms
    is based fundamentally on the physical qualities of these qubits compared to classical
    bits. Still, the physical realization of quantum computers has not yet reached
    the level of maturity attained by their classical counterparts, where millions
    of transistors can be placed in a limited space without compromising their accuracy
    or functioning.
  prefs: []
  type: TYPE_NORMAL
- en: Noise and error control are crucial for quantum information processing, and
    effective strategies to deal with noise are an active area of research (as reviewed
    by *Fedorov et al., 2022*). In this regard, **quantum error correction** (**QEC**)
    protocols have been proposed to tame the effects of noise (*Campagne-Ibarcq et
    al., 2020*). Unfortunately, even with the progress made in QEC so far, we haven’t
    yet developed fault-tolerant machines; the number of qubits required to pass from
    physical to logical qubits (without errors) is too substantial. Current quantum
    gate-based devices have a magnitude of around 100 physical qubits, and are often
    referred to as **Noisy Intermediate-Scale Quantum** (**NISQ**) devices given their
    imperfect operations (*Bharti et al., 2021*). In this context, one possibility
    for realizing fault-tolerant quantum computation is to scale up the number of
    qubits while ensuring they remain usable via efficient implementation and measurement
    operations. More detail on how we can work in this error-filled environment will
    be covered in [*Chapter 9*](B19146_09.xhtml#_idTextAnchor165).
  prefs: []
  type: TYPE_NORMAL
- en: 'Classical computers have not yet been dethroned, in any case. Classical computers
    have been used for many tasks, and realizing quantum computation and interfacing
    with quantum devices is essential, particularly when data is involved. Most of
    the data we use daily comes in bytes, so it is necessary to use classical resources
    for storing, preprocessing, and postprocessing, as well as describing the algorithm
    implementations that will run on our specialized hardware: the quantum computer.'
  prefs: []
  type: TYPE_NORMAL
- en: These quantum and classical algorithms can be applied in many regimes to solve
    problems related to our daily activity. In particular, one area that has attracted
    a lot of attention is **Quantum Machine Learning** (**QML**), where **Variational
    Quantum Algorithms** (**VQAs**) represent the family of algorithms that use classical
    computing to find the parameters of a **Parameterized Quantum Circuit** (**PQC**)
    or ansatz (as it is called in the literature). Specific implementations of the
    VQA family that will be explained in this chapter are the **Variational Quantum
    Eigensolver** (**VQE**), **Variational Quantum Solver** (**VQS**), **Variational
    Quantum Classifier** (**VQC**), and **Quantum Approximate Optimization Algorithm**
    (**QAOA**). These are the most well-known ones, but we will also examine some
    variations, modified versions, and different implementations related to specific
    **Software Development Kits** (**SDKs**), code languages, platforms, and hardware
    (*Cerezo et* *al., 2021*).
  prefs: []
  type: TYPE_NORMAL
- en: One of the first tasks we must tackle when dealing with those algorithms is
    encoding our classical data into the quantum regime. Quantum algorithms work using
    quantum states; we will need to encode our data in those states to be able to
    take advantage of quantum algorithms. One of the first implementations that used
    this mapping between classical and quantum regime was kernel methods, which demonstrated
    the advantages of quantum encoding when tackling the challenges of supervised
    machine learning (*Mengoni et al., 2019*). These algorithms employ conventional
    machine learning models such as a **Support Vector Machine** (**SVM**) but benefit
    from classical data encoding in quantum states, allowing for better data separability.
    Their advantages derive from quantum computers’ ability to recognize intrinsic
    labeling patterns in datasets that, to classical computers, appear as random noise.
    This recognition feature is specific to data that requires more than two or three
    dimensions to be properly represented for classification (nonlinear embeddings)
    and is often difficult to interpret.
  prefs: []
  type: TYPE_NORMAL
- en: This chapter offers a survey of the NISQ-era algorithms, focusing on the efforts
    to draw the highest computational potential from existing devices and develop
    techniques to meet the sector’s long-term goals, including fault-tolerant quantum
    computation. In the quest to derive advantages from the current state of quantum
    computing, hybrid quantum-classical and quantum-inspired algorithms represent
    one of the best current approaches to challenges including QML, optimization,
    and simulations (*Gilyén et* *al., 2022*).
  prefs: []
  type: TYPE_NORMAL
- en: There are dozens of **quantum computing** (**QC**) algorithms throughout the
    literature, and more are under investigation. This chapter will exemplify the
    use cases, articles, platforms, and implementation methods in the contemporary
    NISQ stage. QC companies and academic groups have made efforts to make the most
    of the advantages of QC in the present day. For this purpose, they have implemented
    most of the algorithms shared in this chapter and the following pages. These will
    be presented in detail and from different angles for a better understanding of
    the libraries, code languages, cloud services, and qubit-realization approaches,
    highlighting the most important players of this ecosystem.
  prefs: []
  type: TYPE_NORMAL
- en: 'To summarize, this chapter will cover the following:'
  prefs: []
  type: TYPE_NORMAL
- en: Baseline quantum algorithms (Grover, Shor, Deutsch-Jozsa, and others)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The main NISQ QML and optimization algorithms (variational, quantum-kernel-based,
    and QUBO-based)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Technological ecosystems that use the aforementioned algorithms (code languages,
    libraries or SDKs, hardware, clouds, and tools)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Technical challenges (using real-world data, analyzing business applications,
    and current advantages)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Technical requirements
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 'To be able to follow this chapter, you will require the following technical
    skills:'
  prefs: []
  type: TYPE_NORMAL
- en: A basic level of Python
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Familiarity with Visual Studio Code or any **Integrated Development Environment**
    (**IDE**) that supports Jupyter Notebooks
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Foundational quantum algorithms
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: A review of foundational quantum algorithms is necessary to understand the state-of-the-art
    progress in QC and its potential to overcome problems intractable for classical
    computation. Starting from the basic concepts, an algorithm is a series of computer-executable
    steps to conduct a computation or solve a problem (*Montanaro, 2016*). Consequently,
    an algorithm is considered quantum when it successfully performs on a quantum
    machine. Generally speaking, all classical algorithms could theoretically perform
    on such a system. Nevertheless, in a strict sense, quantum algorithms refer to
    those with at least one step involving quantum mechanical properties, such as
    superposition or entanglement. One of the main attributes of quantum computers
    is quantum parallelism, which allows for many existing quantum algorithms (*Álvarez
    et* *al., 2008*).
  prefs: []
  type: TYPE_NORMAL
- en: A quantum circuit often characterizes a quantum algorithm. A quantum circuit
    is a structure where the problem-solving stages are performed on ≥1 qubits that
    modify their quantum status; this procedure is known as a quantum gate (*Chow
    et al., 2012; Mitarai et al., 2018*). Quantum gates are divided into single, two-qubit,
    or three-qubit gates based on how many qubits they simultaneously operate on.
    All quantum circuits terminate with a measurement of one or more qubits.
  prefs: []
  type: TYPE_NORMAL
- en: '*Figure 2**.1* shows how to construct a Bell state (an entangled two-qubit
    state) to exemplify this process. The circuit is read from left to right, starting
    with the basic state of all devices composed by |0⟩ state qubits (two in this
    case). The first gate we see is the Hadamard gate, which puts the qubit in a superposition
    state (|0⟩+ |1⟩), which ends up being all possible options from a classical bit
    perspective. One of the most used gates is the following blue gate entangling
    both qubits, the CNOT gate. This acts over the second qubits if the first one
    is active (|1>). Therefore, at this stage, the quantum state looks as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: '|Φ +⟩ =  1 _ √ _ 2 (|0⟩ A ⊗ |0⟩ B + |1⟩ A ⊗ |1⟩ B)'
  prefs: []
  type: TYPE_NORMAL
- en: This is the canonical representation of one of the Bell states. After this,
    we only need to measure our quantum state into a sequence of classically read
    bits.
  prefs: []
  type: TYPE_NORMAL
- en: Note
  prefs: []
  type: TYPE_NORMAL
- en: Bell states are the simplest form of states for quantum entanglement. This means
    the state can’t be separated into the state of each qubit. The entanglement is
    the result of the CNOT gate (blue gate in *Figure 2**.1*).
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.1 – Quantum circuit of two qubits under Hadamard and CNOT gates.
    The result is a Bell state entanglement](img/B19146_02_001.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.1 – Quantum circuit of two qubits under Hadamard and CNOT gates. The
    result is a Bell state entanglement
  prefs: []
  type: TYPE_NORMAL
- en: In many instances, quantum algorithms can be more effective under the simultaneous
    usage of classical and quantum computers for the same task. Comparing classical
    and quantum means to solve a task takes the complexity order shown in *Figure
    2**.2*. The order of complexity a problem may belong to is often discussed in
    terms of whether it is solvable in **polynomial time** (**P**). If not, we enter
    the **Nondeterministic-Polynomial time** family (**NP**), meaning we face quite
    a challenging task for classical computation. Portfolio optimization, for example,
    which will be discussed in [*Chapter 5*](B19146_05.xhtml#_idTextAnchor100), is
    known to be NP-complete (*Kellerer, 2000*). Quantum algorithms are frequently
    under the umbrella of a **Bounded-Error Quantum Polynomial-Time** (**BQP**) complexity
    class (*Yung, 2019*). The latter is a category of judgment problems that can be
    solved by quantum computers in polynomial time with a maximum error chance of
    ⅓.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.2 – Graphical representation of the connection between the problems
    of BQP and classical P, NP, and PH](img/B19146_02_002.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.2 – Graphical representation of the connection between the problems
    of BQP and classical P, NP, and PH
  prefs: []
  type: TYPE_NORMAL
- en: Note
  prefs: []
  type: TYPE_NORMAL
- en: '**Complexity theory** (**CT**) primarily involves the evaluation of quantum
    computation. In CT, an algorithm or a family of problems is typically associated
    with a specific class. *Figure 2**.2* illustrates the connections between several
    classes. **Polynomial Hierarchy** (**PH**) serves as a broader class than NP,
    indicating higher complexity levels.'
  prefs: []
  type: TYPE_NORMAL
- en: As mentioned earlier, a broad overview of the quantum algorithms that impacted
    the history of this field should be conducted to better understand the current
    trends of QC and the foundations of contemporary algorithms.
  prefs: []
  type: TYPE_NORMAL
- en: We will now look at three foundational algorithms.
  prefs: []
  type: TYPE_NORMAL
- en: Deutsch-Jozsa algorithm
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: This is a quantum algorithm that solves a particular problem in linear time,
    for which a classical algorithm would require exponential time. Consequently,
    it is considered one of the first quantum algorithms to demonstrate a quantum
    speedup over its classical counterpart (*Z. Li et al., 2020*). It was named after
    David Deutsch and Richard Jozsa, who proposed the algorithm in 1992 (*Deutsch
    et al., 1992*). It can be used to determine whether a Boolean function is balanced
    or constant. If the function is constant, Deutsch’s algorithm will output 0, while
    in the balanced case, the output will be 1\. This means that the worst case in
    the classical regime will estimate half of the values plus one (*0.5*n+1*, where
    n is the number of inputs) to test the function to find whether it is constant
    or balanced.
  prefs: []
  type: TYPE_NORMAL
- en: '*Figure 2**.3* shows the actual form it takes when described over quantum registers
    with the following steps:'
  prefs: []
  type: TYPE_NORMAL
- en: Apply Hadamard gates so that all combinations of classically readable values
    (0 and 1) are considered.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Apply a unitary gate to encode the output for a given function in the last qubit
    that is initialized as |1⟩ (instead of the usual |0⟩ state).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Apply back the Hadamard gate to all qubits and measure the first N qubits used
    as function input.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![Figure 2.3 – Deutsch-Jozsa’s schematic circuit](img/B19146_02_003.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.3 – Deutsch-Jozsa’s schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: 'It uses what is called an oracle (black box unitary) that performs the action
    of a binary function f(x) : {0,1} n → {0,1} where x represents the inputs to which
    a Hadamard gate is applied in the preceding figure. Thanks to the action over
    the qubit initiated with state |1> and the effect it has over the entry qubits
    upon the effect of the oracle, the Deutsch-Jozsa algorithm is able to establish
    whether a binary is balanced or constant. An oracle (black box) is a function
    in which the properties are unknown in advance, but that you can call with queries
    in order to determine them. You have inputs and outputs to evaluate the operation
    of the oracle.'
  prefs: []
  type: TYPE_NORMAL
- en: This algorithm accelerates the search to determine whether a function possesses
    a particular attribute (being balanced). The algorithm saves time since it requires
    the function (or, more accurately, a function derivative) to be called *only once*,
    as opposed to the *n**_**2**+**1* times that a classical algorithm requires (n
    being the input size). When the function is extremely “expensive,” for example,
    in terms of processing resources, it might be advantageous to compute it just
    once.
  prefs: []
  type: TYPE_NORMAL
- en: Grover’s algorithm
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In 1996, Lov Grover developed a quantum technique that locates an item four
    times faster than traditional search methods for unsorted databases. This search
    method for unstructured data is known as Grover’s algorithm (*Grover, 1996*),
    and can alternatively be described as an oracle. As previously defined in the
    Deutsch-Jozsa section, the oracle will be evaluated repeatedly to determine its
    characteristics.
  prefs: []
  type: TYPE_NORMAL
- en: An example of such a task is searching for a specific card in a shuffled deck
    of *N* cards. Traditionally, this can only be done by sequentially examining each
    card, requiring N steps in the worst-case scenario using classical approaches
    (N evaluations for N cards). In contrast, Grover’s algorithm achieves this task
    with just √ _ N  oracle evaluations, resulting in a time complexity of O(√ _ N )
    in the worst case. However, it is important to note that the probability of obtaining
    the correct answer is not guaranteed to be 100 percent due to the influence of
    the algorithm’s phases.
  prefs: []
  type: TYPE_NORMAL
- en: '*Figure 2**.4* shows the quantum circuit that implements Grover’s algorithm.
    It follows a similar shape to the previous example.'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.4 – Grover’s algorithm schematic circuit](img/B19146_02_004.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.4 – Grover’s algorithm schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: 'For the two-qubit case, the first set of Hadamard gates puts our initial |00⟩
    state, into the superposition of all potential combinations:'
  prefs: []
  type: TYPE_NORMAL
- en: '|ψ⟩ = 1 _ 2(|00⟩ + |01⟩ + |10⟩ + |11⟩)'
  prefs: []
  type: TYPE_NORMAL
- en: Then we apply the unitary operator *U* of our problem so that the solution gets
    tagged by a phase change by putting a minus sign in front of it.
  prefs: []
  type: TYPE_NORMAL
- en: '|ψ⟩ = 1 _ 2(|00⟩ − |01⟩ + |10⟩ + |11⟩)'
  prefs: []
  type: TYPE_NORMAL
- en: 'Thanks to this flagging, the Grover operator can identify our candidate solution
    state such that we would measure |01⟩ at the end of our first iteration. An illustration
    can be seen in *Figure 2**.5*:'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.5 – Phase change of the flag element by Grover’s algorithm during
    the first application](img/B19146_02_005.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.5 – Phase change of the flag element by Grover’s algorithm during the
    first application
  prefs: []
  type: TYPE_NORMAL
- en: When the oracle function has N potential input values (4 in our two-qubit system),
    the approach requires only O( √ _ N ) evaluations. In contrast, the best classical
    algorithm requires O(N) executions. That is why, by only applying our Grover operator
    one time, we were able to find the solution to our problem in the example just
    shown.
  prefs: []
  type: TYPE_NORMAL
- en: This could be used to efficiently search in a big search space (a needle in
    a haystack). We will see how to use it in [*Chapter 5*](B19146_05.xhtml#_idTextAnchor100)
    to find the best portfolio from all potential combinations.
  prefs: []
  type: TYPE_NORMAL
- en: 'To summarize, the core of Grover’s algorithm is *amplitude amplification*.
    This is the process that Grover’s algorithm uses to speed up the search. It’s
    all about manipulating the probability amplitudes of the quantum states involved.
    The process works as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Initial state**: At the beginning of Grover’s algorithm, you start with a
    quantum system in an equal superposition of all possible states. This means that
    if you have a system of *n* qubits, you have 2 n possible states, and each of
    these states has the same probability of 1 / 2 n.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Oracle application**: An oracle is then applied to the system, which inverts
    the state sign corresponding to the solution. This means the solution state now
    has a negative amplitude while all other states retain their positive amplitude.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Amplitude amplification**: The amplitude amplification process then amplifies
    the amplitude (or probability) of the correct state and decreases the amplitude
    of the incorrect states. It is achieved by applying the Grover diffusion operator
    (also called Grover iteration), which flips the state around the mean amplitude.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Steps *2* and *3* are repeated approximately √ _ N  times to maximize the amplitude
    of the correct state.
  prefs: []
  type: TYPE_NORMAL
- en: The beauty of Grover’s algorithm is that the amplitude of the “correct” state
    (the solution we’re interested in) gets amplified after each iteration of the
    algorithm. By contrast, the amplitudes of the “incorrect” states get reduced.
    This leads to a high probability of measuring the correct state when the final
    measurement is made.
  prefs: []
  type: TYPE_NORMAL
- en: Shor’s algorithm
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The mathematician Peter Shor was working on the discrete log problem in 1994\.
    Using the quantum Fourier transformation, he found a solution by using the periodicity
    between two numbers. He then extended his discovery to the factorization problem.
    Factorization can be used to find the prime numbers of an integer.
  prefs: []
  type: TYPE_NORMAL
- en: The main approach to encrypting data is the RSA protocol, which employs asymmetric
    encryption by generating public and private keys based on multiplying two big
    prime numbers. Shor’s algorithm could find these two prime numbers by factoring
    in the key. Classically, this problem is intractable because cracking a 2,048-bit
    RSA key would require thousands of years with an **high-performance computing**
    (**HPC**). Shor’s can break the key in polynomial time. This algorithm can’t be
    yet used to break the 2,048-bit RSA key due to the high number of qubits required.
  prefs: []
  type: TYPE_NORMAL
- en: Shor’s method is probabilistic, as are many other algorithms. Specifically,
    it provides the right response with a robust degree of probability, and the likelihood
    of failure can decrease through repetition of the procedure.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.6 – Shor’s algorithm schematic circuit](img/B19146_02_006.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.6 – Shor’s algorithm schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: '*Figure 2**.6* shows that the algorithm performs two main actions besides the
    already covered superposition by the Hadamard gates. The qubit at the bottom (1)
    are used as the entry point, and the remaining qubits (0) the ones used to encode
    our solution. The first stage applies different exponents of a given function
    to the qubit below, which switches phases in the qubit that applies the action.
    By the action of an inverse quantum Fourier transformation (QFT −1), we can read
    the set of bit strings that encodes a numeric value encoding the phase that is
    used to derive the two numbers factoring our target value N.'
  prefs: []
  type: TYPE_NORMAL
- en: Next, we will explore a new field that has been created from the merge of **Quantum
    Computing** (**QC**) and **Machine Learning** (**ML**), called **Quantum Machine
    Learning** (**QML**) (*Martín-Guerrero et* *al., 2022*).
  prefs: []
  type: TYPE_NORMAL
- en: QML algorithms
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: This discipline combines classical machine learning with quantum capabilities
    to produce better solutions. Enhancing ML algorithms and/or classical training
    with quantum resources broadens the scope of pure ML, as happens with some classical
    devices such as GPUs or TPUs.
  prefs: []
  type: TYPE_NORMAL
- en: It has been extensively reported that using quantum approaches in learning algorithms
    could have several advantages (reviewed by *Schuld et al., 2018*). However, most
    of the earliest research in this framework chased a decrease in computational
    complexity in conjunction with a speedup. Current investigations also study methods
    for quantum techniques to provide unconventional learning representations that
    could even outperform standard ML in the future.
  prefs: []
  type: TYPE_NORMAL
- en: In recent years, the theories and techniques of QC have evolved rapidly, and
    the potential benefits for real-world applications have become increasingly evident
    (*Deb et al., 2021; Egger et al., 2021*). How QC may affect ML is a key topic
    of research. Recent experimentations have demonstrated that quantum computers
    may successfully tackle certain problems with intricate correlations between inputs
    that are exceptionally challenging for conventional systems.
  prefs: []
  type: TYPE_NORMAL
- en: There is a consensus that quantum computers could provide advantages in several
    applications. However, they are not yet a perfect substitute for classical ML.
    The quantum models generated by QC may be significantly more effective for particular
    applications, enabling faster processing time and generalization with less input.
    Consequently, it is crucial to ascertain whether a quantum advantage can be realized.
  prefs: []
  type: TYPE_NORMAL
- en: The following sections offer a thorough review of the most relevant QML algorithms.
  prefs: []
  type: TYPE_NORMAL
- en: Variational Quantum Classifiers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Variational Quantum Classifiers** (**VQCs**) belong to the regime of hybrid
    algorithms as they require a classical interaction in order to set the free parameters
    of the quantum ansatz. The *Variational* part determines how the quantum circuit
    is iteratively trained based on some classical criteria that ensure the parameters
    are selected to make the circuit converge on a target objective. When this objective
    is a classification task between labels of a given dataset, that makes our algorithm
    a VQC (*W. Li et al., 2021*). *Figure 2**.7* shows the canonical steps of the
    VQC. Data must be preprocessed and introduced in the first step to represent the
    classical data as a quantum state. Previously, we have shown examples where the
    Hadamard action set all potential combinations on the initial encoding state.
    We use a feature map (a specific type of quantum circuit) to encode the classical
    data into quantum states. Then a set of parameterized gates are described to represent
    different configurations (we will cover that in detail later), and finally, a
    measuring step where the outcome is obtained. The key step in VQC is the measurement;
    the output becomes classical and is used to update the parameters of the parametrized
    circuit. This procedure is similar to a neural network where the output is used
    to compute the loss.'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.7 – VQC schematic circuit](img/B19146_02_007.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.7 – VQC schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: Gradient- and non-gradient-based techniques can be used to train a QML model.
    The gradient-based approaches are known to be prone to falling into local minima
    of a function during the classical execution.
  prefs: []
  type: TYPE_NORMAL
- en: Quantum regimens may overcome this fact thanks to quantum tunneling, even though
    some problems known to classical methods are magnified in the quantum regime (vanishing
    gradients or barren plateaus, among others). That is why a big effort exists to
    design **parameterized circuits** (**PQC**) or ansatz and methods to deal with
    those issues, in the hope of surpassing classical means.
  prefs: []
  type: TYPE_NORMAL
- en: 'When defining those PQCs, we can also learn from classical ML and mimic what
    is known to be the Swiss Army knife of the field: neural networks.'
  prefs: []
  type: TYPE_NORMAL
- en: Quantum neural networks
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Quantum neural networks** (**QNNs**) are a subtype of VQA that consist of
    circuits with parameterized gate operations (*Abbas et al., 2021*) as described
    earlier. Initially, the information is encoded into prepared quantum states that
    may involve a feature map. Typically, the choice of a specific feature map is
    made to improve the performance of the quantum model that needs to be optimized
    and trained. This feature map, represented as a yellow box in *Figure 2**.8*,
    refers to the step where our data gets encoded into the circuit. After data has
    been encoded into a quantum state, a PQC or ansatz (the variational model in blue)
    with parameterized gates is applied and optimized for a specific job. The states
    at the output of the variational model are then measured to estimate the loss
    function. Then the classical parts estimate the error and propagate it to the
    estimations of the parameters in the PQC. This whole pass from the initialization
    of the qubits to the final measurement phase describes a QNN, as shown in *Figure
    2**.8*.'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.8 – QNN schematic circuit](img/B19146_02_008.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.8 – QNN schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: QNNs are trained using the previously mentioned approaches where gradient-based
    optimizers are very much the ones showing good results in general. The Adam (*Carena
    et al., 2022*) optimizer is one of the most widely used, coming as it does from
    classical neural network optimization. We will see a working example in [*Chapter
    4*](B19146_04.xhtml#_idTextAnchor079) of how to train a QNN using gradient-based
    approaches when dealing with derivative valuation.
  prefs: []
  type: TYPE_NORMAL
- en: Quantum Support Vector Classification (QSVC)
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Supervised classification systems are trained on labeled data and later used
    to predict the labels of unseen data points. This type of training is called supervised
    learning and has also made its way into QML (*Schuld et al., 2018*). Well-known
    classical approaches such as **Support Vector Machines** (**SVMs**) (*Meyer, 2015*)
    have undergone that training and have been used for various large-scale classification
    tasks. We can get an improved separability over the classical data by using previously
    discussed feature maps. This fact is exploited simply by encoding and decoding
    this data into a larger domain using quantum SVMs.
  prefs: []
  type: TYPE_NORMAL
- en: 'In supervised classification, a set of labeled data points indicates whether
    they are related to one particular class. The learning process establishes a dividing
    line or hyperplane between the groups. Kernel-based classifiers, such as SVC,
    rely heavily on the kernel notion (*Park et al., 2020*). A hyperplane cannot typically
    separate data in its original space; therefore, a common strategy is to apply
    a non-linear transformation function (φ), also known as a feature map, to find
    such a hyperplane. The feature map will project the encoded data into a new representation
    (more complex) to transform the data and help the separation. In this function,
    φ : x → F, where F is the feature space. The output of the map on individual data
    points, φ(x) for every x ∈ X, is known as a feature vector.'
  prefs: []
  type: TYPE_NORMAL
- en: Another helpful tool is the kernel trick. The data will be only represented
    by pairwise similarity. Using a kernel trick and a high-dimensional non-linear
    feature map, the quantum kernel approach may be expanded to decision functions
    that depend on non-linear data. In this case, the data is transferred from a lower-dimensional
    space to a higher-dimensional nonlinear Hilbert space (H) (*Skorohod, 2012*),
    sometimes referred to as a feature space. After selecting an appropriate feature
    map, applying the SVM classifier to the mapped data in the Hilbert space is feasible.
    Classifying data points in this new feature space involves evaluating their proximity.
    For its part, the kernel is the collection of inner products between every pair
    of data points.
  prefs: []
  type: TYPE_NORMAL
- en: The execution of these computations is easier on a quantum computer than on
    a regular system. The kernel can be estimated easily using a quantum processor.
    After the kernel matrix has been formed, the quantum kernel information must be
    extracted from the quantum circuit and fed into the SVM or SVC algorithm.
  prefs: []
  type: TYPE_NORMAL
- en: Variational Quantum Eigensolver
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: From the previous definition of VQCs, we know that the **Variational Quantum
    Eigensolver** (**VQE**) is composed of both classical and quantum parts that are
    integreted together to achieve a specific goal. When used to find the state of
    minimum energy, also called the ground state, of a particular Hamiltonian, the
    learning algorithm takes the form of VQE (*Wang et al., 2019*). It belongs to
    the broader family of VQA. It follows the same steps where a classical optimization
    process tweaks the parameters of a given ansatz (PQC) to produce the boundary
    of the minimum expectation of the Hamiltonian upon measurement. The energy expectation
    value is the metric used to drive this training as if it were the cost function
    of any classical ML method.
  prefs: []
  type: TYPE_NORMAL
- en: 'Simply expressed, VQE refers to the usage of a quantum computer, on one hand,
    to assess the energy of an Hamiltonian and usage of a classical computer, and
    on the other hand, to enhance the parameters for energy reduction in the subsequent
    quantum iteration. The concept behind VQE is the implementation of a quantum computer
    for a single purpose: calculating the energy value of a given set of parameters.
    Everything else is carried out on a traditional computer. VQE is mostly utilized
    to predict the characteristics of molecules and materials, and is generally used
    for combinatorial optimization problems such as in the case of portfolio optimization.'
  prefs: []
  type: TYPE_NORMAL
- en: QAOA
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Quantum Approximation Optimization Algorithm** (**QAOA**) is one of the most
    promising techniques for demonstrating quantum advantage (*Choi et al., 2019*).
    QAOA is an approximation method that does not provide the “best” result, but rather
    seeks a “good enough” outcome instead, characterized by the lower bound of the
    approximation ratio.'
  prefs: []
  type: TYPE_NORMAL
- en: It takes inspiration from digitizing the adiabatic approach. The adiabatic theorem
    establishes that if we can start with a simple case where the optimal solution
    is known, then by making small perturbations, we change it to the problem we aim
    to solve. If the target state we obtain at the end of the circuit execution remains
    as the ground state of the problem, its readout will reveal the classical set
    of bits we were looking for.
  prefs: []
  type: TYPE_NORMAL
- en: This is one of the approaches quantum annealers use to solve complex problems.
    One of the digital implementations of this annealing procedure involves the use
    of alternating blocks of operations, where the initial candidates are encoded
    by the superposition of all possible options (the H gates at the beginning of
    *Figure 2**.9*) and a discrete number of steps is added, alternating and enhancing
    our target problem the final quantum states generated is our target state.
  prefs: []
  type: TYPE_NORMAL
- en: Establishing the optimal amount of perturbation required is not trivial, and
    classical optimizers can be used for this to establish the best parameters that
    will work to solve our problem.
  prefs: []
  type: TYPE_NORMAL
- en: The entirety of this process is pictured in *Figure 2**.9*, where β and γ correspond
    to the parameters affecting the problem Hamiltonian (*C* in yellow) and mixer
    Hamiltonian (*B* in green) for *p* levels or layers.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.9 – QAOA schematic circuit](img/B19146_02_009.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.9 – QAOA schematic circuit
  prefs: []
  type: TYPE_NORMAL
- en: For a given NP-Hard problem (*Bittel et al., 2021*), an approximation algorithm
    is a polynomial-time solution that solves all instances of the problem with a
    quality guarantee. The merit value is the ratio between the quality of the polynomial
    time solution and the quality of the actual solution.
  prefs: []
  type: TYPE_NORMAL
- en: Quantum programming
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 'In the last decade, the development of QC has accelerated. A significant example
    is the development of tools to offer solutions using high-level coding languages
    (*Chong et al., 2017; Ganguly et al., 2021*). Quantum programming languages are
    the basis for translating concepts into instructions for quantum computers. Nature
    Reviews (*Heim et al., 2020*) states that quantum programming languages are used
    for the following purposes:'
  prefs: []
  type: TYPE_NORMAL
- en: Examining the QC fundamentals (qubits, superposition, entanglement), then testing
    and validating quantum algorithms and their implementations
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Managing existing physical quantum hardware
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Forecasting the costs of quantum program execution on probable hardware
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Current quantum programming languages primarily aim to optimize quantum gate-based
    low-level circuits. Quantum circuits are constructed from quantum gates and used
    for universal quantum computers. A list of the main quantum gates is provided
    as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.10 – Core gates for quantum computing](img/B19146_02_010.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.10 – Core gates for quantum computing
  prefs: []
  type: TYPE_NORMAL
- en: Quantum programming started in 1996 when E. Knill introduced the **Quantum Random
    Access Machine** (**QRAM**) model and proposed what could be recognized as the
    first convention of quantum pseudocode (*Knill, 1996*). Since then, numerous methods
    have been developed, such as the quantum programming language (QCL) by Ömer (*Ömer,
    2002*), C++ quantum extensions (*McCaskey et al., 2021*), and many other acronyms
    that represent the different evolution stages of these languages.
  prefs: []
  type: TYPE_NORMAL
- en: The focus of this section is to specifically explore quantum **Software Development
    Kits** (**SDKs**), which are tools for developing quantum algorithms to be used
    in quantum computers, simulators, and emulators (*Ablayev et al., 2020*). Microsoft,
    IBM, Google, Xanadu, and Rigetti are among the firms that have released open source
    development kits. SDKs provide the tools for software developers to solve their
    problems and give them access to simulators or quantum computers for the cloud-based
    implementation of their quantum algorithms.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.11 – Comparison of QC programming levels](img/B19146_02_011.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.11 – Comparison of QC programming levels
  prefs: []
  type: TYPE_NORMAL
- en: These kits frequently permit the use of traditional programming languages, such
    as Python, as the main interpreter over which a framework with specific functionalities
    are built. Others prefer to build their own versions of quantum software languages,
    such as Microsoft’s Q#.
  prefs: []
  type: TYPE_NORMAL
- en: Even though we are not yet at the top of the ladder shown in *Figure 2**.11*
    ([https://medium.com/@quantum_wa/quantum-computing-languages-landscape-1bc6dedb2a35](mailto:https://medium.com/@quantum_wa/quantum-computing-languages-landscape-1bc6dedb2a35)),
    different frameworks specialize in particular tasks or fields where certain specific
    hardware implementations perform better than others.
  prefs: []
  type: TYPE_NORMAL
- en: 'The most prominent ecosystems of tools are the following:'
  prefs: []
  type: TYPE_NORMAL
- en: Qiskit from IBM offers high-abstraction modules for finance, among things
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: PennyLane from Xanadu specializes in QML and differentiable computing
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Cirq from Google, which allows the use of Sycamore and QSVM simulators can be
    used
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The **Quantum Development Kit** (**QDK**) from Microsoft for Q# users
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Other SDKs can also be found on the market, usually more specialized or specifically
    related to the efforts of particular companies to improve their own solutions,
    hardware, and infrastructure. These SDKs include the following:'
  prefs: []
  type: TYPE_NORMAL
- en: Ocean from D-Wave
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Orquestra from Zapata
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Braket SDK from **Amazon Web** **Services** (**AWS**)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Anian from Riverlane
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Forest from Rigetti
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: In the following sections, the most relevant SDKs with the largest communities,
    documentation, and online support will be discussed. By making use of these support
    bases, anyone with an average knowledge of math and/or physics can start learning
    from scratch and interacting very quickly with real or simulated quantum devices.
  prefs: []
  type: TYPE_NORMAL
- en: Qiskit
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Qiskit (originally called QISKit) is an SDK for Python released by IBM Research
    in 2017 ([https://qiskit.org/](https://qiskit.org/)). The purpose of this package/library
    is to provide a bridge between quantum algorithms and physical devices so that
    more people can understand and interact with quantum computers. Qiskit was also
    created to help widen access to quantum education and expand quantum information
    challenges and structures.
  prefs: []
  type: TYPE_NORMAL
- en: Currently, Qiskit enables users to quickly construct experiments and applications
    and run them on genuine quantum computers and classical quantum simulators. Another
    aim is the advancement of quantum software, both at the machine-code level with
    OpenQASM and at the abstract level for end users without experience in quantum
    computing.
  prefs: []
  type: TYPE_NORMAL
- en: Since Qiskit is an open source SDK, anyone can cooperate and interact with it.
    It is well known for having the largest QC community in the world, featuring many
    people from different backgrounds and places who collaborate. In 2020, Qiskit
    already comprised 15,000 scientists and developers working in the field using
    Qiskit tools, and over 300,000 people using these resources to learn about quantum
    computation. In 2021, 157 research articles were published involving implementations
    of Qiskit. The community continues to grow today, with certified users and advocates
    all over the globe ([https://quantumcomputingreport.com/](https://quantumcomputingreport.com/)).
  prefs: []
  type: TYPE_NORMAL
- en: The classical elements (Terra, Ignis, Aer, Metal, and Aqua) were used for naming
    Qiskit packages in the early days. This convention has been abandoned in favor
    of more descriptive titles for Qiskit packages. Terra and Aer retain their original
    names, while others have been deprecated and replaced. Aqua, for example, has
    been replaced by high-level application modules, and Ignis by Qiskit Experiments.
    Qiskit Metal is more related to circuit design and thus has a very specific appeal
    to those seeking to design quantum computing chips based on superconducting circuits.
  prefs: []
  type: TYPE_NORMAL
- en: 'Qiskit Terra contains the most relevant functionalities. Across the Qiskit
    ecosystem, Terra is the largest package with the most comprehensive set of quantum
    computation tools; many other packages interact with it. Considering Terra as
    the core of Qiskit, the most interesting part for the business sector is probably
    the high-level applications available, which contain four different products that
    formerly comprised a single bundle (Qiskit Aqua). Each application package focuses
    on an area where QC has the potential to significantly impact the real world,
    as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: Qiskit Nature, with a focus on quantum simulations
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Qiskit Machine Learning, which provides tools for various applications related
    to QML
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Qiskit Finance, which aims to help researchers discover and expand quantum financial
    solutions
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Qiskit Optimization, which offers tools to explore optimization problems, such
    as Traveling Salesman or Knapsack
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*Chapters 4*, *5*, and *6* explore these solutions in depth, mostly focusing
    on Qiskit for Finance, given its interesting modules to develop some topics covered
    in the following chapters. Also, [*Chapter 9*](B19146_09.xhtml#_idTextAnchor165)
    highlights some basic usages of Qiskit Terra and Qiskit Experiments for error
    mitigation. Qiskit Machine Learning will also be mentioned and referenced.'
  prefs: []
  type: TYPE_NORMAL
- en: PennyLane
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: PennyLane presents a robust and novel method to program on quantum computers
    (*Bergholm et al., 2018*). It merges conventional ML libraries with quantum hardware
    and simulators; as a result, users can train quantum computers similarly to neural
    networks. This SDK for Python was released in 2018 by Xanadu and combines the
    most widespread QC systems with the top ML tools through a device-agnostic and
    open source strategy. Data scientists (including ML researchers) who use TensorFlow,
    PyTorch, or NumPy will quickly adapt to PennyLane’s work environment.
  prefs: []
  type: TYPE_NORMAL
- en: As mentioned previously, PennyLane provides a simple Python-based user interface
    compatible with any gate-based QC platform (such as Qiskit), including qubit and
    continuous-variable designs.
  prefs: []
  type: TYPE_NORMAL
- en: The user creates a quantum function circuit coupled to a device, constituting
    a QNode, as illustrated in *Figure 2**.12*. One of the main advantages of PennyLane
    and its approach is that all computations done in the device are taped, which
    means gradients can be directly requested with almost no computational effort.
    This is why it is placed alongside TensorFlow or PyTorch, given that these automatic
    differentiation capabilities have made them successful within the ML community.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.12 – PennyLane basic core structure](img/B19146_02_012.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.12 – PennyLane basic core structure
  prefs: []
  type: TYPE_NORMAL
- en: When dealing with specific needs for QML, as seen in *Chapters 4* and *6*, we
    will see how PennyLane can easily tackle those techniques that may sound complicated
    from a technical standpoint. Further, thanks to PennyLane, implementations are
    easier to tackle at an experimental level.
  prefs: []
  type: TYPE_NORMAL
- en: Cirq
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Another Python framework is Cirq, released by Google in 2018 ([https://github.com/quantumlib/Cirq](https://github.com/quantumlib/Cirq)).
    It can compose, execute, and evaluate quantum computer program results. It was
    built for quantum computers with a few hundred qubits (NISQ) and a few thousand
    quantum gates. At present, with over 3,000 commits since its launch, version 1.0
    of Cirq is available.
  prefs: []
  type: TYPE_NORMAL
- en: 'A thriving community of libraries that facilitate many fields of research in
    QC has developed around Cirq. These libraries include the following:'
  prefs: []
  type: TYPE_NORMAL
- en: '**TensorFlow Quantum**: An instrument for investigating QML.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**OpenFermion**: An open source tool for QC, used in chemical simulations.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Pytket**: A Python-based optimization and manipulation tool for quantum circuits.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Mitiq**: An open source library for error prevention strategies. Developed
    by the non-profit Unitary Fund.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Qsim**: A high-performance state vector emulator created with AVX/FMA vectorized
    instructions. Includes GPU acceleration as an option. Qsimcirq is the Cirq interface
    for gaining access to qsim.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Additionally, Cirq is one element of the Google quantum ecosystem (*Figure 2**.13*)
    that can be integrated with previous SDKs such as PennyLane and other cloud services
    such as Microsoft Azure Quantum.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.13 – Cirq quantum ecosystem](img/B19146_02_013.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.13 – Cirq quantum ecosystem
  prefs: []
  type: TYPE_NORMAL
- en: When no quantum processor is available, Cirq can be tested using Google Quantum
    Virtual Machine, a Colab laptop replicating a Google quantum processor (currently,
    Weber or Rainbow). If greater emulation power is required, it’s simple enough
    to update the Google Quantum Virtual Machine to operate in Google Cloud.
  prefs: []
  type: TYPE_NORMAL
- en: Quantum Development Kit (QDK)
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The QDK was launched by Microsoft in 2017 and comprises the foundational elements
    for getting started in quantum software development (Microsoft, 2017). These include
    the following:'
  prefs: []
  type: TYPE_NORMAL
- en: APIs for QC simulation utilizing .NET or Python
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A language for quantum programming by Microsoft, called Q#
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Development and simulation tools for quantum applications using command-line
    tools
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: This and the other SDKs on the market have recently converged; thus, the QDK
    currently allows the building and running of QC applications using Cirq and Qiskit.
  prefs: []
  type: TYPE_NORMAL
- en: This kit is intended for programmers eager to learn how to program quantum computers.
    No prior knowledge of quantum physics is required. The QDK is an open source structure
    with a suite of documentation, tutorials, libraries, example algorithms, and a
    community of contributors (*Figure 2**.14*). As previously stated, the QDK supports
    various development platforms, including Windows, Linux, and macOS, as well as
    programming languages such as Python.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.14 – The QDK and Microsoft Azure Quantum workflow](img/B19146_02_014.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.14 – The QDK and Microsoft Azure Quantum workflow
  prefs: []
  type: TYPE_NORMAL
- en: The ever-growing Microsoft quantum ecosystem enables problem-solvers from various
    fields and at different skill levels to explore the realm of quantum development
    to address game-changing real-world issues.
  prefs: []
  type: TYPE_NORMAL
- en: Quantum clouds
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Along with programming languages, widespread research and commercial use of
    quantum programs requires the fundamental element of cloud access (*Gong et al.,
    2021*). These cloud solutions are directly linked to quantum circuits and chips
    for the final testing and experiments with quantum algorithms.
  prefs: []
  type: TYPE_NORMAL
- en: 'Cloud access has allowed institutions and individuals to advance their QC exploration.
    Businesses and universities can now experiment with QC on the cloud regardless
    of how technology evolves and becomes popular. This began back in 2016, when IBM
    linked a quantum computer to the cloud and enabled the development and execution
    of basic cloud-based quantum apps (*Castelvecchi, 2017*). By 2022, at least 13
    well-known companies were offering online access to quantum computers:'
  prefs: []
  type: TYPE_NORMAL
- en: Amazon Braket (AWS)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Leap (D-Wave)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: IBM Q Experience (IBM)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Google Quantum AI (Google)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Xanadu Quantum Cloud (Xanadu)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Azure Quantum (Microsoft)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Forest (Rigetti)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Quantum Inspire (Qutech)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Forge (QC Ware)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: AQT
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Quantinuum
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Alibaba Cloud
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Oxford Quantum Circuits
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Quantum cloud services also enable direct connections between users, quantum
    emulators, and simulators. Moreover, some vendors accommodate different programming
    languages, tools, and documentation to help users build QC applications more efficiently.
  prefs: []
  type: TYPE_NORMAL
- en: The following sections will review in depth the most prominent services in this
    field and how they work and evolve.
  prefs: []
  type: TYPE_NORMAL
- en: IBM Quantum
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: As mentioned earlier, IBM launched its QC cloud platform in 2016\. **IBM Quantum
    Experience** has a 5-qubit quantum processor and a simulator. Anyone can access
    7-qubit and 5-qubit quantum machines and cloud simulators for free. Moreover,
    many features in the IBM platform, such as the IBM Quantum Composer, Qiskit examples
    and learning materials, and IBM Quantum Lab, allow users to create, explore, and
    run quantum applications through Jupyter Notebooks.
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.15 – IBM Quantum roadmap](img/B19146_02_015.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.15 – IBM Quantum roadmap
  prefs: []
  type: TYPE_NORMAL
- en: 'IBM’s quantum technology development roadmap may seem quite aggressive but,
    at the same time, it is concrete, as the company has accomplished every intended
    step so far. By 2025, IBM expects to have multiple QPUs interconnected on a new
    arrangement of a 4,158-qubit machine called Kookaburra. If a higher number of
    qubits is required (beyond the free tier of machines), there are also two possibilities:'
  prefs: []
  type: TYPE_NORMAL
- en: 'Pay-as-you-go: Access to the 27-qubit Falcon R5 processors, paying per runtime
    second with a credit card'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Premium plan: Access the 127-qubit Eagle processor and pay through a customized
    agreement as a member of the IBM Quantum Network'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A further important challenge for IBM is the increment of the quantum volume
    of their machines. This is the maximum square circuit of random two-qubit gates
    that a processor can properly execute. Success is considered to be reached when
    the processor can compute the heavy outputs (the most probable outputs of the
    circuit) more than two-thirds of the time with a 2-confidence interval. If a processor
    can employ 8 qubits to operate a circuit with eight-time steps’ worth of gates,
    then its quantum volume is 256 — we raise 2 to the power of the number of qubits.
  prefs: []
  type: TYPE_NORMAL
- en: Amazon Braket
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Amazon Web Services** (**AWS**) launched Amazon Braket in 2019 (*Patterson,
    2019*). Amazon Braket is a quantum cloud **platform as a service** (**PaaS**)
    provided in collaboration with five hardware-based QC companies: D-Wave, IonQ,
    Rigetti, OQC, and Xanadu. Amazon Braket offers not only quantum annealing services
    through D-Wave, but also access to universal quantum computers via different types
    of hardware technologies; these include trapped-ion (IonQ), superconducting (Rigetti
    and OQC), and photonic (Xanadu) technology. Each of these technologies has its
    advantages and drawbacks according to five criteria: well-characterized and scalable
    qubits, qubit initialization, extended coherence duration, universal set of gates,
    and quantification of individual qubits.'
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.16 – AWS quantum roadmap](img/B19146_02_016.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.16 – AWS quantum roadmap
  prefs: []
  type: TYPE_NORMAL
- en: Overall, Amazon Braket offers a coherent set of services based on a Python environment
    to build, test, run, and analyze quantum algorithms based on a Python environment.
    With Braket, users can access universal quantum computers, simulators, hybrid
    jobs, and managed notebooks. Gate-based quantum computers may be utilized through
    a **quantum processing unit** (**QPU**) or a quantum annealer provided by D-Wave.
    Furthermore, users can use the available SDK to build and implement their quantum
    algorithms. **State Vector 1** (**SV1**), **Density Matrix 1** (**DM1**), and
    **Tensor Network 1** (**TN1**) simulators can be employed simultaneously to run
    and test quantum algorithms and mitigate the effect of noise on the algorithm
    performance (*Figure 2**.16*).
  prefs: []
  type: TYPE_NORMAL
- en: To test hybrid algorithms, AWS combines its classical EC2-based computer resources
    (the job instance) with Braket **quantum processing units** (**QPUs**) or quantum
    circuit simulat[ors. Users can also access a notebook](https://aws.amazon.com/braket/pricing/)
    to test quantum algorithms, share code, and visualize the results ([https://aws.amazon.com/braket/pricing/](https://aws.amazon.com/braket/pricing/)).
  prefs: []
  type: TYPE_NORMAL
- en: Amazon Braket offers access to various QC microprocessors at a reasonable price.
    The efficiency of a quantum algorithm can be tested on different systems and a
    use case then developed on the more efficient system.
  prefs: []
  type: TYPE_NORMAL
- en: Microsoft Quantum
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Since 2019, Microsoft has provided researchers, businesses, and developers with
    cloud access to quantum computers (*Kanamori et al., 2020*). The company has created
    a dynamic environment for this ecosystem to thrive and sustain itself by creating
    spaces for enterprises, researchers, and developers to produce, test, and deploy
    quantum algorithms. In particular, the Azure cloud has facilitated access to multiple
    platforms offered by companies like (but not limited to) 1QBit, Quantinuum, QCL,
    and Pasqal (*Figure 2**.17*).
  prefs: []
  type: TYPE_NORMAL
- en: '![Figure 2.17 – Microsoft quantum ecosystem](img/B19146_02_017.jpg)'
  prefs: []
  type: TYPE_IMG
- en: Figure 2.17 – Microsoft quantum ecosystem
  prefs: []
  type: TYPE_NORMAL
- en: 'Microsoft’s quantum services are positioned at three levels: business, researcher,
    and developer. Through its enterprise acceleration program, the company provides
    easy access to the industry via optimization solvers and quantum hardware. Prestigious
    organizations including NASA and Ford have already embarked on explorations of
    quantum computing through the cloud to develop solutions for scheduling problems
    and vehicle tracking. At the same time, by having access to modules such as Cirq,
    Qiskit, and Q#, researchers and developers can now engage in developing new algorithms.'
  prefs: []
  type: TYPE_NORMAL
- en: Summary
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: The foundational quantum computing algorithms have already demonstrated the
    potential benefits of this new computational paradigm, provided that a specific
    set of hardware capable of harnessing the advantages of the physical approach
    is available.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: There is an interesting variety of options regarding quantum and hybrid quantum-classical
    algorithms for solving problems related to machine learning, optimization, and
    simulation. Most have documentation and open source code available to reduce the
    learning curve for new adopters.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Quantum computers are a reality since anyone who needs to can access them and
    start the process of research and discovery toward a potential solution. Also,
    if there is commercial interest, multiple cloud services provide access to several
    quantum technologies that can be explored in parallel with high computational
    power to run quantum simulators.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
